<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkout | Fridge Chef Pro</title>
<meta name="robots" content="noindex">
<style>
body{font-family:system-ui,-apple-system,sans-serif;background:#EEF4F4;color:#10282B;max-width:480px;margin:50px auto;padding:0 20px}
.card{background:#fff;border:1px solid #C9DADA;border-radius:16px;padding:28px}
h1{font-size:1.3rem;margin:8px 0 6px}.sub{color:#547074;font-size:.9rem;margin:0 0 18px}
select,button{font:inherit}select{width:100%;padding:10px;border-radius:8px;border:1px solid #C9DADA;margin-bottom:14px}
button{width:100%;padding:12px;border-radius:999px;border:0;background:#0E5A57;color:#fff;font-weight:600;cursor:pointer}
button:disabled{opacity:.6}.alt{background:#fff;color:#0E5A57;border:2px solid #0E5A57}
.badge{display:inline-block;background:#dff0ee;color:#0E5A57;font-weight:700;font-size:.75rem;padding:3px 10px;border-radius:99px}
.pay,.lic{display:none;margin-top:20px;padding:18px;border-radius:12px}.pay{border:1px dashed #0E5A57}.lic{border:2px solid #0E5A57;background:#f0f9f8}
.pay img{display:block;margin:0 auto 12px}.amt{font-size:1.4rem;font-weight:800;text-align:center;margin-bottom:12px}
.addr{word-break:break-all;background:#eef4f4;padding:10px;border-radius:8px;font:.82rem monospace;margin-bottom:10px}
.st{text-align:center;font-size:.9rem;color:#547074;margin-top:12px}.st.ok{color:#0E5A57;font-weight:700}.st.err{color:#B3341F;font-weight:600}
textarea{width:100%;box-sizing:border-box;font:.78rem monospace;padding:10px;border-radius:8px;border:1px solid #C9DADA;height:90px;resize:none;margin-bottom:10px}
.on{background:#0E5A57!important;color:#fff!important}.row{display:flex;gap:8px}.row button{padding:10px}.fine{font-size:.8rem;color:#547074;margin-top:14px}
</style></head><body><div class="card">
<span class="badge" id="badge"></span>
<h1>Fridge Chef Pro</h1><p class="sub" id="sub"></p>
<div class="row" id="sw" style="margin-bottom:14px"><button class="alt" data-p="monthly"></button><button class="alt" data-p="yearly"></button></div>
<select id="cur">
<option value="USDT_TRC20">USDT (TRC20 / Tron)</option><option value="USDT_ERC20">USDT (ERC20 / Ethereum)</option>
<option value="BTC">Bitcoin (BTC)</option><option value="ETH">Ethereum (ETH)</option><option value="USDT_SOL">USDT (Solana)</option>
<option value="DOGE">Dogecoin (DOGE)</option><option value="LTC">Litecoin (LTC)</option><option value="XRP">Ripple (XRP)</option>
<option value="ADA">Cardano (ADA)</option><option value="USDT_AVAX">USDT (Avalanche)</option><option value="USDT_BEP20">USDT (BNB Chain)</option>
</select>
<button id="go">Generate payment address</button>
<div class="pay" id="pay"><div class="amt" id="amt"></div><div class="addr" id="addr"></div>
<img id="qr" width="180" height="180" alt="Payment QR code"><div class="st" id="st">Waiting for payment…</div></div>
<div class="lic" id="lic"><b>Payment confirmed</b>
<p class="sub">Your Pro key is saved when you tap Open Fridge Chef. Keep a copy in case you switch device.</p>
<textarea id="key" readonly></textarea>
<div class="row"><button class="alt" id="cp">Copy key</button><button class="alt" id="dl">Download .txt</button></div>
<div class="fine" id="exp"></div><button id="open" style="margin-top:14px">Open Fridge Chef</button></div>
<p class="fine">Pro is prepaid for the period shown and does not renew automatically. Buy again when it ends.</p>
</div>
<script>
const PAY="https://morning-shape-c098.alice56885236.workers.dev";
const LIC="https://fridge-chef.alice56885236.workers.dev/api/license";
const PLANS={monthly:{id:"fridge-chef-monthly",price:5.99,label:"Pro · 30 days"},yearly:{id:"fridge-chef-yearly",price:49,label:"Pro · 1 year"}};
let plan=new URLSearchParams(location.search).get("plan")==="yearly"?"yearly":"monthly",P=PLANS[plan];
const $=i=>document.getElementById(i);let timer;
function draw(){$("badge").textContent=P.label;$("sub").textContent="$"+P.price+" · pay with the crypto of your choice";
 document.querySelectorAll("#sw button").forEach(b=>{const q=PLANS[b.dataset.p];b.textContent="$"+q.price+(b.dataset.p==="yearly"?" / 1 year (save 32%)":" / 30 days");b.classList.toggle("on",b.dataset.p===plan)})}
document.querySelectorAll("#sw button").forEach(b=>b.onclick=()=>{plan=b.dataset.p;P=PLANS[plan];history.replaceState(null,"","?plan="+plan);draw()});
draw();
const st=(t,c)=>{$("st").textContent=t;$("st").className="st "+(c||"")};
const reset=()=>{$("go").disabled=false;$("go").textContent="Generate payment address"};
$("go").onclick=async()=>{
 $("go").disabled=true;$("go").textContent="Creating order…";
 let o;try{o=await(await fetch(PAY+"/order",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({productId:P.id,currency:$("cur").value})})).json()}
 catch(e){$("pay").style.display="block";st("Could not reach the payment server.","err");return reset()}
 if(o.error){$("pay").style.display="block";st("Error: "+o.error,"err");return reset()}
 $("amt").textContent=o.amount+" "+o.currency.replace("_"," ");$("addr").textContent=o.address;
 $("qr").src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data="+encodeURIComponent(o.address);
 $("pay").style.display="block";$("go").style.display="none";$("sw").style.display="none";st("Waiting for payment…");
 timer=setInterval(()=>poll(o.id),8000)};
async function poll(id){let d;try{d=await(await fetch(PAY+"/order/"+id+"/status")).json()}catch(e){return}
 if(d.status==="paid"){clearInterval(timer);st("Payment confirmed! Issuing your key…","ok");license(id)}
 else if(d.status==="expired"){clearInterval(timer);st("This payment window expired. Refresh and try again.","err")}}
async function license(id){
 for(let i=0;i<5;i++){try{const d=await(await fetch(LIC+"/"+id+"?plan="+plan)).json();
  if(d.error){st("Error issuing key: "+d.error,"err");return}
  if(d.status==="paid"&&d.token){$("pay").style.display="none";$("lic").style.display="block";$("key").value=d.token;
   $("exp").textContent="Valid until "+new Date(d.exp*1000).toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"});return}}catch(e){}
  await new Promise(r=>setTimeout(r,2500))}
 st("Paid, but the key is taking longer than usual. Refresh in a minute. Your order id: "+id,"err")}
$("cp").onclick=()=>navigator.clipboard.writeText($("key").value).then(()=>{$("cp").textContent="Copied!";setTimeout(()=>$("cp").textContent="Copy key",1500)});
$("dl").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([$("key").value],{type:"text/plain"}));a.download="fridge-chef-pro-key.txt";a.click()};
$("open").onclick=()=>{location.href="index.html#key="+encodeURIComponent($("key").value)};
</script></body></html>
