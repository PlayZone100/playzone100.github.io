<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Trend Studio — QuestMart</title>
<style>
  :root {
    --bg: #0f0f12;
    --card: #1a1a1f;
    --accent: #ff6b6b;
    --text: #f2f2f2;
    --muted: #9a9aa5;
    --border: #2a2a30;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.6rem; margin-bottom: 4px; }
  .sub { color: var(--muted); margin-bottom: 24px; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
  }

  .styles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; max-height: 260px; overflow-y: auto; }
  .style-btn {
    padding: 10px 6px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #232329;
    color: var(--text);
    cursor: pointer;
    font-size: 0.85rem;
  }
  .style-btn.selected { border-color: var(--accent); background: #2a1a1c; }

  .upload-zone {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 30px;
    text-align: center;
    cursor: pointer;
    color: var(--muted);
  }
  .upload-zone:hover { border-color: var(--accent); }
  input[type=file] { display: none; }

  button.primary {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
  }
  button.primary:disabled { opacity: 0.5; cursor: not-allowed; }

  img.preview, img.result { width: 100%; border-radius: 12px; margin-top: 12px; }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }

  .paywall {
    text-align: center;
    padding: 20px;
  }
  .paywall a.buy {
    display: inline-block;
    margin-top: 12px;
    padding: 12px 24px;
    background: var(--accent);
    color: #fff;
    border-radius: 10px;
    text-decoration: none;
    font-weight: 600;
  }
  .status { font-size: 0.85rem; color: var(--muted); margin-top: 6px; text-align: center; }
  .error { color: var(--accent); font-size: 0.9rem; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📸 Photo Trend Studio</h1>
  <p class="sub">Turn any photo into a viral retro, cinematic or polaroid style. Free to try.</p>

  <div class="card">
    <div class="upload-zone" id="uploadZone">
      <div id="uploadLabel">Tap to upload a photo</div>
      <img id="preview" class="preview" style="display:none">
    </div>
    <input type="file" id="fileInput" accept="image/*">

    <div class="styles" id="styleList"></div>

    <button class="primary" id="goBtn" disabled>Transform photo</button>
    <div class="error" id="errorMsg" style="display:none"></div>
    <div class="status" id="statusLine"></div>
  </div>

  <div class="card" id="resultCard" style="display:none">
    <img id="resultImg" class="result">
    <div class="row" style="margin-top:12px">
      <div><button class="primary" id="downloadBtn">Download</button></div>
    </div>
  </div>

  <div class="card paywall" id="paywallCard" style="display:none">
    <h3>You've used your free transform</h3>
    <p class="sub">Upgrade to Pro for unlimited transforms, all styles, no watermark.</p>
    <!-- Real checkout page — checkout.html lives in this SAME folder. -->
    <div class="row" style="gap:8px">
      <a class="buy" style="flex:1" href="checkout.html?plan=monthly">Monthly — $6</a>
      <a class="buy" style="flex:1" href="checkout.html?plan=yearly">Yearly — $45</a>
    </div>
    <p class="sub" style="margin-top:10px">Already have an activation code?</p>
    <div class="row" style="gap:8px">
      <input type="text" id="licenseInput" placeholder="Paste your license key" style="flex:1;padding:10px;border-radius:8px;border:1px solid var(--border);background:#232329;color:var(--text);">
      <button class="primary" id="activateBtn" style="width:auto;margin:0;padding:10px 16px">Activate</button>
    </div>
  </div>
</div>

<script>
// ---- CONFIG ----
// Replace with your deployed worker URL for this product.
const WORKER_URL = 'https://photo-trend-workerjs.alice56885236.workers.dev';

const STYLES = [
  { key: 'retro80s', label: '80s Portrait' },
  { key: 'retro90s', label: '90s Throwback' },
  { key: 'cinematic', label: 'Cinematic' },
  { key: 'polaroid', label: 'Polaroid' },
  { key: 'y2k', label: 'Y2K Digicam' },
  { key: 'animeStyle', label: 'Anime' },
  { key: 'chibi', label: 'Chibi Avatar' },
  { key: 'vaporwave', label: 'Vaporwave' },
  { key: 'filmNoir', label: 'Film Noir' },
  { key: 'vintageRegional', label: 'Vintage Studio' },
  { key: 'disposableCam', label: 'Disposable Cam' },
  { key: 'watercolor', label: 'Watercolor' },
  { key: 'oilPainting', label: 'Oil Painting' },
  { key: 'comicBook', label: 'Comic Book' },
  { key: 'pixelArt', label: 'Pixel Art' },
  { key: 'fantasyArt', label: 'Fantasy Art' },
  { key: 'cyberpunk', label: 'Cyberpunk' },
  { key: 'sepiaVintage', label: 'Old Sepia Photo' },
  { key: 'claymation', label: 'Claymation' },
  { key: 'animated3d', label: '3D Animated' },
  { key: 'glitchArt', label: 'Glitch Art' },
  { key: 'doubleExposure', label: 'Double Exposure' },
  { key: 'lowPoly', label: 'Low Poly 3D' },
  { key: 'voxelArt', label: 'Voxel Art' },
  { key: 'stainedGlass', label: 'Stained Glass' },
  { key: 'mosaicTile', label: 'Mosaic' },
  { key: 'inkSketch', label: 'Pencil Sketch' },
  { key: 'charcoalDrawing', label: 'Charcoal Drawing' },
  { key: 'inkWash', label: 'Ink Wash' },
  { key: 'popArt', label: 'Pop Art' },
  { key: 'artDeco', label: 'Art Deco' },
  { key: 'steampunk', label: 'Steampunk' },
  { key: 'gothic', label: 'Gothic' },
  { key: 'baroque', label: 'Baroque Painting' },
  { key: 'impressionist', label: 'Impressionist' },
  { key: 'surrealist', label: 'Surrealist' },
  { key: 'cubist', label: 'Cubist' },
  { key: 'medievalTapestry', label: 'Medieval Tapestry' },
  { key: 'samurai', label: 'Samurai Era' },
  { key: 'westernOldWest', label: 'Old West' },
  { key: 'travelPoster', label: 'Travel Poster' },
  { key: 'discoEra', label: '70s Disco' },
  { key: 'punkPoster', label: 'Punk Poster' },
  { key: 'grungeEra', label: '90s Grunge' },
  { key: 'holographic', label: 'Holographic' },
  { key: 'chromeMetallic', label: 'Chrome Metallic' },
  { key: 'underwaterDream', label: 'Underwater Dream' },
  { key: 'desertMirage', label: 'Desert Mirage' },
  { key: 'spaceExplorer', label: 'Space Explorer' },
  { key: 'fairyTale', label: 'Fairy Tale' },
];

let selectedStyle = 'retro80s';
let uploadedDataUrl = null;

// Same localStorage key convention as your other products — stores the
// license token issued after a Pro purchase, checked by the worker.
function getLicense() {
  try { return localStorage.getItem('qm_license') || ''; } catch (e) { return ''; }
}

function renderStyles() {
  const list = document.getElementById('styleList');
  list.innerHTML = '';
  STYLES.forEach((s) => {
    const btn = document.createElement('button');
    btn.className = 'style-btn' + (s.key === selectedStyle ? ' selected' : '');
    btn.textContent = s.label;
    btn.onclick = () => { selectedStyle = s.key; renderStyles(); };
    list.appendChild(btn);
  });
}
renderStyles();

document.getElementById('activateBtn').onclick = () => {
  const val = document.getElementById('licenseInput').value.trim();
  if (!val) return;
  try { localStorage.setItem('qm_license', val); } catch (e) {}
  refreshStatus();
  document.getElementById('activateBtn').textContent = 'Activated ✓';
  setTimeout(() => { document.getElementById('activateBtn').textContent = 'Activate'; }, 1500);
};

document.getElementById('uploadZone').onclick = () => document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    uploadedDataUrl = reader.result;
    const preview = document.getElementById('preview');
    preview.src = uploadedDataUrl;
    preview.style.display = 'block';
    document.getElementById('uploadLabel').style.display = 'none';
    document.getElementById('goBtn').disabled = false;
  };
  reader.readAsDataURL(file);
};

async function refreshStatus() {
  try {
    const r = await fetch(WORKER_URL + '/status', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ license: getLicense() }),
    });
    const d = await r.json();
    const left = d.left && d.left.transform;
    document.getElementById('statusLine').textContent = d.pro
      ? 'Pro — unlimited transforms'
      : (left > 0 ? left + ' free transform left' : 'Free transform used');
  } catch (e) { /* ignore */ }
}
refreshStatus();

document.getElementById('goBtn').onclick = async () => {
  if (!uploadedDataUrl) return;
  const errorEl = document.getElementById('errorMsg');
  errorEl.style.display = 'none';
  document.getElementById('paywallCard').style.display = 'none';
  const goBtn = document.getElementById('goBtn');
  goBtn.disabled = true;
  goBtn.textContent = 'Transforming…';

  try {
    const r = await fetch(WORKER_URL + '/transform', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: uploadedDataUrl, style: selectedStyle, license: getLicense() }),
    });
    const d = await r.json();

    if (r.status === 402 || d.paywall) {
      document.getElementById('paywallCard').style.display = 'block';
    } else if (!r.ok) {
      errorEl.textContent = d.error || 'Something went wrong.';
      errorEl.style.display = 'block';
    } else {
      document.getElementById('resultImg').src = d.image;
      document.getElementById('resultCard').style.display = 'block';
      document.getElementById('downloadBtn').onclick = () => {
        const a = document.createElement('a');
        a.href = d.image;
        a.download = 'photo-trend-result.png';
        a.click();
      };
    }
    refreshStatus();
  } catch (e) {
    errorEl.textContent = 'Network error. Please try again.';
    errorEl.style.display = 'block';
  } finally {
    goBtn.disabled = false;
    goBtn.textContent = 'Transform photo';
  }
};
</script>
</body>
</html>
