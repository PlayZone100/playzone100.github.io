<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#123524"><title>Monkey Banana Rush — Play Online</title><style>:root{--g:#123524;--gold:#ffd84d;--cream:#fff8ed}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:system-ui,sans-serif;background:radial-gradient(circle at top,#286c49,#07150e 72%);color:#fff}body{display:grid;place-items:center;padding:14px;overflow:hidden;user-select:none}.shell{width:min(410px,100%)}header{display:flex;justify-content:space-between;margin:0 4px 10px;font-weight:900;color:var(--gold)}header small{color:#d8eee2;opacity:.7}.frame{position:relative;overflow:hidden;aspect-ratio:3/5;border:3px solid #1f5c3f;border-radius:24px;background:#dff4ff;box-shadow:0 22px 50px #0009}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:absolute;z-index:2;top:11px;left:11px;right:11px;display:flex;justify-content:space-between;pointer-events:none}.pill,.sound{background:#092318d9;color:#fff;border:0;border-radius:999px;padding:6px 11px;font-weight:900}.sound{width:34px;height:34px;padding:0;font-size:16px;pointer-events:auto}.overlay{position:absolute;z-index:4;inset:0;display:grid;place-items:center;padding:20px;background:#08281cdd;text-align:center}.hidden{display:none!important}.card{width:min(100%,292px);padding:23px 22px;border-radius:22px;background:var(--cream);color:#1c1b18;box-shadow:0 20px 40px #0008}.card .big{font-size:3rem}.card h1{font-size:1.4rem;margin:7px 0}.card p{color:#4a453d;line-height:1.45;font-size:.85rem}.btn{width:100%;border:0;border-radius:999px;padding:13px;background:#1c1b18;color:#fff;font-weight:900;font-size:1rem;box-shadow:0 6px #000}.help{text-align:center;margin:10px 0;color:#d8eee288;font-size:.72rem}</style></head><body><main class="shell"><header><span>🍃 Monkey Banana Rush</span><small>WEB GAME</small></header><section class="frame"><canvas id="game" width="360" height="600"></canvas><div class="hud"><div class="pill">⭐ <span id="score">0</span></div><div><span class="pill" id="lives">❤️❤️❤️</span><button class="sound" id="sound">🔊</button></div></div><div id="start" class="overlay"><div class="card"><div class="big">🐒🍌</div><h1>Monkey Banana Rush</h1><p>Tap, click, or press Space to jump. Collect bananas and dodge coconuts!</p><button class="btn" id="play">Play now</button></div></div><div id="over" class="overlay hidden"><div class="card"><div class="big">🙈</div><h1>Game over</h1><p>Your score: <b id="final">0</b></p><button class="btn" id="again">Play again</button></div></div></section><p class="help">Tap or press Space to hop</p></main><script>(()=>{const c=document.querySelector('canvas'),x=c.getContext('2d'),W=360,H=600,G=522,MX=86,$=id=>document.getElementById(id);let s='start',sc=0,life=3,y=G-58,vy=0,last=0,bs=[],hs=[],ps=[],muted=0,audio;function hud(){$('score').textContent=sc;$('lives').textContent='❤️'.repeat(Math.max(0,life))||'—'}function sound(f,d=.1){if(!audio||muted)return;let o=audio.createOscillator(),g=audio.createGain(),n=audio.currentTime;o.frequency.value=f;g.gain.setValueAtTime(.08,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g).connect(audio.destination);o.start();o.stop(n+d)}function begin(){audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume?.();s='play';sc=0;life=3;y=G-58;vy=0;bs=[];hs=[];ps=[];$('start').classList.add('hidden');$('over').classList.add('hidden');hud()}function jump(){if(s!=='play')return begin();if(y>=G-59){vy=-700;sound(430,.08)}}function limb(a,b,len,ang,col,w){x.save();x.translate(a,b);x.rotate(ang);x.strokeStyle=col;x.lineWidth=w;x.lineCap='round';x.beginPath();x.moveTo(0,0);x.lineTo(0,len);x.stroke();x.restore()}function monkey(t){let r=Math.sin(t*.016),air=y<G-59,tilt=air?Math.max(-.22,Math.min(.22,vy*.00016)):r*.06;x.save();x.translate(MX,y-10);x.rotate(tilt);limb(-15,18,27,air?-.35:r*.8,'#5b280a',7);limb(13,18,27,air?.4:-r*.8,'#5b280a',7);limb(-21,-1,24,air?-.55:-r*.9,'#8b4513',6);limb(20,-1,24,air?.55:r*.9,'#8b4513',6);x.fillStyle='#8b4513';x.beginPath();x.ellipse(0,0,24,28,0,0,7);x.fill();x.fillStyle='#5b280a';x.beginPath();x.moveTo(13,10);x.bezierCurveTo(45,30,43,-25,14,-30);x.closePath();x.fill();x.fillStyle='#8b4513';x.beginPath();x.arc(0,-27,27,0,7);x.fill();x.fillStyle='#5b280a';x.beginPath();x.arc(-24,-32,11,0,7);x.arc(24,-32,11,0,7);x.fill();x.fillStyle='#ffd2a6';x.beginPath();x.ellipse(0,-17,19,14,0,0,7);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(-9,-30,7,0,7);x.arc(9,-30,7,0,7);x.fill();x.fillStyle='#111';x.beginPath();x.arc(-9,-29,3,0,7);x.arc(9,-29,3,0,7);x.fill();x.fillStyle='#211';x.beginPath();x.arc(0,-16,3,0,7);x.fill();x.strokeStyle='#3d1f00';x.lineWidth=2;x.beginPath();x.arc(0,-12,9,.15,Math.PI-.15);x.stroke();x.restore()}function draw(t){let sky=x.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#8fd6f2');sky.addColorStop(1,'#eaf9ff');x.fillStyle=sky;x.fillRect(0,0,W,H);x.fillStyle='#ffffff99';[[60,70],[205,110],[300,50]].forEach(([a,b])=>{x.beginPath();x.arc(a,b,18,0,7);x.arc(a+18,b+4,13,0,7);x.arc(a-14,b+5,12,0,7);x.fill()});x.fillStyle='#4caf50';x.fillRect(0,G,W,H-G);x.fillStyle='#81c784';x.fillRect(0,G,W,8);bs.forEach(b=>{x.save();x.translate(b.x,b.y);x.rotate(Math.sin(b.r)*.3);x.fillStyle='#ffd400';x.beginPath();x.ellipse(0,0,11,15,.2,0,7);x.fill();x.fillStyle='#4a2c0a';x.fillRect(-2,-17,4,6);x.restore()});hs.forEach(h=>{x.fillStyle='#8b5a2b';x.beginPath();x.arc(h.x,h.y,18,0,7);x.fill();x.strokeStyle='#4d2d12';x.lineWidth=3;x.beginPath();x.arc(h.x,h.y,12,0,7);x.stroke()});ps.forEach(p=>{x.globalAlpha=p.l;x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,4,0,7);x.fill();x.globalAlpha=1});monkey(t)}function burst(a,b,col){for(let i=0;i<8;i++)ps.push({x:a,y:b,vx:(Math.random()-.5)*120,vy:(Math.random()-.5)*120,l:1,c:col})}function update(t,dt){if(s!=='play')return;vy+=1800*dt;y+=vy*dt;if(y>G-58)y=G-58,vy=0;if(y<45)y=45,vy=0;if(!bs.next||t-bs.next>900){bs.next=t;bs.push({x:390,y:150+Math.random()*250,r:0,v:140+sc*.2})}if(!hs.next||t-hs.next>1450){hs.next=t;hs.push({x:390,y:G-20,v:185+sc*.3})}for(let i=bs.length-1;i>=0;i--){let b=bs[i];b.x-=b.v*dt;b.r+=dt*7;if(b.x< -30)bs.splice(i,1);else if(Math.hypot(b.x-MX,b.y-y)<34){bs.splice(i,1);sc+=10;burst(b.x,b.y,'#ffd700');sound(880,.07);hud()}}for(let i=hs.length-1;i>=0;i--){let h=hs[i];h.x-=h.v*dt;if(h.x<-30)hs.splice(i,1);else if(Math.hypot(h.x-MX,h.y-y)<36){hs.splice(i,1);life--;burst(h.x,h.y,'#e44');hud();if(!life){s='over';$('final').textContent=sc;$('over').classList.remove('hidden');sound(120,.3)}}}for(let i=ps.length-1;i>=0;i--){let p=ps[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=250*dt;p.l-=dt*2;if(p.l<=0)ps.splice(i,1)}}function loop(t){let dt=Math.min(.03,(t-last||0)/1000);last=t;update(t,dt);draw(t);requestAnimationFrame(loop)}$('play').onclick=begin;$('again').onclick=begin;$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'🔇':'🔊'};c.addEventListener('pointerdown',e=>{e.preventDefault();jump()},{passive:false});addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();jump()}});hud();requestAnimationFrame(loop)})()</script></body></html>
