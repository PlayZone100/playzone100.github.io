<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#123524"><title>Monkey Banana Rush — Web Demo</title>
<style>
:root{--green:#123524;--gold:#ffd84d;--cream:#fff8ed}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:system-ui,sans-serif;background:radial-gradient(100% 80% at 50% 0,#286c49,#07150e 72%);color:#fff}body{display:grid;place-items:center;padding:14px;overflow:hidden;user-select:none}.shell{width:min(410px,100%)}header{display:flex;justify-content:space-between;margin:0 4px 10px;font-weight:900;color:var(--gold)}header small{font-size:.7rem;color:#d8eee2;opacity:.7}.frame{position:relative;overflow:hidden;aspect-ratio:3/5;border:3px solid #1f5c3f;border-radius:24px;background:#dff4ff;box-shadow:0 22px 50px #0009}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:absolute;z-index:2;top:11px;left:11px;right:11px;display:flex;justify-content:space-between;pointer-events:none}.right{display:flex;gap:6px;align-items:center}.pill,.sound{background:#092318c9;color:#fff;border:0;border-radius:999px;padding:6px 11px;font-weight:900}.sound{width:34px;height:34px;padding:0;font-size:16px;pointer-events:auto}.gold{color:var(--gold)!important}.overlay{position:absolute;z-index:4;inset:0;display:grid;place-items:center;padding:20px;background:linear-gradient(#103c5ccc,#06150edb);text-align:center}.hidden{display:none!important}.card{width:min(100%,292px);padding:23px 22px 21px;border-radius:22px;background:var(--cream);color:#1c1b18;box-shadow:0 20px 40px #0008}.emoji{font-size:2.8rem;line-height:1}.card h1{font-size:1.4rem;margin:7px 0 5px}.card p{margin:0 0 17px;color:#4a453d;line-height:1.45;font-size:.85rem}.btn{width:100%;border:0;border-radius:999px;padding:13px;background:#1c1b18;color:#fff;font-weight:900;font-size:1rem;box-shadow:0 6px #000;cursor:pointer}.btn.alt{margin-top:10px;background:#fff1d9;color:#1c1b18;box-shadow:0 5px #0002}.stats{display:flex;gap:10px;margin:14px 0 17px}.stat{flex:1;padding:10px;background:#fff1d9;border-radius:14px;font-size:1.35rem;font-weight:900}.stat span{display:block;color:#8a8378;font-size:.62rem;letter-spacing:.12em}.help{text-align:center;margin:10px 0 0;color:#d8eee288;font-size:.72rem}
</style>
</head>
<body>
<main class="shell">
  <header><span>🍃 Monkey Banana Rush</span><small>WEB DEMO</small></header>
  <section class="frame">
    <canvas id="game" width="360" height="600"></canvas>
    <div class="hud">
      <div class="right"><div class="pill">⭐ <span id="score">0</span></div><div class="pill gold">🏆 <span id="best">0</span></div></div>
      <div class="right"><div class="pill" id="lives">❤️❤️❤️</div><button class="sound" id="sound">🔊</button></div>
    </div>
    <div id="start" class="overlay"><div class="card"><div class="emoji">🐒🍌</div><h1>Ready to rush?</h1><p>Tap, click, or press Space to jump. Collect bananas and dodge coconuts!</p><button class="btn" id="play">Tap to start</button></div></div>
    <div id="over" class="overlay hidden"><div class="card"><small>GAME OVER</small><div class="emoji">🍌</div><div class="stats"><div class="stat"><span>SCORE</span><b id="final">0</b></div><div class="stat"><span>BANANAS</span><b id="coins">0</b></div></div><button class="btn" id="again">Play again</button><button class="btn alt" id="share">Share my score</button></div></div>
  </section>
  <p class="help">Tap or press Space to hop · Sound starts after your first tap</p>
</main>
<script>
(() => {
  'use strict';
  const c = document.getElementById('game');
  const ctx = c.getContext('2d');
  const W = 360, H = 600, GROUND = 522, MONKEY_X = 86;
  let state = 'start', score = 0, coins = 0, lives = 3, best = +(localStorage.mbrBest || 0), y = 445, vy = 0, last = 0;
  let spawnBanana = 0, spawnHazard = 0, shake = 0, muted = false, audio = null;
  const bananas = [], hazards = [], particles = [];
  const $ = (id) => document.getElementById(id);

  function hud() {
    $('score').textContent = score;
    $('best').textContent = best;
    $('lives').textContent = '❤️'.repeat(Math.max(0, lives)) || '—';
  }

  function beep(freq, dur = 0.12) {
    if (muted || !audio) return;
    const now = audio.currentTime;
    const os = audio.createOscillator();
    const gain = audio.createGain();
    os.type = 'sine';
    os.frequency.value = freq;
    gain.gain.setValueAtTime(0.08, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
    os.connect(gain).connect(audio.destination);
    os.start(now);
    os.stop(now + dur);
  }

  function ensureAudio() {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') audio.resume();
  }

  function start() {
    ensureAudio();
    state = 'play';
    score = 0; coins = 0; lives = 3;
    y = 445; vy = 0; spawnBanana = performance.now(); spawnHazard = performance.now();
    bananas.length = 0; hazards.length = 0; particles.length = 0;
    $('start').classList.add('hidden');
    $('over').classList.add('hidden');
    hud();
    beep(640, 0.11);
  }

  function jump() {
    if (state !== 'play') {
      start();
      return;
    }
    if (y >= GROUND - 58) {
      vy = -690;
      beep(420, 0.08);
    }
  }

  function gameOver() {
    state = 'over';
    best = Math.max(best, score);
    localStorage.mbrBest = best;
    $('final').textContent = score;
    $('coins').textContent = coins;
    $('over').classList.remove('hidden');
    hud();
    beep(120, 0.27);
  }

  function burst(x, y, color) {
    for (let i = 0; i < 10; i++) {
      particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 130,
        vy: (Math.random() - 0.5) * 120,
        life: 1,
        color,
      });
    }
  }

  function addBanana() {
    bananas.push({ x: 390, y: 150 + Math.random() * 250, r: 0, speed: 135 + score * 0.22 });
  }

  function addHazard() {
    hazards.push({ x: 390, y: GROUND - 26 - Math.random() * 135, r: 18, speed: 185 + score * 0.32 });
  }

  function drawLimb(x, y, len, ang, color = '#6b2f0b', lineWidth = 6) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(ang);
    ctx.strokeStyle = color;
    ctx.lineWidth = lineWidth;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(0, len);
    ctx.stroke();
    ctx.restore();
  }

  function drawMonkey(t) {
    const run = state === 'play' ? Math.sin(t * 0.015) : 0;
    const airborne = y < GROUND - 58;
    const bodyY = y - 10 + (airborne ? 0 : Math.abs(run) * 4);
    const bodyTilt = airborne ? Math.max(-0.2, Math.min(0.25, vy * 0.00015)) : Math.sin(t * 0.015) * 0.08;

    ctx.save();
    ctx.translate(MONKEY_X, bodyY);
    ctx.rotate(bodyTilt);

    // back leg and front leg
    const legFront = airborne ? -0.3 : run * 0.8;
    const legBack = airborne ? 0.45 : -run * 0.8;
    drawLimb(-14, 18, 26, legFront, '#6b2f0b', 6);
    drawLimb(12, 18, 26, legBack, '#6b2f0b', 6);

    // arms
    const armFront = airborne ? -0.5 : -run * 0.9;
    const armBack = airborne ? 0.5 : run * 0.9;
    drawLimb(-20, -2, 22, armFront, '#8b4513', 5);
    drawLimb(20, -2, 22, armBack, '#8b4513', 5);

    // torso and head
    ctx.fillStyle = '#8b4513';
    ctx.beginPath();
    ctx.ellipse(0, 0, 23, 27, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#6b2f0b';
    ctx.beginPath();
    ctx.moveTo(15, 12);
    ctx.bezierCurveTo(38, 22, 38, -22, 16, -28);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#ffd9b4';
    ctx.beginPath();
    ctx.ellipse(0, -21, 18, 13, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(-7, -25, 5.5, 0, Math.PI * 2); ctx.arc(7, -25, 5.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(-7, -25, 2.3, 0, Math.PI * 2); ctx.arc(7, -25, 2.3, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#3d1f00';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, -13, 8, 0.2, Math.PI - 0.2);
    ctx.stroke();

    ctx.restore();
  }

  function drawBanana(b) {
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(Math.sin(b.r) * 0.25);
    ctx.fillStyle = '#ffd400';
    ctx.beginPath();
    ctx.ellipse(0, 0, 11, 15, 0.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#4a2c0a';
    ctx.fillRect(-2, -17, 4, 6);
    ctx.restore();
  }

  function drawHazard(h) {
    ctx.save();
    ctx.translate(h.x, h.y);
    ctx.fillStyle = '#e13f45';
    ctx.beginPath();
    ctx.arc(0, 0, 18, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(-7, -5, 5.5, 0, Math.PI * 2); ctx.arc(7, -5, 5.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(-7, -3, 2.4, 0, Math.PI * 2); ctx.arc(7, -3, 2.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function draw(t) {
    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
      shake *= 0.82;
    }

    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#8fd6f2');
    sky.addColorStop(0.7, '#eaf9ff');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#ffffff99';
    [[60, 72], [205, 116], [300, 48]].forEach(([x, yPos]) => {
      ctx.beginPath();
      ctx.arc(x, yPos, 18, 0, Math.PI * 2);
      ctx.arc(x + 17, yPos + 4, 14, 0, Math.PI * 2);
      ctx.arc(x - 14, yPos + 5, 12, 0, Math.PI * 2);
      ctx.fill();
    });

    ctx.fillStyle = '#4caf50';
    ctx.fillRect(0, GROUND, W, H - GROUND);
    ctx.fillStyle = '#81c784';
    ctx.fillRect(0, GROUND, W, 8);
    for (let i = 0; i < W; i += 16) {
      ctx.fillStyle = '#66bb6a';
      ctx.fillRect(i, GROUND, 3, 10);
    }

    for (const b of bananas) drawBanana(b);
    for (const h of hazards) drawHazard(h);
    drawParticles();
    drawMonkey(t);
    ctx.restore();
  }

  function update(t, dt) {
    if (state !== 'play') return;

    vy += 1800 * dt;
    y += vy * dt;

    if (y > GROUND - 58) {
      y = GROUND - 58;
      vy = 0;
    }
    if (y < 46) {
      y = 46;
      vy = 0;
    }

    if (t - spawnBanana > 920) {
      addBanana();
      spawnBanana = t;
    }
    if (t - spawnHazard > 1420) {
      addHazard();
      spawnHazard = t;
    }

    for (let i = bananas.length - 1; i >= 0; i--) {
      const b = bananas[i];
      b.y += b.speed * dt;
      b.r += dt * 8;
      if (b.y > H + 30) {
        bananas.splice(i, 1);
      } else if (Math.hypot(b.x - MONKEY_X, b.y - y) < 32) {
        bananas.splice(i, 1);
        coins += 1;
        score += 10;
        burst(b.x, b.y, '#ffd700');
        beep(880, 0.07);
        hud();
      }
    }

    for (let i = hazards.length - 1; i >= 0; i--) {
      const h = hazards[i];
      h.x -= h.speed * dt;
      if (h.x < -40) {
        hazards.splice(i, 1);
      } else if (Math.hypot(h.x - MONKEY_X, h.y - y) < 34) {
        hazards.splice(i, 1);
        lives -= 1;
        shake = 12;
        burst(h.x, h.y, '#ff5a5f');
        beep(150, 0.2);
        hud();
        if (lives <= 0) gameOver();
      }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 250 * dt;
      p.life -= dt * 1.7;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  function loop(ts) {
    const dt = Math.min(0.03, (ts - last || 0) / 1000);
    last = ts;
    update(ts, dt);
    draw(ts);
    requestAnimationFrame(loop);
  }

  $('play').addEventListener('click', start);
  $('again').addEventListener('click', start);
  $('sound').addEventListener('click', () => {
    muted = !muted;
    $('sound').textContent = muted ? '🔇' : '🔊';
  });

  $('share').addEventListener('click', () => {
    const text = `I scored ${score} in Monkey Banana Rush 🐒🍌`;
    if (navigator.share) {
      navigator.share({ title: 'Monkey Banana Rush', text }).catch(() => {});
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(text).catch(() => {});
    }
  });

  c.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    jump();
  }, { passive: false });

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      jump();
    }
  });

  hud();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
