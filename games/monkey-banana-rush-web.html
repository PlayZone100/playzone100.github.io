<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#123524"><title>Monkey Banana Rush</title><style>:root{--j:#123524;--j2:#184530;--gold:#ffd84d;--cream:#fff8ed;--red:#ff5a5f}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;font-family:system-ui,sans-serif;background:radial-gradient(120% 90% at 50% -10%,#184530,var(--j) 60%,#07140f);color:#fff}body{display:grid;place-items:center;padding:14px;overflow:hidden;user-select:none}.stage{width:min(400px,100%)}header{display:flex;justify-content:center;align-items:baseline;gap:8px;margin-bottom:10px;color:var(--gold);font-weight:900;font-size:1.5rem}header small{font-size:.62rem;background:var(--gold);color:#123524;border-radius:999px;padding:2px 7px}.frame{position:relative;aspect-ratio:3/5;overflow:hidden;border:3px solid #1f5c3f;border-radius:22px;background:#dff4ff;box-shadow:0 22px 44px #0008}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none}.group{display:flex;gap:6px;align-items:center}.pill,.sound{background:#0c2419b8;border:0;border-radius:999px;padding:6px 11px;color:#fff;font-weight:800}.best{color:var(--gold)}.combo{background:linear-gradient(135deg,#ff5a5f,#e13f45)}.hidden{display:none!important}.sound{width:32px;height:32px;padding:0;pointer-events:auto}.toast{position:absolute;z-index:3;top:35%;left:50%;transform:translate(-50%,-50%) scale(.7);opacity:0;background:#0c2419c9;color:var(--gold);padding:8px 18px;border-radius:999px;font-weight:900;transition:.25s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.overlay{position:absolute;z-index:4;inset:0;display:grid;place-items:center;padding:20px;background:linear-gradient(#145a8c66,#08283ccc);text-align:center}.over{background:#08100ccc}.card{width:min(100%,280px);padding:22px;border-radius:20px;background:var(--cream);color:#1c1b18;box-shadow:0 18px 34px #0008}.card .emoji{font-size:2.7rem}.card h1{font-size:1.35rem;margin:5px 0}.card p{font-size:.85rem;line-height:1.45;color:#4a453d}.stats{display:flex;gap:10px;margin:14px 0}.stat{flex:1;background:#fff1d9;padding:9px;border-radius:13px;font-weight:900;font-size:1.25rem}.stat small{display:block;color:#8a8378;font-size:.62rem}.btn{width:100%;border:0;border-radius:999px;padding:13px;background:#1c1b18;color:#fff;font-weight:900;font-size:1rem;box-shadow:0 5px #000}.btn+ .btn{margin-top:10px}.alt{background:#fff1d9;color:#1c1b18;box-shadow:0 4px #0002}.hint{text-align:center;color:#d8eee288;font-size:.72rem;margin-top:10px}</style></head><body><main class="stage"><header>🍃 Monkey Banana Rush <small>PRO</small></header><section class="frame"><canvas id="game" width="360" height="600"></canvas><div class="hud"><div class="group"><div class="pill">⭐ <span id="score">0</span></div><div class="pill best">🏆 <span id="best">0</span></div><div class="pill combo hidden" id="combo">🔥 x<span id="mult">1</span></div></div><div class="group"><div class="pill" id="lives">❤️❤️❤️</div><button class="sound" id="sound">🔊</button></div></div><div class="toast" id="toast"></div><div class="overlay" id="start"><div class="card"><div class="emoji">🐒🍌</div><h1>Ready to rush?</h1><p>Tap to hop, catch bananas, chain combos and dodge angry monsters.</p><button class="btn" id="play">Tap to start</button><p>💰 +10 · ✨ golden +50 · 🔥 combos · ❤️ 3 lives</p></div></div><div class="overlay over hidden" id="gameover"><div class="card"><div class="emoji">🙈</div><h1>Game over</h1><div class="stats"><div class="stat"><small>SCORE</small><span id="final">0</span></div><div class="stat"><small>BANANAS</small><span id="coins">0</span></div></div><button class="btn" id="again">Play again</button><button class="btn alt" id="share">Share score</button></div></div></section><p class="hint">Tap or press Space to hop · Golden bananas · Combo multiplier</p></main><script>(()=>{const c=document.querySelector('canvas'),x=c.getContext('2d'),W=360,H=600,G=522,MX=78,R=24,$=id=>document.getElementById(id);let state='start',score=0,coins=0,lives=3,best=+(localStorage.mbrBest||0),y=445,vy=0,last=0,lb=0,lm=0,combo=0,lastCatch=-1e9,nextMilestone=200,muted=false,audio=null;let bananas=[],monsters=[],particles=[];$('best').textContent=best;function hud(){$('score').textContent=score;$('best').textContent=best;$('lives').textContent='❤️'.repeat(Math.max(0,lives))||'—'}function beep(f,d=.1){if(muted||!audio)return;let o=audio.createOscillator(),g=audio.createGain(),n=audio.currentTime;o.frequency.value=f;g.gain.setValueAtTime(.08,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g).connect(audio.destination);o.start();o.stop(n+d)}function start(){audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume?.();state='play';score=coins=0;lives=3;y=445;vy=0;combo=0;nextMilestone=200;bananas=[];monsters=[];particles=[];lb=lm=performance.now();$('start').classList.add('hidden');$('gameover').classList.add('hidden');$('combo').classList.add('hidden');hud();beep(620)}function jump(){if(state!=='play'){start();return}if(y>=G-58){vy=-690;beep(420,.08)}}function burst(a,b,col,n=8){for(let i=0;i<n;i++)particles.push({x:a,y:b,vx:(Math.random()-.5)*120,vy:(Math.random()-.5)*120,l:1,c:col})}function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('show'),1000)}function limb(a,b,len,ang,col='#6b2f0b',w=6){x.save();x.translate(a,b);x.rotate(ang);x.strokeStyle=col;x.lineWidth=w;x.lineCap='round';x.beginPath();x.moveTo(0,0);x.lineTo(0,len);x.stroke();x.restore()}function monkey(t){let r=Math.sin(t*.016),air=y<G-59;x.save();x.translate(MX,y-10);x.rotate(air?Math.max(-.2,Math.min(.2,vy*.00016)):r*.06);limb(-14,18,27,air?-.35:r*.8);limb(12,18,27,air?.4:-r*.8);limb(-20,-1,23,air?-.55:-r*.9,'#8b4513',5);limb(19,-1,23,air?.55:r*.9,'#8b4513',5);x.fillStyle='#8b4513';x.beginPath();x.ellipse(0,0,24,28,0,0,7);x.fill();x.fillStyle='#5b280a';x.beginPath();x.moveTo(14,10);x.bezierCurveTo(43,30,43,-25,14,-30);x.closePath();x.fill();x.fillStyle='#8b4513';x.beginPath();x.arc(0,-27,27,0,7);x.fill();x.fillStyle='#5b280a';x.beginPath();x.arc(-24,-32,11,0,7);x.arc(24,-32,11,0,7);x.fill();x.fillStyle='#ffd2a6';x.beginPath();x.ellipse(0,-17,19,14,0,0,7);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(-9,-30,7,0,7);x.arc(9,-30,7,0,7);x.fill();x.fillStyle='#111';x.beginPath();x.arc(-9,-29,3,0,7);x.arc(9,-29,3,0,7);x.fill();x.fillStyle='#211';x.beginPath();x.arc(0,-16,3,0,7);x.fill();x.strokeStyle='#3d1f00';x.lineWidth=2;x.beginPath();x.arc(0,-12,9,.15,Math.PI-.15);x.stroke();x.restore()}function drawBanana(b){x.save();x.translate(b.x,b.y);x.rotate(b.r);if(b.gold){x.shadowColor='#ffd84d';x.shadowBlur=18}x.fillStyle=b.gold?'#fff1b8':'#ffd400';x.beginPath();x.ellipse(0,0,11,15,.2,0,7);x.fill();x.fillStyle='#4a2c0a';x.fillRect(-2,-17,4,6);x.restore()}function drawMonster(m){x.save();x.translate(m.x,m.y);x.fillStyle='#e13f45';x.beginPath();x.arc(0,0,18,0,7);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(-7,-5,6,0,7);x.arc(7,-5,6,0,7);x.fill();x.fillStyle='#111';x.beginPath();x.arc(-7,-3,2.5,0,7);x.arc(7,-3,2.5,0,7);x.fill();x.restore()}function draw(t){let sky=x.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#8fd6f2');sky.addColorStop(1,'#eaf9ff');x.fillStyle=sky;x.fillRect(0,0,W,H);x.fillStyle='#ffffff99';[[60,70],[205,110],[300,50]].forEach(([a,b])=>{x.beginPath();x.arc(a,b,18,0,7);x.arc(a+18,b+4,13,0,7);x.arc(a-14,b+5,12,0,7);x.fill()});x.fillStyle='#4caf50';x.fillRect(0,G,W,H-G);x.fillStyle='#81c784';x.fillRect(0,G,W,8);bananas.forEach(drawBanana);monsters.forEach(drawMonster);particles.forEach(p=>{x.globalAlpha=p.l;x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,4,0,7);x.fill();x.globalAlpha=1});monkey(t)}function update(t,dt){if(state!=='play')return;vy+=1800*dt;y+=vy*dt;if(y>G-58)y=G-58,vy=0;if(y<45)y=45,vy=0;if(t-lb>900){lb=t;bananas.push({x:30+Math.random()*150,y:-24,v:140+score*.2,r:0,gold:Math.random()<.14})}if(t-lm>1650){lm=t;monsters.push({x:390,y:G-20-Math.random()*280,v:180+score*.3})}for(let i=bananas.length-1;i>=0;i--){let b=bananas[i];b.y+=b.v*dt;b.r+=dt*5;if(b.y>H+30)bananas.splice(i,1);else if(Math.hypot(b.x-MX,b.y-y)<36){bananas.splice(i,1);combo=t-lastCatch<1400?combo+1:1;lastCatch=t;let m=Math.min(5,1+Math.floor((combo-1)/3));score+=(b.gold?50:10)*m;coins+=b.gold?3:1;if(m>1){$('mult').textContent=m;$('combo').classList.remove('hidden')}if(b.gold){toast('✨ GOLDEN BANANA +'+50*m);beep(1000)}else beep(880);burst(b.x,b.y,b.gold?'#ffd84d':'#ffd700');if(score>=nextMilestone){toast('🎉 '+nextMilestone+' milestone!');nextMilestone+=200}hud()}}for(let i=monsters.length-1;i>=0;i--){let m=monsters[i];m.x-=m.v*dt;if(m.x<-40)monsters.splice(i,1);else if(Math.hypot(m.x-MX,m.y-y)<42){monsters.splice(i,1);lives--;combo=0;$('combo').classList.add('hidden');burst(m.x,m.y,'#ff5a5f');beep(130,.2);hud();if(lives<=0){state='over';best=Math.max(best,score);localStorage.mbrBest=best;$('final').textContent=score;$('coins').textContent=coins;$('gameover').classList.remove('hidden')}}}for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=250*dt;p.l-=dt*2;if(p.l<=0)particles.splice(i,1)}}function loop(t){let dt=Math.min(.03,(t-last||0)/1000);last=t;update(t,dt);draw(t);requestAnimationFrame(loop)}$('play').onclick=start;$('again').onclick=start;c.addEventListener('pointerdown',e=>{e.preventDefault();jump()},{passive:false});addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();jump()}});$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'🔇':'🔊'};$('share').onclick=()=>{let text=`I scored ${score} in Monkey Banana Rush 🐒🍌`;navigator.share?navigator.share({text}).catch(()=>{}):navigator.clipboard?.writeText(text)};hud();requestAnimationFrame(loop)})();</script></body></html>
