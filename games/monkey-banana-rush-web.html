<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#123524"><title>Monkey Banana Rush — Web Demo</title>
<style>
:root{--green:#123524;--gold:#ffd84d;--cream:#fff8ed}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:system-ui,sans-serif;background:radial-gradient(100% 80% at 50% 0,#286c49,#07150e 72%);color:#fff}body{display:grid;place-items:center;padding:14px;overflow:hidden;user-select:none}.shell{width:min(410px,100%)}header{display:flex;justify-content:space-between;margin:0 4px 10px;font-weight:900;color:var(--gold)}header small{font-size:.7rem;color:#d8eee2;opacity:.7}.frame{position:relative;overflow:hidden;aspect-ratio:3/5;border:3px solid #1f5c3f;border-radius:24px;background:#dff4ff;box-shadow:0 22px 50px #0009}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:absolute;z-index:2;top:11px;left:11px;right:11px;display:flex;justify-content:space-between;pointer-events:none}.right{display:flex;gap:6px;align-items:center}.pill,.sound{background:#092318c9;color:#fff;border:0;border-radius:999px;padding:6px 11px;font-weight:900}.sound{width:34px;height:34px;padding:0;font-size:16px;pointer-events:auto}.gold{color:var(--gold)!important}.overlay{position:absolute;z-index:4;inset:0;display:grid;place-items:center;padding:20px;background:linear-gradient(#103c5ccc,#06150edb);text-align:center}.hidden{display:none!important}.card{width:min(100%,292px);padding:23px 22px 21px;border-radius:22px;background:var(--cream);color:#1c1b18;box-shadow:0 20px 40px #0008}.emoji{font-size:2.8rem;line-height:1}.card h1{font-size:1.4rem;margin:7px 0 5px}.card p{margin:0 0 17px;color:#4a453d;line-height:1.45;font-size:.85rem}.btn{width:100%;border:0;border-radius:999px;padding:13px;background:#1c1b18;color:#fff;font-weight:900;font-size:1rem;box-shadow:0 6px #000;cursor:pointer}.btn.alt{margin-top:10px;background:#fff1d9;color:#1c1b18;box-shadow:0 5px #0002}.stats{display:flex;gap:10px;margin:14px 0 17px}.stat{flex:1;padding:10px;background:#fff1d9;border-radius:14px;font-size:1.35rem;font-weight:900}.stat span{display:block;color:#8a8378;font-size:.62rem;letter-spacing:.12em}.help{text-align:center;margin:10px 0 0;color:#d8eee288;font-size:.72rem}
</style>
</head>
<body><main class="shell"><header><span>🍃 Monkey Banana Rush</span><small>WEB DEMO</small></header><section class="frame"><canvas id="game" width="360" height="600"></canvas><div class="hud"><div class="right"><div class="pill">⭐ <span id="score">0</span></div><div class="pill gold">🏆 <span id="best">0</span></div></div><div class="right"><div class="pill" id="lives">❤️❤️❤️</div><button class="sound" id="sound">🔊</button></div></div><div id="start" class="overlay"><div class="card"><div class="emoji">🐒🍌</div><h1>Ready to rush?</h1><p>Tap, click, or press Space to jump. Collect bananas and dodge coconuts!</p><button class="btn" id="play">Tap to start</button></div></div><div id="over" class="overlay hidden"><div class="card"><small>GAME OVER</small><div class="emoji">🍌</div><div class="stats"><div class="stat"><span>SCORE</span><b id="final">0</b></div><div class="stat"><span>BANANAS</span><b id="coins">0</b></div></div><button class="btn" id="again">Play again</button><button class="btn alt" id="share">Share my score</button></div></div></section><p class="help">Tap or press Space to hop · Sound starts after your first tap</p></main>
<script>
(()=>{'use strict';const c=document.getElementById('game'),ctx=c.getContext('2d'),W=360,H=600,GROUND=522,MONKEY_X=78;let state='start',score=0,coins=0,lives=3,best=+(localStorage.mbrBest||0),y=445,vy=0,last=0,spawnBanana=0,spawnHazard=0,shake=0,muted=false,audio=null,bananas=[],hazards=[],particles=[];const $=id=>document.getElementById(id);function hud(){$('score').textContent=score;$('best').textContent=best;$('lives').textContent='❤️'.repeat(Math.max(0,lives))||'—'}function beep(f,d=.1){if(muted||!audio)return;let o=audio.createOscillator(),g=audio.createGain(),n=audio.currentTime;o.frequency.value=f;g.gain.setValueAtTime(.1,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g).connect(audio.destination);o.start();o.stop(n+d)}function start(){audio??=new(window.AudioContext||window.webkitAudioContext)();audio?.resume();state='play';score=coins=0;lives=3;y=445;vy=0;bananas=[];hazards=[];particles=[];last=performance.now();spawnBanana=last;spawnHazard=last;$('start').classList.add('hidden');$('over').classList.add('hidden');hud();beep(650,.12)}function jump(){if(state!=='play'){start();return}if(y>=GROUND-58){vy=-690;beep(420,.1)}}function gameOver(){state='over';best=Math.max(best,score);localStorage.mbrBest=best;$('final').textContent=score;$('coins').textContent=coins;$('over').classList.remove('hidden');hud();beep(120,.3)}function burst(x,y,color){for(let i=0;i<8;i++)particles.push({x,y,vx:(Math.random()-.5)*100,vy:(Math.random()-.5)*100,l:1,color})}function addBanana(t){bananas.push({x:390,y:145+Math.random()*300,r:0,v:130+score*.2});spawnBanana=t}function addHazard(t){hazards.push({x:390,y:GROUND-18-Math.random()*170,r:18,v:175+score*.35});spawnHazard=t}function limb(x,y,len,ang,w=7,color='#6b2f0b'){ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.strokeStyle=color;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,len);ctx.stroke();ctx.restore()}function monkey(t){let run=Math.sin(t*.018),run2=Math.sin(t*.018+Math.PI),air=Math.min(1,Math.abs(vy)/700),bodyY=y-7-Math.abs(run)*2;ctx.save();ctx.translate(MONKEY_X,bodyY);ctx.rotate(Math.max(-.12,Math.min(.12,vy*.00018)));let legA=y>=GROUND-60?run*.55+.12:-.25,legB=y>=GROUND-60?run2*.55-.12:.25;limb(-10,20,24,legA);limb(10,20,24,legB);limb(-19,2,22,run2*.45-.5);limb(19,2,22,run*.45+.5);ctx.fillStyle='#8b4513';ctx.beginPath();ctx.ellipse(0,0,25,28,0,0,7);ctx.fill();ctx.strokeStyle='#6b2f0b';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(18,17);ctx.bezierCurveTo(45,36,47,-22,26,-26);ctx.stroke();ctx.fillStyle='#8b4513';ctx.beginPath();ctx.arc(0,-25,24,0,7);ctx.fill();ctx.fillStyle='#6b2f0b';ctx.beginPath();ctx.arc(-22,-31,9,0,7);ctx.arc(22,-31,9,0,7);ctx.fill();ctx.fillStyle='#ffd9b4';ctx.beginPath();ctx.ellipse(0,-16,16,12,0,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-9,-28,7,0,7);ctx.arc(9,-28,7,0,7);ctx.fill();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(-9,-27,3,0,7);ctx.arc(9,-27,3,0,7);ctx.fill();ctx.strokeStyle='#3d1f00';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,-13,7,.15,Math.PI-.15);ctx.stroke();ctx.restore()}function drawBanana(b){ctx.save();ctx.translate(b.x,b.y);ctx.rotate(Math.sin(b.r)*.25);ctx.fillStyle='#ffd400';ctx.beginPath();ctx.ellipse(0,0,10,15,.2,0,7);ctx.fill();ctx.fillStyle='#4a2c0a';ctx.fillRect(-2,-17,4,6);ctx.restore()}function drawHazard(h){ctx.save();ctx.translate(h.x,h.y);ctx.fillStyle='#e13f45';ctx.beginPath();ctx.arc(0,0,18,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-7,-5,6,0,7);ctx.arc(7,-5,6,0,7);ctx.fill();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(-7,-3,2.5,0,7);ctx.arc(7,-3,2.5,0,7);ctx.fill();ctx.restore()}function draw(t){ctx.save();if(shake){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.86}let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#8fd6f2');g.addColorStop(.7,'#eaf9ff');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#ffffff99';[[60,70],[205,110],[300,50]].forEach(([a,b])=>{ctx.beginPath();ctx.arc(a,b,18,0,7);ctx.arc(a+17,b+4,14,0,7);ctx.arc(a-14,b+5,12,0,7);ctx.fill()});ctx.fillStyle='#4caf50';ctx.fillRect(0,GROUND,W,H-GROUND);ctx.fillStyle='#81c784';ctx.fillRect(0,GROUND,W,8);for(let i=0;i<W;i+=16){ctx.fillStyle='#66bb6a';ctx.fillRect(i,GROUND,3,10)}bananas.forEach(drawBanana);hazards.forEach(drawHazard);particles.forEach(p=>{ctx.globalAlpha=p.l;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,4,0,7);ctx.fill();ctx.globalAlpha=1});if(state!=='over')monkey(t);ctx.restore()}function update(t,dt){if(state!=='play')return;vy+=1800*dt;y+=vy*dt;if(y>GROUND-58){y=GROUND-58;vy=0}if(y<45){y=45;vy=0}if(t-spawnBanana>900){addBanana(t)}if(t-spawnHazard>1450){addHazard(t)}for(let i=bananas.length-1;i>=0;i--){let b=bananas[i];b.y+=b.v*dt;b.r+=dt*5;if(b.y>H+30)bananas.splice(i,1);else if(Math.hypot(b.x-MONKEY_X,b.y-y)<34){bananas.splice(i,1);coins++;score+=10;burst(b.x,b.y,'#ffd700');beep(880,.08);hud()}}for(let i=hazards.length-1;i>=0;i--){let h=hazards[i];h.x-=h.v*dt;if(h.x<-40)hazards.splice(i,1);else if(Math.hypot(h.x-MONKEY_X,h.y-y)<35){hazards.splice(i,1);lives--;shake=14;burst(h.x,h.y,'#ff5a5f');beep(150,.2);hud();if(lives<=0)gameOver()}}for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=260*dt;p.l-=dt*2;if(p.l<=0)particles.splice(i,1)}}function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;update(t,dt);draw(t);requestAnimationFrame(loop)}$('play').onclick=start;$('again').onclick=start;c.addEventListener('pointerdown',e=>{e.preventDefault();jump()},{passive:false});addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();jump()}});$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'🔇':'🔊'};$('share').onclick=()=>{let text=`I scored ${score} in Monkey Banana Rush 🐒🍌`;navigator.share?navigator.share({title:'Monkey Banana Rush',text}).catch(()=>{}):navigator.clipboard?.writeText(text)};hud();requestAnimationFrame(loop)})();
</script>
</body></html>
