<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#123524"><title>Monkey Banana Rush</title>
<style>
:root{--deep:#07150e;--jungle:#123524;--leaf:#1f5c3f;--gold:#ffd84d;--cream:#fff8ed;--ink:#1c1b18;--red:#ff5a5f}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(100% 80% at 50% 0,#286c49,var(--deep) 72%);color:#fff}body{display:grid;place-items:center;padding:max(12px,env(safe-area-inset-top)) 14px;overflow:hidden;user-select:none}.shell{width:min(410px,100%)}header{display:flex;align-items:center;justify-content:space-between;margin:0 4px 10px;font-weight:900;color:var(--gold);font-size:1.05rem}header small{font-size:.7rem;color:#d8eee2;opacity:.7}.frame{position:relative;overflow:hidden;width:100%;aspect-ratio:3/5;border:3px solid var(--leaf);border-radius:24px;background:#dff4ff;box-shadow:0 22px 50px #0009,0 3px #06110b}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:absolute;z-index:2;top:11px;left:11px;right:11px;display:flex;justify-content:space-between;align-items:start;pointer-events:none}.right{display:flex;gap:6px;align-items:center}.pill,.sound{background:#092318b8;color:#fff;border:0;border-radius:999px;padding:6px 11px;font-weight:900;backdrop-filter:blur(4px)}.sound{width:34px;height:34px;padding:0;font-size:16px;pointer-events:auto;cursor:pointer}.pill.gold{color:var(--gold)}.overlay{position:absolute;z-index:4;inset:0;display:grid;place-items:center;padding:20px;background:linear-gradient(#103c5ccc,#06150edb);text-align:center;transition:opacity .2s}.overlay.hidden{opacity:0;pointer-events:none}.card{width:min(100%,292px);padding:23px 22px 21px;border-radius:22px;background:var(--cream);color:var(--ink);box-shadow:0 20px 40px #0008}.emoji{font-size:2.8rem;line-height:1}.card h1{font-size:1.4rem;margin:7px 0 5px}.card p{margin:0 0 17px;color:#4a453d;line-height:1.45;font-size:.85rem}.btn{width:100%;border:0;border-radius:999px;padding:13px;background:var(--ink);color:#fff;font-weight:900;font-size:1rem;cursor:pointer;box-shadow:0 6px #000;transition:transform .08s}.btn:active{transform:translateY(4px);box-shadow:0 2px #000}.btn.alt{margin-top:10px;background:#fff1d9;color:var(--ink);box-shadow:0 5px #0002}.stats{display:flex;gap:10px;margin:14px 0 17px}.stat{flex:1;padding:10px;background:#fff1d9;border-radius:14px;font-size:1.35rem;font-weight:900}.stat span{display:block;color:#8a8378;font-size:.62rem;letter-spacing:.12em}.help{text-align:center;margin:10px 0 0;color:#d8eee288;font-size:.72rem}
</style>
</head>
<body><main class="shell"><header><span>🍃 Monkey Banana Rush</span><small>WEB EDITION</small></header><section class="frame"><canvas id="game" width="360" height="600"></canvas><div class="hud"><div class="right"><div class="pill">⭐ <span id="score">0</span></div><div class="pill gold">🏆 <span id="best">0</span></div></div><div class="right"><div class="pill" id="lives">❤️❤️❤️</div><button class="sound" id="sound">🔊</button></div></div><div id="start" class="overlay"><div class="card"><div class="emoji">🐒🍌</div><h1>Ready to rush?</h1><p>Tap, click, or press Space to jump. Collect bananas and dodge the angry coconuts!</p><button class="btn" id="play">Tap to start</button></div></div><div id="over" class="overlay hidden"><div class="card"><div style="font-size:.7rem;letter-spacing:.18em;color:#8a8378;font-weight:900">GAME OVER</div><div class="emoji">🍌</div><div class="stats"><div class="stat"><span>SCORE</span><b id="final">0</b></div><div class="stat"><span>BANANAS</span><b id="coins">0</b></div></div><button class="btn" id="again">Play again</button><button class="btn alt" id="share">Share my score</button></div></div></section><p class="help">Tap or press Space to hop · Sound starts after your first tap</p></main>
<script>
(()=>{'use strict';const c=document.getElementById('game'),x=c.getContext('2d'),W=360,H=600,G=78,MX=78,R=24,$=id=>document.getElementById(id);let state='start',y=300,vy=0,score=0,coins=0,lives=3,best=+(localStorage.getItem('mbr_best_web_v2')||0),bananas=[],hazards=[],particles=[],lastB=0,lastH=0,shake=0,muted=localStorage.getItem('mbr_muted_web_v2')==='1',audio=null;function audioStart(){try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}catch(e){}}function tone(f,d,type='sine',v=.1,to){if(muted||!audio)return;try{const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+d)}catch(e){}}function hud(){$('score').textContent=score;$('best').textContent=best;$('lives').textContent='❤️'.repeat(Math.max(0,lives))||'—'}function reset(){audioStart();state='play';y=300;vy=0;score=0;coins=0;lives=3;bananas=[];hazards=[];particles=[];lastB=lastH=performance.now();shake=0;$('start').classList.add('hidden');$('over').classList.add('hidden');hud();tone(523,.12,'square',.08,784)}function finish(){state='over';if(score>best){best=score;localStorage.setItem('mbr_best_web_v2',best)}$('final').textContent=score;$('coins').textContent=coins;$('over').classList.remove('hidden');hud();tone(110,.3,'sawtooth',.15,55)}function jump(){audioStart();if(state!=='play'){reset();return}vy=-13.2;tone(430,.1,'square',.06,700)}$('play').onclick=reset;$('again').onclick=reset;c.addEventListener('pointerdown',e=>{e.preventDefault();jump()},{passive:false});addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();jump()}});$('sound').onclick=()=>{muted=!muted;localStorage.setItem('mbr_muted_web_v2',muted?'1':'0');$('sound').textContent=muted?'🔇':'🔊';audioStart()};$('share').onclick=()=>{const text=`I scored ${score} in Monkey Banana Rush 🐒🍌 — beat that!`;if(navigator.share)navigator.share({title:'Monkey Banana Rush',text}).catch(()=>{});else navigator.clipboard?.writeText(text)};function burst(px,py,n,col){for(let i=0;i<n;i++)particles.push({x:px,y:py,vx:(Math.random()-.5)*7,vy:(Math.random()-.5)*7-2,l:1,col,z:2+Math.random()*4})}function monkey(t){const bob=Math.sin(t*.012)*4; x.fillStyle='#5b2608';x.beginPath();x.ellipse(MX-9,y+23+bob,5,10,0,0,7);x.ellipse(MX+9,y+23-bob,5,10,0,0,7);x.fill();x.fillStyle='#8b4513';x.beginPath();x.arc(MX,y,R,0,7);x.fill();x.fillStyle='#6b2f0b';x.beginPath();x.arc(MX-22,y-8,9,0,7);x.arc(MX+22,y-8,9,0,7);x.fill();x.fillStyle='#ffd9b4';x.beginPath();x.arc(MX-22,y-8,4,0,7);x.arc(MX+22,y-8,4,0,7);x.fill();x.fillStyle='#f5deb3';x.beginPath();x.ellipse(MX,y+8,16,12,0,0,7);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(MX-9,y-6,7,0,7);x.arc(MX+9,y-6,7,0,7);x.fill();x.fillStyle='#111';x.beginPath();x.arc(MX-9,y-4,3,0,7);x.arc(MX+9,y-4,3,0,7);x.fill();x.strokeStyle='#3d1f00';x.lineWidth=1.5;x.beginPath();x.arc(MX,y+10,7,.15,Math.PI-.15);x.stroke()}function drawBanana(b){x.save();x.translate(b.x,b.y);x.rotate(b.r);x.fillStyle='rgba(0,0,0,.15)';x.beginPath();x.ellipse(2,7,12,5,0,0,7);x.fill();x.fillStyle='#ffd400';x.beginPath();x.ellipse(0,0,10,14,.2,0,7);x.fill();x.fillStyle='#ffc200';x.beginPath();x.ellipse(-3,-3,5,8,.2,0,7);x.fill();x.fillStyle='#4a2c0a';x.fillRect(-2,-15,4,6);x.fillStyle='#6b8e23';x.fillRect(-3,-17,6,3);x.restore()}function drawHazard(h){x.save();x.translate(h.x,h.y);x.fillStyle='rgba(0,0,0,.18)';x.beginPath();x.ellipse(2,17,17,5,0,0,7);x.fill();x.fillStyle='#e13f45';x.beginPath();x.arc(0,0,18,0,7);x.fill();x.fillStyle='#c22a30';x.beginPath();x.arc(0,5,14,0,Math.PI);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(-7,-5,6,0,7);x.arc(7,-5,6,0,7);x.fill();x.fillStyle='#111';x.beginPath();x.arc(-7,-3,2.5,0,7);x.arc(7,-3,2.5,0,7);x.fill();x.strokeStyle='#72000a';x.lineWidth=2;x.beginPath();x.moveTo(-13,-11);x.lineTo(-2,-7);x.moveTo(13,-11);x.lineTo(2,-7);x.stroke();x.restore()}function draw(t){x.save();if(shake){x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.9;if(shake<.5)shake=0}const sky=x.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#8fd6f2');sky.addColorStop(1,'#eaf9ff');x.fillStyle=sky;x.fillRect(0,0,W,H);x.fillStyle='#fff9';[[60,70],[205,110],[300,50]].forEach(([a,b])=>{x.beginPath();x.arc(a,b,18,0,7);x.arc(a+17,b+4,14,0,7);x.arc(a-14,b+5,12,0,7);x.fill()});x.fillStyle='#4caf50';x.fillRect(0,H-G,W,G);x.fillStyle='#81c784';x.fillRect(0,H-G,W,8);x.fillStyle='#66bb6a';for(let i=0;i<W;i+=16)x.fillRect(i,H-G,3,10);particles.forEach(p=>{x.globalAlpha=p.l;x.fillStyle=p.col;x.beginPath();x.arc(p.x,p.y,p.z,0,7);x.fill();x.globalAlpha=1});bananas.forEach(drawBanana);hazards.forEach(drawHazard);if(state!=='over')monkey(t);x.restore()}function update(t){if(state!=='play')return;vy+=.62;y+=vy;const top=34,bottom=H-G-R-2;if(y<top)y=top,vy=0;if(y>bottom)y=bottom,vy=0;const d=Math.floor(score/300);if(t-lastB>900){lastB=t;bananas.push({x:30+Math.random()*160,y:-25,v:2.4+d*.4,r:Math.random()*7,rs:(Math.random()-.5)*.16})}if(t-lastH>1650){lastH=t;hazards.push({x:400,y:H-G-20-Math.random()*280,v:3+d*.5})}for(let i=bananas.length-1;i>=0;i--){const b=bananas[i];b.y+=b.v;b.r+=b.rs;if(b.y>H+30)bananas.splice(i,1);else if(Math.hypot(b.x-MX,b.y-y)<R+12){bananas.splice(i,1);coins++;score+=10;burst(b.x,b.y,8,'#ffd700');tone(880,.1,'triangle',.12,1320);hud()}}for(let i=hazards.length-1;i>=0;i--){const h=hazards[i];h.x-=h.v;if(h.x<-40)hazards.splice(i,1);else if(Math.hypot(h.x-MX,h.y-y)<R+18){hazards.splice(i,1);lives--;shake=14;burst(h.x,h.y,10,'#ff5a5f');tone(150,.25,'sawtooth',.14,55);hud();if(lives<=0)finish()}}for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.18;p.l-=.035;if(p.l<=0)particles.splice(i,1)}}function loop(t){update(t);draw(t);requestAnimationFrame(loop)}$('sound').textContent=muted?'🔇':'🔊';hud();requestAnimationFrame(loop)})();
</script></body></html>
