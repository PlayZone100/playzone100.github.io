<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Monkey Banana Rush</title>
<style>
:root{--j:#0c2419;--g:#184530;--y:#ffd84d;--c:#fff8ed;--i:#1c1b18}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(120% 90% at 50% -10%,var(--g),var(--j) 60%);color:var(--c)}body{display:grid;place-items:center;padding:14px;overflow:hidden;user-select:none}.wrap{width:min(100%,400px);text-align:center}.brand{margin:0 0 10px;color:var(--y);font-size:24px}.frame{position:relative;width:100%;aspect-ratio:3/5;border:3px solid #1f5c3f;border-radius:22px;overflow:hidden;background:#dff4ff;box-shadow:0 20px 40px #0008}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:absolute;z-index:2;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none}.hud div{background:#0c241999;border-radius:99px;padding:6px 11px;font-weight:700;font-size:14px}.hud button{border:0;border-radius:50%;width:32px;height:32px;background:#0c241999;color:#fff;font-size:16px;pointer-events:auto}.overlay{position:absolute;inset:0;z-index:3;display:grid;place-items:center;padding:20px;background:#08283c88;transition:opacity .18s}.overlay.hidden{opacity:0;pointer-events:none}.card{width:min(100%,280px);padding:22px;border-radius:20px;background:var(--c);color:var(--i);box-shadow:0 18px 34px #0006}.emoji{font-size:42px}.card h2{margin:5px 0;font-size:22px}.card p{margin:0 0 16px;color:#4a453d;font-size:14px;line-height:1.4}.cta{width:100%;border:0;border-radius:99px;padding:13px;background:var(--i);color:#fff;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 5px #000}.cta:active{transform:translateY(4px);box-shadow:0 1px #000}.secondary{margin-top:10px;background:#fff1d9;color:var(--i);box-shadow:0 5px #0002}.stats{display:flex;gap:10px;margin:14px 0}.stat{flex:1;background:#fff1d9;border-radius:14px;padding:9px;font-weight:800}.stat small{display:block;color:#8a8378;font-size:10px}.foot{margin-top:10px;color:#fff8ed66;font-size:11px}
</style>
</head>
<body><main class="wrap"><h1 class="brand">🍃 Monkey Banana Rush</h1><section class="frame"><canvas id="game" width="360" height="600"></canvas><div class="hud"><div>⭐ <span id="score">0</span> &nbsp;🏆 <span id="best">0</span></div><div><span id="lives">❤️❤️❤️</span> <button id="sound" aria-label="Toggle sound">🔊</button></div></div><div id="start" class="overlay"><div class="card"><div class="emoji">🐒</div><h2>Ready to rush?</h2><p>Tap to hop, grab falling bananas and dodge the angry coconuts.</p><button class="cta" id="startBtn">Tap to start</button></div></div><div id="over" class="overlay hidden"><div class="card"><b>GAME OVER</b><div class="emoji">🍌</div><div class="stats"><div class="stat"><small>SCORE</small><span id="finalScore">0</span></div><div class="stat"><small>BANANAS</small><span id="finalCoins">0</span></div></div><button class="cta" id="again">Play again</button><button class="cta secondary" id="share">Share my score</button></div></div></section><div class="foot">Web version · Monkey Banana Rush</div></main>
<script>
(()=>{'use strict';const c=document.getElementById('game'),x=c.getContext('2d'),W=360,H=600,ground=78,mx=78,R=24;let muted=false,audio=null;const $=id=>document.getElementById(id);let best=+(localStorage.getItem('mbr_best_web_v1')||0),s={state:'start',y:300,vy:0,score:0,coins:0,lives:3,b:[],m:[],p:[],lastB:0,lastM:0,shake:0};$('best').textContent=best;function audioOn(){try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume()}catch(e){}}function beep(f,d,t='sine',v=.1,to){if(muted||!audio)return;try{let o=audio.createOscillator(),g=audio.createGain(),n=audio.currentTime;o.type=t;o.frequency.setValueAtTime(f,n);to&&o.frequency.exponentialRampToValueAtTime(to,n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g).connect(audio.destination);o.start();o.stop(n+d)}catch(e){}}function hud(){$('score').textContent=s.score;$('best').textContent=best;$('lives').textContent='❤️'.repeat(Math.max(0,s.lives))||'—'}function reset(){s={...s,state:'playing',y:300,vy:0,score:0,coins:0,lives:3,b:[],m:[],p:[],lastB:performance.now(),lastM:performance.now(),shake:0};$('start').classList.add('hidden');$('over').classList.add('hidden');hud();audioOn();beep(523,.12,'square',.08,784)}function end(){s.state='over';if(s.score>best){best=s.score;localStorage.setItem('mbr_best_web_v1',best)}$('finalScore').textContent=s.score;$('finalCoins').textContent=s.coins;$('over').classList.remove('hidden');hud()}function jump(){audioOn();if(s.state!=='playing'){reset();return}s.vy=-13.2;beep(420,.09,'square',.06,620)}$('startBtn').onclick=reset;$('again').onclick=reset;c.addEventListener('pointerdown',e=>{e.preventDefault();jump()},{passive:false});addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();jump()}});$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'🔇':'🔊'};$('share').onclick=()=>{let text=`I scored ${s.score} in Monkey Banana Rush 🐒🍌 — beat that!`;if(navigator.share)navigator.share({text}).catch(()=>{});else navigator.clipboard?.writeText(text)};function monkey(y,t){let bob=Math.sin(t*.012)*6;x.fillStyle='#6b2f0b';x.beginPath();x.ellipse(mx-8,y+22+bob,5,10,0,0,7);x.ellipse(mx+8,y+22-bob,5,10,0,0,7);x.fill();x.fillStyle='#8b4513';x.beginPath();x.arc(mx,y,R,0,7);x.fill();x.fillStyle='#6b2f0b';x.beginPath();x.arc(mx-22,y-8,9,0,7);x.arc(mx+22,y-8,9,0,7);x.fill();x.fillStyle='#ffdab9';x.beginPath();x.arc(mx-22,y-8,4,0,7);x.arc(mx+22,y-8,4,0,7);x.fill();x.fillStyle='#f5deb3';x.beginPath();x.ellipse(mx,y+8,16,12,0,0,7);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(mx-9,y-6,7,0,7);x.arc(mx+9,y-6,7,0,7);x.fill();x.fillStyle='#000';x.beginPath();x.arc(mx-9,y-4,3,0,7);x.arc(mx+9,y-4,3,0,7);x.fill()}function banana(b){x.save();x.translate(b.x,b.y);x.rotate(b.r);x.fillStyle='#ffd400';x.beginPath();x.ellipse(0,0,10,14,.2,0,7);x.fill();x.fillStyle='#4a2c0a';x.fillRect(-2,-14,4,6);x.restore()}function monster(m){x.save();x.translate(m.x,m.y);x.fillStyle='#e13f45';x.beginPath();x.arc(0,0,18,0,7);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(-7,-5,6,0,7);x.arc(7,-5,6,0,7);x.fill();x.fillStyle='#000';x.beginPath();x.arc(-7,-3,2.5,0,7);x.arc(7,-3,2.5,0,7);x.fill();x.restore()}function draw(t){x.save();if(s.shake){x.translate((Math.random()-.5)*s.shake,(Math.random()-.5)*s.shake);s.shake*=.9;if(s.shake<.5)s.shake=0}let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#8fd6f2');g.addColorStop(1,'#eaf9ff');x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle='#fff9';[60,200,300].forEach((q,i)=>{x.beginPath();x.arc(q,70+i*20,18,0,7);x.arc(q+16,74+i*20,14,0,7);x.arc(q-14,75+i*20,12,0,7);x.fill()});x.fillStyle='#4caf50';x.fillRect(0,H-ground,W,ground);x.fillStyle='#81c784';x.fillRect(0,H-ground,W,8);s.p.forEach(p=>{x.globalAlpha=p.l;x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,p.z,0,7);x.fill();x.globalAlpha=1});s.b.forEach(banana);s.m.forEach(monster);if(s.state!=='over')monkey(s.y,t);x.restore()}function particles(X,Y,n,col){for(let i=0;i<n;i++)s.p.push({x:X,y:Y,vx:(Math.random()-.5)*7,vy:(Math.random()-.5)*7-2,l:1,c:col,z:3+Math.random()*3})}function update(t){if(s.state!=='playing')return;s.vy+=.62;s.y+=s.vy;let top=34,bot=H-ground-R-2;if(s.y<top)s.y=top,s.vy=0;if(s.y>bot)s.y=bot,s.vy=0;let d=Math.floor(s.score/300);if(t-s.lastB>900){s.lastB=t;s.b.push({x:30+Math.random()*160,y:-24,v:2.4+d*.4,r:Math.random()*7})}if(t-s.lastM>1650){s.lastM=t;s.m.push({x:400,y:H-ground-20-Math.random()*280,v:3+d*.5})}for(let i=s.b.length-1;i>=0;i--){let b=s.b[i];b.y+=b.v;b.r+=.05;if(b.y>H+30)s.b.splice(i,1);else if(Math.hypot(b.x-mx,b.y-s.y)<R+12){s.b.splice(i,1);s.coins++;s.score+=10;particles(b.x,b.y,6,'#ffd700');beep(880,.09,'triangle',.12,1320);hud()}}for(let i=s.m.length-1;i>=0;i--){let m=s.m[i];m.x-=m.v;if(m.x<-40)s.m.splice(i,1);else if(Math.hypot(m.x-mx,m.y-s.y)<R+18){s.m.splice(i,1);s.lives--;s.shake=14;particles(m.x,m.y,8,'#ff5a5f');beep(160,.28,'sawtooth',.14,60);hud();if(s.lives<=0)end()}}for(let i=s.p.length-1;i>=0;i--){let p=s.p[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.18;p.l-=.04;if(p.l<=0)s.p.splice(i,1)}}function loop(t){update(t);draw(t);requestAnimationFrame(loop)}hud();requestAnimationFrame(loop)})();
</script></body></html>
