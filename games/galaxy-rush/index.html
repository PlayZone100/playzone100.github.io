<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Galaxy Rush</title>
  <style>
    :root {
      --bg1: #050816;
      --bg2: #110f25;
      --panel: rgba(15, 18, 34, 0.72);
      --line: rgba(255,255,255,0.12);
      --text: #edf5ff;
      --muted: #a5b4d9;
      --cyan: #69e0ff;
      --violet: #b08cff;
      --lime: #c8ff75;
      --gold: #ffd76a;
      --danger: #ff6b7a;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at top, #171d39 0%, var(--bg1) 35%, #090b17 100%);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
    }

    #gameWrap {
      position: relative;
      width: min(100vw, 980px);
      height: min(100vh, 700px);
      border-radius: 28px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(5,10,22,0.95), rgba(17,15,33,1));
      box-shadow: 0 30px 70px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(255,255,255,0.04);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: transparent;
      touch-action: none;
    }

    .hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
      padding: 18px 22px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      z-index: 4;
    }

    .badge {
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(13, 17, 32, 0.64);
      border: 1px solid var(--line);
      backdrop-filter: blur(10px);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .badge strong {
      color: var(--text);
      font-size: 18px;
      letter-spacing: 0;
      margin-left: 8px;
    }

    .screen {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(9, 11, 23, 0.45);
      backdrop-filter: blur(8px);
    }

    .screen.hidden {
      display: none;
    }

    .panel {
      width: min(88%, 560px);
      text-align: center;
      padding: 30px 22px 24px;
      border-radius: 24px;
      background: rgba(15, 18, 34, 0.82);
      border: 1px solid var(--line);
      box-shadow: 0 28px 80px rgba(0,0,0,0.38);
    }

    .title {
      margin: 0;
      font-size: clamp(2rem, 5vw, 4rem);
      letter-spacing: -0.05em;
      line-height: 0.9;
      font-weight: 900;
      background: linear-gradient(90deg, var(--cyan), var(--violet), var(--lime));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      margin: 14px auto 0;
      max-width: 420px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }

    .controls {
      margin-top: 22px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 12px 22px;
      font-size: 15px;
      font-weight: 800;
      color: #09121d;
      background: linear-gradient(90deg, var(--cyan), var(--lime));
      cursor: pointer;
      box-shadow: 0 15px 28px rgba(105,224,255,0.22);
    }

    .secondary {
      color: var(--text);
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line);
      box-shadow: none;
    }

    @media (max-width: 700px) {
      #gameWrap {
        width: 100vw;
        height: 100vh;
        border-radius: 0;
      }
      .hud {
        padding: 14px 12px;
      }
      .badge {
        font-size: 10px;
        letter-spacing: 0.08em;
      }
      .badge strong {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div id="gameWrap">
    <div class="hud">
      <div class="badge">Score <strong id="score">0</strong></div>
      <div class="badge">Best <strong id="best">0</strong></div>
    </div>

    <div id="startScreen" class="screen">
      <div class="panel">
        <h1 class="title">GALAXY RUSH</h1>
        <p class="subtitle">Pilot your ship through the asteroid belt, dodge danger, and collect orbit crystals to survive as long as possible.</p>
        <div class="controls">
          <button id="startBtn">Start Mission</button>
        </div>
      </div>
    </div>

    <div id="gameOverScreen" class="screen hidden">
      <div class="panel">
        <h2 class="title" style="font-size: clamp(2.2rem, 6vw, 3.5rem);">Mission Failed</h2>
        <p class="subtitle" id="finalText">You scored 0 points.</p>
        <div class="controls">
          <button id="restartBtn">Play Again</button>
        </div>
      </div>
    </div>

    <canvas id="gameCanvas"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const finalText = document.getElementById('finalText');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');

    let width = 0;
    let height = 0;
    let time = 0;
    let animationId = null;
    let running = false;
    let lastTime = 0;
    let state = 'menu';

    const storedBest = Number(localStorage.getItem('galaxyRushBest') || 0);
    bestEl.textContent = storedBest;

    const pointer = {
      x: 0,
      y: 0,
      active: false
    };

    const player = {
      x: 0,
      y: 0,
      radius: 18,
      speed: 420,
      cooldown: 0,
      hitFlash: 0
    };

    const bullets = [];
    const stars = [];
    const asteroids = [];
    const crystals = [];
    const particleBursts = [];

    let score = 0;

    function resize() {
      const bounds = canvas.parentElement.getBoundingClientRect();
      width = bounds.width;
      height = bounds.height;
      canvas.width = Math.max(1, width * devicePixelRatio);
      canvas.height = Math.max(1, height * devicePixelRatio);
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);

      if (state === 'menu') {
        player.x = width / 2;
        player.y = height - 90;
      }

      if (player.x === 0) {
        player.x = width / 2;
      }
      if (player.y === 0) {
        player.y = height - 90;
      }
    }

    function makeStars() {
      stars.length = 0;
      for (let i = 0; i < 150; i++) {
        stars.push({
          x: Math.random() * width,
          y: Math.random() * height,
          r: Math.random() * 2 + 0.8,
          speed: Math.random() * 0.5 + 0.3,
          alpha: Math.random() * 0.8 + 0.2
        });
      }
    }

    function resetGame() {
      score = 0;
      time = 0;
      scoreEl.textContent = '0';
      bullets.length = 0;
      asteroids.length = 0;
      crystals.length = 0;
      particleBursts.length = 0;
      player.x = width / 2;
      player.y = height - 90;
      player.cooldown = 0;
      player.hitFlash = 0;
      makeStars();
      if (state === 'playing') {
        running = true;
      }
    }

    function startGame() {
      state = 'playing';
      running = true;
      startScreen.classList.add('hidden');
      gameOverScreen.classList.add('hidden');
      resetGame();
      requestAnimationFrame(loop);
    }

    function endGame() {
      state = 'over';
      running = false;
      const best = Math.max(storedBest, score);
      localStorage.setItem('galaxyRushBest', String(best));
      bestEl.textContent = best;
      finalText.textContent = `You scored ${score} points.`;
      gameOverScreen.classList.remove('hidden');
    }

    function spawnAsteroid() {
      const size = Math.random() * 16 + 18;
      asteroids.push({
        x: Math.random() * (width - size * 2) + size,
        y: -size,
        radius: size,
        speed: Math.random() * 140 + 170,
        drift: (Math.random() - 0.5) * 70,
        spin: (Math.random() - 0.5) * 1.8
      });
    }

    function spawnCrystal() {
      const r = 10;
      crystals.push({
        x: Math.random() * (width - 30) + 15,
        y: -20,
        radius: r,
        speed: Math.random() * 120 + 135,
        pulse: Math.random() * Math.PI * 2
      });
    }

    function shoot() {
      if (!running || player.cooldown > 0) return;
      bullets.push({
        x: player.x,
        y: player.y - 18,
        radius: 4,
        speed: 520
      });
      player.cooldown = 0.18;
    }

    function update(dt) {
      time += dt;

      if (pointer.active) {
        const targetX = pointer.x;
        const dx = targetX - player.x;
        const move = Math.sign(dx) * Math.min(Math.abs(dx), player.speed * dt);
        player.x += move;
      }

      const keys = {
        ArrowLeft: false,
        ArrowRight: false
      };

      if (keyState.left) player.x -= player.speed * dt;
      if (keyState.right) player.x += player.speed * dt;

      player.x = Math.max(player.radius + 6, Math.min(width - player.radius - 6, player.x));
      player.cooldown = Math.max(0, player.cooldown - dt);
      player.hitFlash = Math.max(0, player.hitFlash - dt);

      if (Math.random() < 0.028 + Math.min(0.024, time * 0.0004)) {
        spawnAsteroid();
      }

      if (Math.random() < 0.012 + Math.min(0.035, time * 0.00032)) {
        spawnCrystal();
      }

      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.y -= b.speed * dt;
        if (b.y < -20) {
          bullets.splice(i, 1);
          continue;
        }

        for (let j = asteroids.length - 1; j >= 0; j--) {
          const a = asteroids[j];
          if (Math.hypot(b.x - a.x, b.y - a.y) < b.radius + a.radius) {
            bullets.splice(i, 1);
            asteroids.splice(j, 1);
            score += 10;
            scoreEl.textContent = score;
            burst(a.x, a.y, '#ffd76a', 14);
            break;
          }
        }
      }

      for (let i = asteroids.length - 1; i >= 0; i--) {
        const a = asteroids[i];
        a.x += a.drift * dt;
        a.y += a.speed * dt;
        a.spin += 0.03;

        if (a.y > height + a.radius) {
          asteroids.splice(i, 1);
          continue;
        }

        if (Math.hypot(player.x - a.x, player.y - a.y) < player.radius + a.radius) {
          asteroids.splice(i, 1);
          player.hitFlash = 0.6;
          score = Math.max(0, score - 12);
          scoreEl.textContent = score;
          burst(player.x, player.y, '#ff6b7a', 24);

          if (score <= -20 || score < 0) {
            endGame();
            return;
          }
        }
      }

      for (let i = crystals.length - 1; i >= 0; i--) {
        const c = crystals[i];
        c.y += c.speed * dt;
        c.pulse += dt * 5;

        if (c.y > height + c.radius) {
          crystals.splice(i, 1);
          continue;
        }

        if (Math.hypot(player.x - c.x, player.y - c.y) < player.radius + c.radius + 6) {
          crystals.splice(i, 1);
          score += 25;
          scoreEl.textContent = score;
          burst(c.x, c.y, '#7ef7ff', 18);
        }
      }

      for (let i = particleBursts.length - 1; i >= 0; i--) {
        const p = particleBursts[i];
        p.life -= dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        if (p.life <= 0) particleBursts.splice(i, 1);
      }

      for (let i = stars.length - 1; i >= 0; i--) {
        const s = stars[i];
        s.y += s.speed * 60 * dt;
        if (s.y > height + 3) {
          s.x = Math.random() * width;
          s.y = -2;
        }
      }
    }

    function burst(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        particleBursts.push({
          x,
          y,
          vx: (Math.random() - 0.5) * 180,
          vy: (Math.random() - 0.5) * 180,
          life: Math.random() * 0.6 + 0.4,
          color
        });
      }
    }

    function drawBackground() {
      ctx.clearRect(0, 0, width, height);
      const g = ctx.createRadialGradient(width * 0.55, height * 0.35, 20, width * 0.55, height * 0.35, Math.max(width, height) * 0.8);
      g.addColorStop(0, 'rgba(111, 90, 255, 0.18)');
      g.addColorStop(0.4, 'rgba(20, 29, 58, 0.38)');
      g.addColorStop(1, 'rgba(5, 8, 22, 0.98)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, width, height);

      for (const s of stars) {
        ctx.beginPath();
        ctx.fillStyle = `rgba(255,255,255,${s.alpha})`;
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.beginPath();
      ctx.fillStyle = 'rgba(105,224,255,0.08)';
      ctx.arc(width * 0.7, height * 0.28, 110, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.fillStyle = 'rgba(176,140,255,0.08)';
      ctx.arc(width * 0.25, height * 0.18, 130, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawPlayer() {
      const shipX = player.x;
      const shipY = player.y;
      const r = player.radius;

      ctx.save();
      ctx.translate(shipX, shipY);

      if (player.hitFlash > 0) {
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#ff6b7a';
      } else {
        ctx.shadowBlur = 18;
        ctx.shadowColor = '#69e0ff';
      }

      ctx.beginPath();
      ctx.moveTo(0, -r);
      ctx.lineTo(r * 0.8, r * 0.75);
      ctx.lineTo(0, r * 0.4);
      ctx.lineTo(-r * 0.8, r * 0.75);
      ctx.closePath();
      ctx.fillStyle = player.hitFlash > 0 ? '#ff8a9b' : '#7ef7ff';
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(-r * 0.22, r * 0.7);
      ctx.lineTo(0, r * 1.2);
      ctx.lineTo(r * 0.22, r * 0.7);
      ctx.closePath();
      ctx.fillStyle = '#ffd76a';
      ctx.fill();

      ctx.restore();
    }

    function drawBullets() {
      for (const b of bullets) {
        ctx.beginPath();
        ctx.fillStyle = '#f4d66d';
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawAsteroids() {
      for (const a of asteroids) {
        ctx.save();
        ctx.translate(a.x, a.y);
        ctx.rotate(a.spin);
        ctx.beginPath();
        ctx.fillStyle = '#8ca4d9';
        for (let i = 0; i < 8; i++) {
          const ang = (Math.PI * 2 / 8) * i;
          const radius = a.radius * (0.7 + (i % 2) * 0.35);
          const x = Math.cos(ang) * radius;
          const y = Math.sin(ang) * radius;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
    }

    function drawCrystals() {
      for (const c of crystals) {
        const pulse = 1 + (Math.sin(c.pulse) + 1) * 0.18;
        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.scale(pulse, pulse);
        ctx.beginPath();
        ctx.moveTo(0, -c.radius);
        ctx.lineTo(c.radius * 0.8, 0);
        ctx.lineTo(0, c.radius);
        ctx.lineTo(-c.radius * 0.8, 0);
        ctx.closePath();
        ctx.fillStyle = '#7ef7ff';
        ctx.fill();
        ctx.restore();
      }
    }

    function drawParticles() {
      for (const p of particleBursts) {
        ctx.beginPath();
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.arc(p.x, p.y, 2.8, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function render() {
      drawBackground();
      drawCrystals();
      drawAsteroids();
      drawBullets();
      drawPlayer();
      drawParticles();
    }

    function loop(ts) {
      if (!running) return;

      const dt = Math.min(0.032, (ts - lastTime) / 1000 || 0.016);
      lastTime = ts;
      update(dt);
      render();
      animationId = requestAnimationFrame(loop);
    }

    const keyState = { left: false, right: false };

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') keyState.left = true;
      if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') keyState.right = true;
      if (e.code === 'Space') {
        e.preventDefault();
        shoot();
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') keyState.left = false;
      if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') keyState.right = false;
    });

    const arena = document.getElementById('gameWrap');
    arena.addEventListener('pointermove', (e) => {
      const rect = arena.getBoundingClientRect();
      pointer.x = e.clientX - rect.left;
      pointer.y = e.clientY - rect.top;
      pointer.active = true;
    });

    arena.addEventListener('pointerdown', (e) => {
      const rect = arena.getBoundingClientRect();
      pointer.x = e.clientX - rect.left;
      pointer.y = e.clientY - rect.top;
      pointer.active = true;
      shoot();
    });

    arena.addEventListener('pointerleave', () => {
      pointer.active = false;
    });

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);

    resize();
    makeStars();
    render();
    window.addEventListener('resize', resize);
  </script>
</body>
</html>
