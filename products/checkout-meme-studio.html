<!DOCTYPE html>
<!--
  Meme Studio subscription checkout — SAME PATTERN as checkout-saas-landing-template.html.
  Talks DIRECTLY to the payment worker (morning-shape-c098) to create the order
  and poll payment status, exactly like every other product. The license worker
  (orange-brook-a798) is called only ONCE, at the very end, after payment is
  already confirmed — just to fetch the signed licence token. No more chained
  server-to-server order creation, so no more timeout/404 failures there.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — Meme Studio</title>
<style>
  body{font-family:Inter,-apple-system,sans-serif;background:#FAF8F4;color:#1B1E2B;max-width:480px;margin:60px auto;padding:0 20px;}
  .card{background:#fff;border:1px solid #E7E2D6;border-radius:16px;padding:28px;}
  h1{font-size:1.3rem;margin:0 0 6px;}
  .sub{color:#62667A;font-size:0.9rem;margin:0 0 22px;}
  select,button{font:inherit;}
  select{width:100%;padding:10px;border-radius:8px;border:1px solid #E7E2D6;margin-bottom:16px;}
  button{width:100%;padding:12px;border-radius:999px;border:none;background:#263866;color:#fff;font-weight:600;cursor:pointer;}
  button:disabled{opacity:0.6;cursor:default;}
  .pay-box{margin-top:20px;padding:18px;border:1px dashed #C08A3E;border-radius:12px;display:none;}
  .pay-box img{display:block;margin:0 auto 14px;}
  .addr{word-break:break-all;background:#F1EEE6;padding:10px;border-radius:8px;font-size:0.82rem;font-family:monospace;margin-bottom:10px;}
  .amount{font-size:1.4rem;font-weight:800;text-align:center;margin-bottom:14px;}
  .status{text-align:center;font-size:0.9rem;color:#62667A;margin-top:14px;}
  .status.paid{color:#1F5C46;font-weight:700;}
  .status.error{color:#B3341F;font-weight:600;}
  .license-box{margin-top:14px;padding:14px;background:#F1EEE6;border-radius:8px;display:none;}
  .license-box textarea{width:100%;height:70px;font-family:monospace;font-size:0.75rem;border:1px solid #E7E2D6;border-radius:6px;padding:8px;resize:none;}
  .license-box button{margin-top:8px;background:#1F5C46;}
</style>
</head>
<body>
  <div class="card" id="crypto-checkout">
    <h1>Meme Studio — Pro</h1>
    <p class="sub" id="product-sub">Choose a plan and currency</p>

    <select id="plan">
      <option value="monthly">Monthly — 31 days</option>
      <option value="yearly">Yearly — 366 days</option>
    </select>
    <select id="currency">
      <option value="USDT_TRC20">USDT (TRC20 / Tron)</option>
      <option value="USDT_ERC20">USDT (ERC20 / Ethereum)</option>
      <option value="BTC">Bitcoin (BTC)</option>
      <option value="ETH">Ethereum (ETH)</option>
      <option value="SOL">Solana (SOL)</option>
      <option value="DOGE">Dogecoin (DOGE)</option>
      <option value="LTC">Litecoin (LTC)</option>
      <option value="XRP">Ripple (XRP)</option>
      <option value="ADA">Cardano (ADA)</option>
      <option value="AVAX">Avalanche (AVAX)</option>
      <option value="BNB">BNB (BSC)</option>
    </select>
    <button id="create-order">Generate payment address</button>

    <div class="pay-box" id="pay-box">
      <div class="amount" id="pay-amount"></div>
      <div class="addr" id="pay-address"></div>
      <img id="qr" width="180" height="180" alt="Payment QR code">
      <div class="status" id="pay-status">Waiting for payment…</div>
      <div class="license-box" id="license-box">
        <div>Your licence key — keep it, it restores Pro access on another device:</div>
        <textarea id="license-token" readonly></textarea>
        <button id="copy-license">Copy licence key</button>
      </div>
    </div>
  </div>

  <script>
    // Same payment worker every other product uses.
    const WORKER_URL = "https://morning-shape-c098.alice56885236.workers.dev";
    // License worker: only called once, after payment is confirmed.
    const LICENSE_WORKER_URL = "https://orange-brook-a798.alice56885236.workers.dev";

    const planSel = document.getElementById("plan");
    const currencySel = document.getElementById("currency");
    const createBtn = document.getElementById("create-order");
    const payBox = document.getElementById("pay-box");
    const payAmount = document.getElementById("pay-amount");
    const payAddress = document.getElementById("pay-address");
    const payStatus = document.getElementById("pay-status");
    const qr = document.getElementById("qr");
    const licenseBox = document.getElementById("license-box");
    const licenseTokenEl = document.getElementById("license-token");

    let pollTimer = null;

    createBtn.addEventListener("click", async () => {
      createBtn.disabled = true;
      createBtn.textContent = "Creating order…";
      const plan = planSel.value;
      const currency = currencySel.value;
      const productId = plan === "yearly" ? "meme-studio-yearly" : "meme-studio-monthly";

      let order;
      try {
        const res = await fetch(`${WORKER_URL}/order`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ productId, currency }),
        });
        order = await res.json();
      } catch (e) {
        payStatus.textContent = "Error: could not reach the payment server. Try again.";
        payStatus.classList.add("error");
        createBtn.disabled = false;
        createBtn.textContent = "Generate payment address";
        return;
      }
      if (order.error) {
        payStatus.textContent = "Error: " + order.error;
        payStatus.classList.add("error");
        createBtn.disabled = false;
        createBtn.textContent = "Generate payment address";
        return;
      }

      payAmount.textContent = `${order.amount} ${order.currency.replace("_", " ")}`;
      payAddress.textContent = order.address;
      qr.src = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(order.address)}`;
      payBox.style.display = "block";
      createBtn.style.display = "none";

      pollTimer = setInterval(() => pollStatus(order.id, plan), 8000);
    });

    async function pollStatus(orderId, plan) {
      let data;
      try {
        const res = await fetch(`${WORKER_URL}/order/${orderId}/status`);
        data = await res.json();
      } catch (e) {
        return; // transient network hiccup — the next poll (8s later) will retry
      }
      if (data.status === "paid") {
        clearInterval(pollTimer);
        payStatus.textContent = "Payment confirmed! Issuing your licence…";
        payStatus.classList.add("paid");
        await fetchLicense(orderId, plan);
      } else if (data.status === "expired") {
        clearInterval(pollTimer);
        payStatus.textContent = "This payment window expired. Please refresh and try again.";
      }
    }

    // Called ONCE, after payment is already confirmed paid.
    async function fetchLicense(orderId, plan) {
      const prevToken = localStorage.getItem("memeStudioLicense") || "";
      const qs = new URLSearchParams({ plan, ...(prevToken ? { prevToken } : {}) });
      try {
        const res = await fetch(`${LICENSE_WORKER_URL}/license/${orderId}?${qs.toString()}`);
        const data = await res.json();
        if (data.status === "paid" && data.token) {
          localStorage.setItem("memeStudioLicense", data.token);
          licenseTokenEl.value = data.token;
          licenseBox.style.display = "block";
          payStatus.textContent = "Licence issued — you're all set!";
        } else {
          payStatus.textContent = "Payment confirmed, but licence issuing failed: " + (data.error || data.status);
          payStatus.classList.add("error");
        }
      } catch (e) {
        payStatus.textContent = "Payment confirmed, but could not reach the licence server. Refresh this page in a minute to retry.";
        payStatus.classList.add("error");
      }
    }

    document.getElementById("copy-license").addEventListener("click", () => {
      licenseTokenEl.select();
      document.execCommand("copy");
    });
  </script>
</body>
</html>
