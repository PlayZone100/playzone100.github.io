<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Profile — QuestMart Freelance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#141A2E; --navy-deep:#0D111F; --amber:#E3A23A; --sage:#7C9885;
    --rust:#C0432E; --paper:#F4F1EA; --paper-dim:#E7E2D6; --ink:#1C2233;
    --line:rgba(20,26,46,0.14); --white:#FFFFFF;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Inter', sans-serif; background:var(--paper); color:var(--ink);
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .mono{font-family:'JetBrains Mono', monospace;}
  a{color:inherit;}

  header.site{
    position:sticky; top:0; z-index:60;
    background:rgba(244,241,234,0.94); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    padding:14px 6vw; padding-top:calc(14px + env(safe-area-inset-top,0px));
    display:flex; align-items:center; justify-content:space-between; gap:20px;
  }
  .brand{display:flex; align-items:center; gap:10px; font-weight:800; font-size:19px; flex:none; text-decoration:none;}
  .brand .mark{width:28px; height:28px; border-radius:8px; background:var(--navy); position:relative; flex:none;}
  .brand .mark::after{content:""; position:absolute; inset:8px; background:var(--amber); clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);}
  nav.main-nav{display:flex; align-items:center; gap:6px; flex:1;}
  nav.main-nav a{ text-decoration:none; font-size:13.5px; font-weight:600; color:#565D73; padding:8px 14px; border-radius:8px; position:relative; }
  nav.main-nav a.active{color:var(--navy-deep); background:var(--paper-dim);}
  .nav-badge{ position:absolute; top:2px; right:2px; background:var(--rust); color:#fff; font-size:9px; font-weight:800; min-width:15px; height:15px; border-radius:8px; display:flex; align-items:center; justify-content:center; padding:0 3px; }
  .head-actions{display:flex; align-items:center; gap:10px; flex:none;}
  .btn-text{ background:none; border:none; font-family:inherit; font-size:13.5px; font-weight:700; color:var(--navy); cursor:pointer; padding:8px 6px; }
  .btn-primary{
    background:var(--amber); color:var(--navy-deep); border:none; border-radius:8px;
    padding:10px 18px; font-family:inherit; font-size:13.5px; font-weight:700; cursor:pointer;
  }
  .user-name{font-size:13px; color:#565D73; font-weight:600;}

  .wrap{max-width:980px; margin:0 auto; padding:4vw 6vw 8vw;}
  .back-link{ display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:700; color:#565D73; text-decoration:none; margin-bottom:18px; }

  .profile-head{ background:var(--white); border:1px solid var(--line); border-radius:18px; padding:clamp(20px,3vw,32px); display:flex; gap:22px; align-items:flex-start; flex-wrap:wrap; }
  .avatar{ width:72px; height:72px; border-radius:16px; background:var(--navy); color:var(--amber); font-family:'Fraunces',serif; font-weight:600; font-size:28px; display:flex; align-items:center; justify-content:center; flex:none; }
  .head-main{flex:1; min-width:220px;}
  .name-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .name-row h1{font-family:'Fraunces',serif; font-weight:600; font-size:clamp(22px,2.6vw,28px); color:var(--navy-deep);}
  .verified-tag{ display:inline-flex; align-items:center; gap:3px; color:#2C6FBF; font-weight:700; font-size:13px; }
  .headline{font-size:14.5px; color:#565D73; margin-top:4px;}
  .meta-row{display:flex; gap:16px; flex-wrap:wrap; margin-top:12px;}
  .meta-item{font-size:13px; color:#7A8096; display:flex; align-items:center; gap:6px;}
  .badges-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px;}
  .badge{ font-size:11.5px; font-weight:700; padding:5px 12px; border-radius:20px; }
  .badge.top{background:rgba(227,162,58,0.18); color:#9A6B1E;}
  .badge.payment{background:rgba(124,152,133,0.18); color:#3F5B47;}
  .rate-box{ text-align:right; flex:none; }
  .rate-box .v{ font-family:'JetBrains Mono',monospace; font-size:22px; font-weight:600; color:var(--navy-deep); }
  .rate-box .l{font-size:11.5px; color:#9AA0B2; margin-top:2px;}

  .stats-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:22px 0; }
  .stat-card{ background:var(--white); border:1px solid var(--line); border-radius:14px; padding:16px; text-align:center; }
  .stat-card .v{font-family:'Fraunces',serif; font-size:22px; color:var(--navy-deep);}
  .stat-card .l{font-size:11.5px; color:#9AA0B2; margin-top:4px;}

  .section{ background:var(--white); border:1px solid var(--line); border-radius:16px; padding:24px; margin-bottom:16px; }
  .section h3{font-size:14px; font-weight:700; color:var(--navy-deep); margin-bottom:12px;}
  .bio-text{font-size:14px; color:#3B4258; line-height:1.85; white-space:pre-wrap;}
  .skill-chip{ display:inline-block; font-size:12.5px; font-weight:600; color:#3F5B47; background:rgba(124,152,133,0.14); padding:6px 13px; border-radius:20px; margin:0 6px 6px 0; }
  .portfolio-link{ display:inline-flex; align-items:center; gap:6px; font-size:13.5px; font-weight:700; color:var(--navy); text-decoration:underline; }

  .review{ padding:16px 0; border-top:1px solid var(--line); }
  .review:first-child{border-top:none; padding-top:0;}
  .review-top{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  .review-name{font-size:13.5px; font-weight:700; color:var(--navy-deep);}
  .stars{color:var(--amber); font-size:13px; letter-spacing:1px;}
  .review-proj{font-size:12px; color:#9AA0B2; margin-top:2px;}
  .review-comment{font-size:13.5px; color:#3B4258; line-height:1.7; margin-top:8px;}
  .review-date{font-size:11.5px; color:#9AA0B2;}

  .empty-state{ text-align:center; padding:40px 20px; color:#7A8096; font-size:14px; }

  @media (max-width:700px){
    nav.main-nav{display:none;}
    .stats-grid{grid-template-columns:repeat(2,1fr);}
    .profile-head{flex-direction:column;}
    .rate-box{text-align:left;}
  }
</style>
</head>
<body>

<header class="site">
  <a class="brand" href="index.html"><span class="mark"></span> QuestMart Freelance</a>
  <nav class="main-nav">
    <a href="projects.html">Browse Projects</a>
    <a href="freelancers.html">Find Freelancers</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="messages.html">Messages<span class="nav-badge" id="navUnread" style="display:none;"></span></a>
    <a href="index.html#how">How it works</a>
  </nav>
  <div class="head-actions" id="headActions"></div>
</header>

<div class="wrap">
  <a class="back-link" href="javascript:history.back()">&larr; Back</a>
  <div id="profileRoot"><div class="empty-state">Loading profile…</div></div>
</div>

<script>
  const API_URL = "https://questmart-freelance-api.alice56885236.workers.dev";
  let token = localStorage.getItem('qm_token');
  let currentUser = null;
  try { currentUser = JSON.parse(localStorage.getItem('qm_user') || 'null'); } catch(e){ currentUser = null; }

  function authHeaders(extra){
    const h = Object.assign({}, extra || {});
    if(token) h["Authorization"] = "Bearer " + token;
    return h;
  }
  function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
  function initials(name){ return String(name||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase(); }
  function stars(n){ const full = Math.round(n||0); return '★★★★★☆☆☆☆☆'.slice(5-full,10-full); }
  function timeAgo(sqlDate){
    if(!sqlDate) return "";
    const iso = sqlDate.includes('T') ? sqlDate : sqlDate.replace(' ', 'T') + 'Z';
    const diffMs = Date.now() - new Date(iso).getTime();
    const days = Math.floor(diffMs / 86400000);
    if(days < 1) return "Today";
    if(days < 30) return days + (days===1 ? " day ago" : " days ago");
    return new Date(iso).toLocaleDateString();
  }

  function updateAuthUI(){
    const el = document.getElementById('headActions');
    if(currentUser){
      el.innerHTML = `<span class="user-name">${escapeHtml(currentUser.name)}</span><button class="btn-text" id="logoutBtn">Log out</button>`;
      document.getElementById('logoutBtn').addEventListener('click', ()=>{
        localStorage.removeItem('qm_token'); localStorage.removeItem('qm_user');
        location.reload();
      });
    } else {
      el.innerHTML = `<a href="projects.html"><button class="btn-text">Log in</button></a><a href="signup.html"><button class="btn-primary">Sign up</button></a>`;
    }
  }

  async function refreshUnread(){
    if(!token) return;
    try{
      const res = await fetch(`${API_URL}/api/me`, { headers: authHeaders() });
      const me = await res.json();
      if(me.error) return;
      const badge = document.getElementById('navUnread');
      if(me.unread > 0){ badge.style.display = 'flex'; badge.textContent = me.unread > 9 ? '9+' : me.unread; }
    } catch(e){}
  }

  function getIdFromUrl(){
    const p = new URLSearchParams(location.search);
    return Number(p.get('id'));
  }

  async function loadProfile(){
    const id = getIdFromUrl();
    const root = document.getElementById('profileRoot');
    if(!id){ root.innerHTML = `<div class="empty-state">No profile specified.</div>`; return; }
    try{
      const res = await fetch(`${API_URL}/api/users/${id}`);
      const d = await res.json();
      if(d.error){ root.innerHTML = `<div class="empty-state">${escapeHtml(d.error)}</div>`; return; }
      render(d);
    } catch(e){
      root.innerHTML = `<div class="empty-state">Couldn't load this profile. Try again.</div>`;
    }
  }

  function render(u){
    document.title = u.name + " — QuestMart Freelance";
    const isFreelancerView = u.role === 'freelancer' || u.role === 'both';
    const isEmployerView = u.role === 'employer' || u.role === 'both';

    const badges = [];
    if(u.badges.top_rated) badges.push(`<span class="badge top">⭐ Top Rated</span>`);
    if(u.badges.payment_verified) badges.push(`<span class="badge payment">💳 Payment Verified</span>`);

    const rateBox = (isFreelancerView && u.hourly_rate)
      ? `<div class="rate-box"><div class="v">$${u.hourly_rate}<span style="font-size:13px;color:#9AA0B2;">/hr</span></div><div class="l">Hourly rate</div></div>`
      : '';

    const statCards = [];
    if(isFreelancerView){
      statCards.push(
        `<div class="stat-card"><div class="v">${u.jobs_completed}</div><div class="l">Jobs completed</div></div>`,
        `<div class="stat-card"><div class="v">$${u.earned}</div><div class="l">Total earned</div></div>`
      );
    }
    if(isEmployerView){
      statCards.push(
        `<div class="stat-card"><div class="v">${u.projects_posted}</div><div class="l">Projects posted</div></div>`,
        `<div class="stat-card"><div class="v">$${u.spent}</div><div class="l">Total spent</div></div>`
      );
    }
    statCards.push(
      `<div class="stat-card"><div class="v">${u.rating_avg != null ? u.rating_avg : '—'}</div><div class="l">Avg. rating (${u.rating_count})</div></div>`,
      `<div class="stat-card"><div class="v">${u.country || '—'}</div><div class="l">Location</div></div>`
    );

    const skillsHtml = (u.skills && u.skills.length)
      ? u.skills.map(s=>`<span class="skill-chip">${escapeHtml(s)}</span>`).join('')
      : `<p style="font-size:13px;color:#9AA0B2;">No skills listed yet.</p>`;

    const reviewsHtml = (u.reviews && u.reviews.length)
      ? u.reviews.map(r => `
          <div class="review">
            <div class="review-top">
              <div>
                <div class="review-name">${escapeHtml(r.reviewer_name)}</div>
                <div class="review-proj">on “${escapeHtml(r.project_title)}”</div>
              </div>
              <div style="text-align:right;">
                <div class="stars">${stars(r.rating)}</div>
                <div class="review-date">${timeAgo(r.created_at)}</div>
              </div>
            </div>
            ${r.comment ? `<div class="review-comment">${escapeHtml(r.comment)}</div>` : ''}
          </div>
        `).join('')
      : `<div class="empty-state">No reviews yet.</div>`;

    document.getElementById('profileRoot').innerHTML = `
      <div class="profile-head">
        <div class="avatar">${initials(u.name)}</div>
        <div class="head-main">
          <div class="name-row">
            <h1>${escapeHtml(u.name)}</h1>
            ${u.badges.verified ? '<span class="verified-tag">✔ Verified</span>' : ''}
          </div>
          ${u.headline ? `<div class="headline">${escapeHtml(u.headline)}</div>` : ''}
          <div class="meta-row">
            ${u.country ? `<span class="meta-item">📍 ${escapeHtml(u.country)}</span>` : ''}
            ${u.company ? `<span class="meta-item">🏢 ${escapeHtml(u.company)}</span>` : ''}
            <span class="meta-item">🎭 ${u.role === 'both' ? 'Freelancer & Employer' : (u.role === 'freelancer' ? 'Freelancer' : 'Employer')}</span>
          </div>
          ${badges.length ? `<div class="badges-row">${badges.join('')}</div>` : ''}
        </div>
        ${rateBox}
      </div>

      <div class="stats-grid">${statCards.join('')}</div>

      ${u.bio ? `<div class="section"><h3>About</h3><div class="bio-text">${escapeHtml(u.bio)}</div></div>` : ''}

      ${isFreelancerView ? `<div class="section"><h3>Skills</h3>${skillsHtml}</div>` : ''}

      ${u.portfolio_url ? `<div class="section"><h3>Portfolio</h3><a class="portfolio-link" href="${escapeHtml(u.portfolio_url)}" target="_blank" rel="noopener noreferrer nofollow">${escapeHtml(u.portfolio_url)} ↗</a></div>` : ''}

      <div class="section"><h3>Reviews (${u.rating_count})</h3>${reviewsHtml}</div>
    `;
  }

  updateAuthUI();
  refreshUnread();
  loadProfile();
</script>

</body>
</html>
