<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard — QuestMart Freelance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#141A2E; --navy-deep:#0D111F; --amber:#E3A23A; --sage:#7C9885;
    --rust:#C0432E; --paper:#F4F1EA; --paper-dim:#E7E2D6; --ink:#1C2233;
    --line:rgba(20,26,46,0.14); --white:#FFFFFF;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Inter', sans-serif; background:var(--paper); color:var(--ink);
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .mono{font-family:'JetBrains Mono', monospace;}
  a{color:inherit;}

  header.site{
    position:sticky; top:0; z-index:60;
    background:rgba(244,241,234,0.94); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    padding:14px 6vw; padding-top:calc(14px + env(safe-area-inset-top,0px));
    display:flex; align-items:center; justify-content:space-between; gap:20px;
  }
  .brand{display:flex; align-items:center; gap:10px; font-weight:800; font-size:19px; flex:none; text-decoration:none;}
  .brand .mark{width:28px; height:28px; border-radius:8px; background:var(--navy); position:relative; flex:none;}
  .brand .mark::after{content:""; position:absolute; inset:8px; background:var(--amber); clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);}
  nav.main-nav{display:flex; align-items:center; gap:6px; flex:1;}
  nav.main-nav a{ text-decoration:none; font-size:13.5px; font-weight:600; color:#565D73; padding:8px 14px; border-radius:8px; position:relative; }
  nav.main-nav a.active{color:var(--navy-deep); background:var(--paper-dim);}
  .nav-badge{ position:absolute; top:2px; right:2px; background:var(--rust); color:#fff; font-size:9px; font-weight:800; min-width:15px; height:15px; border-radius:8px; display:flex; align-items:center; justify-content:center; padding:0 3px; }
  .head-actions{display:flex; align-items:center; gap:10px; flex:none;}
  .btn-text{ background:none; border:none; font-family:inherit; font-size:13.5px; font-weight:700; color:var(--navy); cursor:pointer; padding:8px 6px; }
  .btn-primary{ background:var(--amber); color:var(--navy-deep); border:none; border-radius:8px; padding:10px 18px; font-family:inherit; font-size:13.5px; font-weight:700; cursor:pointer; }
  .btn-secondary{ background:var(--paper-dim); color:var(--navy-deep); border:none; border-radius:9px; padding:11px 15px; font-family:inherit; font-size:13px; font-weight:700; cursor:pointer; }
  .btn-ghost{ background:none; border:1px solid var(--line); color:var(--navy-deep); border-radius:9px; padding:10px 15px; font-family:inherit; font-size:12.5px; font-weight:700; cursor:pointer; }
  .btn-danger{ background:none; border:1px solid rgba(192,67,46,0.4); color:var(--rust); border-radius:9px; padding:10px 15px; font-family:inherit; font-size:12.5px; font-weight:700; cursor:pointer; }
  .user-name{font-size:13px; color:#565D73; font-weight:600;}

  .page-head{max-width:1180px; margin:0 auto; padding:4vw 6vw 1vw; display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap;}
  .page-head h1{font-family:'Fraunces',serif; font-weight:600; font-size:clamp(26px,3.2vw,34px); color:var(--navy-deep);}
  .page-head p{margin-top:6px; color:#565D73; font-size:14px;}

  .wrap{max-width:1180px; margin:0 auto; padding:0 6vw 8vw;}

  .banner{ display:flex; align-items:center; justify-content:space-between; gap:14px; background:rgba(227,162,58,0.14); border:1px solid rgba(227,162,58,0.4); border-radius:14px; padding:14px 18px; margin-bottom:18px; font-size:13.5px; color:#7A5417; flex-wrap:wrap; }

  .stats-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:22px; }
  .stat-card{ background:var(--white); border:1px solid var(--line); border-radius:14px; padding:16px 18px; }
  .stat-card .l{font-size:11px; color:#9AA0B2; font-weight:700; text-transform:uppercase; letter-spacing:.03em;}
  .stat-card .v{font-family:'Fraunces',serif; font-size:22px; color:var(--navy-deep); margin-top:6px;}
  .stat-card .v.small{font-size:16px;}

  .tabs{display:flex; gap:6px; border-bottom:1px solid var(--line); margin-bottom:20px;}
  .tab-btn{ background:none; border:none; font-family:inherit; font-size:14px; font-weight:700; color:#9AA0B2; padding:10px 4px; margin-right:22px; cursor:pointer; border-bottom:2px solid transparent; }
  .tab-btn.active{color:var(--navy-deep); border-bottom-color:var(--amber);}
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  .section-title{font-size:13px; font-weight:700; color:var(--navy-deep); margin:22px 0 10px; text-transform:uppercase; letter-spacing:.03em;}
  .section-title:first-child{margin-top:0;}

  .row-card{ background:var(--white); border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin-bottom:10px; cursor:pointer; transition:border-color .15s; }
  .row-card:hover{border-color:var(--navy);}
  .row-top{display:flex; align-items:flex-start; justify-content:space-between; gap:14px; flex-wrap:wrap;}
  .row-title{font-size:14.5px; font-weight:700; color:var(--navy-deep);}
  .row-sub{font-size:12.5px; color:#7A8096; margin-top:4px;}
  .row-budget{font-family:'JetBrains Mono',monospace; font-size:15px; font-weight:600; color:var(--navy-deep); flex:none;}
  .row-foot{display:flex; align-items:center; gap:10px; margin-top:12px; flex-wrap:wrap;}

  .pill{ display:inline-block; font-size:11px; font-weight:700; padding:4px 11px; border-radius:20px; white-space:nowrap; }
  .pill.pending_payment{background:var(--paper-dim); color:#7A8096;}
  .pill.open{background:rgba(124,152,133,0.18); color:#3F5B47;}
  .pill.accepted{background:rgba(44,111,191,0.14); color:#2C6FBF;}
  .pill.delivered{background:rgba(227,162,58,0.18); color:#9A6B1E;}
  .pill.approved{background:rgba(124,152,133,0.25); color:#3F5B47;}
  .pill.paid{background:var(--navy); color:#fff;}
  .pill.disputed{background:rgba(192,67,46,0.16); color:var(--rust);}
  .pill.refunded{background:var(--paper-dim); color:#7A8096;}
  .pill.pending{background:rgba(227,162,58,0.18); color:#9A6B1E;}
  .pill.hired{background:rgba(124,152,133,0.2); color:#3F5B47;}
  .pill.declined{background:rgba(192,67,46,0.14); color:var(--rust);}
  .pill.withdrawn{background:var(--paper-dim); color:#7A8096;}
  .badge-count{ background:var(--rust); color:#fff; font-size:11px; font-weight:800; padding:3px 8px; border-radius:20px; }

  .empty-state{ text-align:center; padding:34px 20px; color:#9AA0B2; font-size:13.5px; background:var(--white); border:1px dashed var(--line); border-radius:14px; }

  .modal-overlay{ display:none; position:fixed; inset:0; background:rgba(13,17,31,0.6); z-index:100; align-items:flex-start; justify-content:center; padding:5vh 20px; overflow-y:auto; }
  .modal-overlay.show{display:flex;}
  .modal-box{ background:var(--white); border-radius:20px; max-width:640px; width:100%; padding:clamp(24px,4vw,38px); position:relative; margin:auto 0; }
  .modal-close{ position:absolute; top:18px; right:18px; background:var(--paper-dim); border:none; width:32px; height:32px; border-radius:50%; cursor:pointer; font-size:16px; color:var(--navy); display:flex; align-items:center; justify-content:center; }
  .modal-box h2{font-family:'Fraunces',serif; font-size:22px; color:var(--navy-deep); line-height:1.3; margin-bottom:6px; padding-right:30px;}
  .modal-sub{font-size:13px; color:#7A8096; margin-bottom:18px;}
  .modal-stats{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:20px;}
  .modal-stat{background:var(--paper); border-radius:10px; padding:12px 14px;}
  .modal-stat .l{font-size:11px; color:#9AA0B2;}
  .modal-stat .v{font-family:'Fraunces',serif; font-size:17px; color:var(--navy-deep); margin-top:3px;}
  .modal-desc{font-size:13.5px; color:#3B4258; line-height:1.8; margin-bottom:18px;}
  .modal-box hr{border:none; border-top:1px solid var(--line); margin:18px 0;}

  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12.5px; font-weight:700; color:var(--navy-deep); margin-bottom:6px;}
  .field input, .field select, .field textarea{ width:100%; border:1px solid var(--line); border-radius:9px; padding:11px 13px; font-family:inherit; font-size:13.5px; background:var(--paper); }
  .field textarea{resize:vertical; min-height:80px;}
  .field .hint{font-size:11.5px; color:#9AA0B2; margin-top:5px;}

  .btn-block{ width:100%; background:var(--amber); color:var(--navy-deep); border:none; border-radius:10px; padding:14px; font-family:inherit; font-size:14px; font-weight:700; cursor:pointer; margin-top:4px; }
  .btn-block.secondary{background:var(--paper-dim); color:var(--navy-deep);}
  .btn-block.danger{background:none; border:1px solid rgba(192,67,46,0.4); color:var(--rust);}
  .btn-block:disabled{opacity:.6; cursor:default;}
  .btn-row{display:flex; gap:10px;}
  .btn-row .btn-block{flex:1; margin-top:0;}

  .proposal-item{ border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:10px; }
  .proposal-item .ptop{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
  .proposal-item .pname{font-size:13.5px; font-weight:700; color:var(--navy-deep);}
  .proposal-item .pmeta{font-size:11.5px; color:#9AA0B2; margin-top:2px;}
  .proposal-item .pcover{font-size:12.5px; color:#3B4258; line-height:1.7; margin-top:8px; white-space:pre-wrap;}
  .star-rate{display:flex; gap:6px; margin-bottom:14px;}
  .star-rate span{font-size:26px; cursor:pointer; color:var(--paper-dim);}
  .star-rate span.active{color:var(--amber);}

  .toast{ position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(20px); z-index:200; background:var(--navy-deep); color:var(--paper); padding:14px 22px; border-radius:12px; font-size:13.5px; font-weight:600; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; display:flex; align-items:center; gap:10px; }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .toast .dot{width:8px; height:8px; border-radius:50%; background:var(--sage);}

  @media (max-width:860px){
    nav.main-nav{display:none;}
    .modal-stats{grid-template-columns:1fr 1fr;}
  }
</style>
</head>
<body>

<header class="site">
  <a class="brand" href="index.html"><span class="mark"></span> QuestMart Freelance</a>
  <nav class="main-nav">
    <a href="projects.html">Browse Projects</a>
    <a href="#" id="navPost">Post a Project</a>
    <a href="dashboard.html" class="active">Dashboard</a>
    <a href="messages.html">Messages<span class="nav-badge" id="navUnread" style="display:none;"></span></a>
    <a href="admin.html" id="navAdmin" style="display:none;">Admin</a>
  </nav>
  <div class="head-actions" id="headActions"></div>
</header>

<div class="page-head">
  <div>
    <h1>Your dashboard</h1>
    <p id="pageSub">Loading…</p>
  </div>
  <div style="display:flex; gap:10px;">
    <button class="btn-ghost" id="editProfileBtn">Edit profile</button>
    <button class="btn-primary" id="postBtnTop">+ Post a Project</button>
  </div>
</div>

<div class="wrap">
  <div id="banners"></div>

  <div class="stats-row" id="statsRow"></div>

  <div class="tabs">
    <button class="tab-btn active" id="tabClientBtn" onclick="switchTab('client')">As Client</button>
    <button class="tab-btn" id="tabFreelanceBtn" onclick="switchTab('freelance')">As Freelancer</button>
  </div>

  <div class="tab-panel active" id="panelClient">
    <div class="section-title">Needs payment</div>
    <div id="unpaidList"></div>
    <div class="section-title">Your projects</div>
    <div id="employerList"></div>
  </div>

  <div class="tab-panel" id="panelFreelance">
    <div class="section-title">Active work</div>
    <div id="jobsList"></div>
    <div class="section-title">Proposals sent</div>
    <div id="proposalsList"></div>
  </div>
</div>

<!-- Project workspace modal (employer + freelancer views) -->
<div class="modal-overlay" id="workModal"><div class="modal-box" id="workContent"></div></div>

<!-- Edit profile modal -->
<div class="modal-overlay" id="profileModal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal('profileModal')">✕</button>
    <h2>Edit profile</h2>
    <p class="modal-sub">This is what clients and freelancers see about you.</p>
    <div class="field"><label>Name</label><input type="text" id="prName"></div>
    <div class="field"><label>Headline</label><input type="text" id="prHeadline" placeholder="e.g. Full-stack developer, 5 yrs"></div>
    <div class="field"><label>Bio</label><textarea id="prBio"></textarea></div>
    <div class="field"><label>Skills (comma-separated)</label><input type="text" id="prSkills" placeholder="React, Figma, Copywriting"></div>
    <div class="field"><label>Hourly rate (USD, optional)</label><input type="number" id="prRate" min="0" max="1000"></div>
    <div class="field"><label>Country</label><input type="text" id="prCountry"></div>
    <div class="field"><label>Company (optional)</label><input type="text" id="prCompany"></div>
    <div class="field"><label>Portfolio URL (optional)</label><input type="text" id="prPortfolio" placeholder="https://"></div>
    <div class="field"><label>Payout wallet address</label><input type="text" id="prWallet" placeholder="Where should we send your payments?"></div>
    <button class="btn-block" id="prSaveBtn" onclick="saveProfile()">Save profile</button>
  </div>
</div>

<div class="toast" id="toast"><span class="dot"></span><span id="toastText"></span></div>

<script>
  const API_URL = "https://questmart-freelance-api.alice56885236.workers.dev";

  let token = localStorage.getItem('qm_token');
  let currentUser = null;
  try { currentUser = JSON.parse(localStorage.getItem('qm_user') || 'null'); } catch(e){ currentUser = null; }
  let dashData = null;
  let profileDetail = null; // full /api/me data for the edit form

  function authHeaders(extra){
    const h = Object.assign({}, extra || {});
    if(token) h["Authorization"] = "Bearer " + token;
    return h;
  }
  function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
  function fmtDate(sqlDate){
    if(!sqlDate) return "";
    const iso = sqlDate.includes('T') ? sqlDate : sqlDate.replace(' ', 'T') + 'Z';
    return new Date(iso).toLocaleDateString(undefined,{month:'short',day:'numeric'});
  }
  function closeModal(id){ document.getElementById(id).classList.remove('show'); }
  document.querySelectorAll('.modal-overlay').forEach(m=> m.addEventListener('click', e=>{ if(e.target===m) m.classList.remove('show'); }));
  let toastTimer;
  function showToast(msg){
    const t = document.getElementById('toast');
    document.getElementById('toastText').textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>t.classList.remove('show'), 3200);
  }

  function updateAuthUI(){
    const el = document.getElementById('headActions');
    if(currentUser){
      el.innerHTML = `<span class="user-name">${escapeHtml(currentUser.name)}</span><button class="btn-text" id="logoutBtn">Log out</button>`;
      document.getElementById('logoutBtn').addEventListener('click', logout);
    } else {
      el.innerHTML = `<button class="btn-text" id="loginBtn">Log in</button><button class="btn-primary" id="signupBtn">Sign up</button>`;
      document.getElementById('loginBtn').addEventListener('click', ()=> location.href='projects.html');
      document.getElementById('signupBtn').addEventListener('click', ()=> location.href='signup.html');
    }
  }
  function logout(){
    localStorage.removeItem('qm_token'); localStorage.removeItem('qm_user');
    token = null; currentUser = null;
    location.href = 'projects.html';
  }
  document.getElementById('navPost').addEventListener('click', e=>{ e.preventDefault(); location.href='projects.html'; });
  document.getElementById('postBtnTop').addEventListener('click', ()=> location.href='projects.html');

  function switchTab(which){
    document.getElementById('tabClientBtn').classList.toggle('active', which==='client');
    document.getElementById('tabFreelanceBtn').classList.toggle('active', which==='freelance');
    document.getElementById('panelClient').classList.toggle('active', which==='client');
    document.getElementById('panelFreelance').classList.toggle('active', which==='freelance');
  }

  async function loadDashboard(){
    if(!token){
      document.querySelector('.wrap').innerHTML = `<div class="empty-state">Please <a href="projects.html" style="font-weight:700; text-decoration:underline;">log in</a> to see your dashboard.</div>`;
      document.getElementById('pageSub').textContent = "";
      return;
    }
    try{
      const res = await fetch(`${API_URL}/api/dashboard`, { headers: authHeaders() });
      const d = await res.json();
      if(d.error){
        if(res.status === 401){ logout(); return; }
        showToast(d.error); return;
      }
      dashData = d;
      render();
    } catch(e){
      showToast("Couldn't load your dashboard. Try refreshing.");
    }
  }

  function render(){
    const d = dashData;
    document.getElementById('pageSub').textContent = `Welcome back, ${d.user.name}.`;

    if(d.user.is_admin) document.getElementById('navAdmin').style.display = '';
    const badge = document.getElementById('navUnread');
    if(d.unread > 0){ badge.style.display='flex'; badge.textContent = d.unread>9?'9+':d.unread; } else badge.style.display='none';

    // banners
    let banners = "";
    if(!d.user.has_wallet){
      banners += `<div class="banner"><span>💳 Add a payout wallet address so you can send proposals and get paid.</span><button class="btn-ghost" onclick="openProfileModal()">Add wallet</button></div>`;
    }
    if(!d.user.profile_complete){
      banners += `<div class="banner"><span>✨ Your profile is incomplete — a headline, bio and skills help you win more work.</span><button class="btn-ghost" onclick="openProfileModal()">Complete profile</button></div>`;
    }
    document.getElementById('banners').innerHTML = banners;

    // stats
    const s = d.stats, mo = d.money;
    document.getElementById('statsRow').innerHTML = `
      <div class="stat-card"><div class="l">Rating</div><div class="v">${s.rating_avg ? '★ '+s.rating_avg : '—'}</div></div>
      <div class="stat-card"><div class="l">Jobs completed</div><div class="v">${s.jobs_completed}</div></div>
      <div class="stat-card"><div class="l">Total earned</div><div class="v small">$${s.earned}</div></div>
      <div class="stat-card"><div class="l">In escrow (as client)</div><div class="v small">$${mo.employer_in_escrow}</div></div>
      <div class="stat-card"><div class="l">Spent (as client)</div><div class="v small">$${mo.employer_spent}</div></div>
      <div class="stat-card"><div class="l">In progress (freelance)</div><div class="v small">$${mo.freelancer_in_progress}</div></div>
    `;

    // client tab
    const unpaid = d.employer.unpaid || [];
    document.getElementById('unpaidList').innerHTML = unpaid.length ? unpaid.map(p => `
      <div class="row-card" style="cursor:default;">
        <div class="row-top">
          <div><div class="row-title">${escapeHtml(p.title)}</div><div class="row-sub">${escapeHtml(p.category)} · Not visible to freelancers until paid</div></div>
          <div class="row-budget">$${p.budget_usd}</div>
        </div>
        <div class="row-foot">
          <a href="checkout-project.html?project=${p.id}&budget=${encodeURIComponent(p.budget_usd)}"><button class="btn-ghost">Complete payment</button></a>
        </div>
      </div>
    `).join('') : `<div class="empty-state">Nothing waiting on payment.</div>`;

    const eProjects = d.employer.projects || [];
    document.getElementById('employerList').innerHTML = eProjects.length ? eProjects.map(p => `
      <div class="row-card" onclick="openProject(${p.id})">
        <div class="row-top">
          <div><div class="row-title">${escapeHtml(p.title)}</div><div class="row-sub">${escapeHtml(p.category)}${p.freelancer_name ? ' · Hired: '+escapeHtml(p.freelancer_name) : ''}</div></div>
          <div class="row-budget">$${p.budget_usd}</div>
        </div>
        <div class="row-foot">
          <span class="pill ${p.status}">${p.status.replace('_',' ')}</span>
          ${p.proposals_pending > 0 ? `<span class="badge-count">${p.proposals_pending} new proposal${p.proposals_pending===1?'':'s'}</span>` : ''}
        </div>
      </div>
    `).join('') : `<div class="empty-state">You haven't posted any funded projects yet. <a href="projects.html" style="text-decoration:underline; font-weight:700;">Post one</a>.</div>`;

    // freelance tab
    const jobs = d.freelancer.jobs || [];
    document.getElementById('jobsList').innerHTML = jobs.length ? jobs.map(j => `
      <div class="row-card" onclick="openProject(${j.id})">
        <div class="row-top">
          <div><div class="row-title">${escapeHtml(j.title)}</div><div class="row-sub">Client: ${escapeHtml(j.employer_name)}</div></div>
          <div class="row-budget">$${j.budget_usd}</div>
        </div>
        <div class="row-foot"><span class="pill ${j.status}">${j.status.replace('_',' ')}</span></div>
      </div>
    `).join('') : `<div class="empty-state">No active jobs yet — send a proposal on the <a href="projects.html" style="text-decoration:underline; font-weight:700;">Browse Projects</a> page.</div>`;

    const props = d.freelancer.proposals || [];
    document.getElementById('proposalsList').innerHTML = props.length ? props.map(p => `
      <div class="row-card" onclick="openProject(${p.project_id})">
        <div class="row-top">
          <div><div class="row-title">${escapeHtml(p.title)}</div><div class="row-sub">Client: ${escapeHtml(p.employer_name)} · Sent ${fmtDate(p.created_at)}</div></div>
          <div class="row-budget">$${p.budget_usd}</div>
        </div>
        <div class="row-foot"><span class="pill ${p.status}">${p.status}</span></div>
      </div>
    `).join('') : `<div class="empty-state">No pending or declined proposals.</div>`;
  }

  // ---------- project workspace ----------
  async function openProject(id){
    document.getElementById('workContent').innerHTML = `<button class="modal-close" onclick="closeModal('workModal')">✕</button><div class="empty-state" style="border:none;">Loading…</div>`;
    document.getElementById('workModal').classList.add('show');
    try{
      const res = await fetch(`${API_URL}/api/projects/${id}`, { headers: authHeaders() });
      const d = await res.json();
      if(d.error){ document.getElementById('workContent').innerHTML = `<button class="modal-close" onclick="closeModal('workModal')">✕</button><div class="empty-state" style="border:none;">${escapeHtml(d.error)}</div>`; return; }
      renderWorkspace(d);
    } catch(e){
      document.getElementById('workContent').innerHTML = `<button class="modal-close" onclick="closeModal('workModal')">✕</button><div class="empty-state" style="border:none;">Couldn't load this project.</div>`;
    }
  }

  function renderWorkspace(d){
    const p = d.project;
    const role = d.viewer.role; // employer | freelancer | admin | user
    let body = `
      <button class="modal-close" onclick="closeModal('workModal')">✕</button>
      <span class="pill ${p.status}" style="margin-bottom:10px;">${p.status.replace('_',' ')}</span>
      <h2>${escapeHtml(p.title)}</h2>
      <div class="modal-sub">${escapeHtml(p.category)} · ${role==='employer' ? 'Freelancer: '+(d.freelancer?escapeHtml(d.freelancer.name):'not hired yet') : 'Client: '+escapeHtml(d.employer.name)}</div>
      <div class="modal-stats">
        <div class="modal-stat"><div class="l">Budget</div><div class="v">$${p.budget_usd}</div></div>
        <div class="modal-stat"><div class="l">${role==='freelancer'?'You receive':'Platform fee'}</div><div class="v">$${role==='freelancer' ? d.fee.freelancer_payout : d.fee.platform_fee}</div></div>
        <div class="modal-stat"><div class="l">Status</div><div class="v" style="font-size:14px;">${p.status.replace('_',' ')}</div></div>
      </div>
      <div class="modal-desc">${escapeHtml(p.description)}</div>
    `;

    if(p.status === 'accepted' && p.revision_note){
      body += `<div class="banner" style="margin-bottom:16px;"><span>✏️ Revision requested: ${escapeHtml(p.revision_note)}</span></div>`;
    }
    if(p.status === 'disputed'){
      body += `<div class="banner" style="background:rgba(192,67,46,0.1); border-color:rgba(192,67,46,0.35); color:var(--rust);"><span>⚠️ Dispute open: ${escapeHtml(p.dispute_reason||'')}</span></div>`;
    }
    if(p.status === 'delivered' || p.status === 'approved' || p.status === 'paid'){
      if(p.delivery_note || p.delivery_link){
        body += `<hr><div class="section-title" style="margin-top:0;">Delivered work</div>`;
        if(p.delivery_note) body += `<div class="modal-desc">${escapeHtml(p.delivery_note)}</div>`;
        if(p.delivery_link) body += `<a href="${escapeHtml(p.delivery_link)}" target="_blank" style="font-size:13px; font-weight:700; text-decoration:underline;">View delivered file/link →</a>`;
      }
    }

    // ---------- EMPLOYER actions ----------
    if(role === 'employer'){
      if(p.status === 'open'){
        body += `<hr><div class="section-title" style="margin-top:0;">Proposals (${d.proposals.length})</div>`;
        body += d.proposals.length ? d.proposals.map(pr => `
          <div class="proposal-item">
            <div class="ptop">
              <div><div class="pname">${escapeHtml(pr.name)}${pr.is_verified?' ✔':''}</div>
                <div class="pmeta">${pr.rating_count ? '★ '+pr.rating_avg+' ('+pr.rating_count+')' : 'No reviews yet'} · ${pr.jobs_completed} jobs done${pr.delivery_days ? ' · '+pr.delivery_days+' day delivery' : ''}</div></div>
              <span class="pill ${pr.status}">${pr.status}</span>
            </div>
            <div class="pcover">${escapeHtml(pr.cover_letter)}</div>
            <div class="btn-row" style="margin-top:12px;">
              <button class="btn-block secondary" style="padding:10px;" onclick="declineProposal(${pr.id}, ${p.id})">Decline</button>
              <button class="btn-block" style="padding:10px; margin-top:0;" onclick="hireProposal(${pr.id}, ${p.id})">Hire</button>
            </div>
          </div>
        `).join('') : `<div class="empty-state">No proposals yet — check back soon.</div>`;
      }
      if(p.status === 'delivered'){
        body += `<hr><button class="btn-block" onclick="approveProject(${p.id})">Approve & release payment</button>
                  <button class="btn-block secondary" onclick="showRevisionForm(${p.id})">Request a revision</button>
                  <div id="revisionForm"></div>`;
      }
      if(['accepted','delivered'].includes(p.status)){
        body += `<button class="btn-block danger" onclick="showDisputeForm(${p.id})">Open a dispute</button><div id="disputeForm"></div>`;
      }
      if(p.status === 'accepted' || p.status === 'delivered' || p.status === 'disputed'){
        body += `<a href="messages.html?proposal=${d.proposals.find(x=>x.status==='hired')?.id || ''}"><button class="btn-block secondary" style="margin-top:10px;">Message freelancer</button></a>`;
      }
    }

    // ---------- FREELANCER actions ----------
    if(role === 'freelancer'){
      if(p.status === 'accepted'){
        body += `<hr><div class="section-title" style="margin-top:0;">Deliver your work</div>
          <div class="field"><label>Delivery note</label><textarea id="delNote" placeholder="What did you complete?"></textarea></div>
          <div class="field"><label>Delivery link (optional)</label><input type="text" id="delLink" placeholder="https://..."></div>
          <button class="btn-block" onclick="deliverProject(${p.id})">Mark as delivered</button>
          <button class="btn-block danger" style="margin-top:10px;" onclick="showDisputeForm(${p.id})">Open a dispute</button><div id="disputeForm"></div>`;
      }
      if(p.status === 'delivered'){
        body += `<div class="empty-state">Delivered — waiting on the client to approve.</div>
          <button class="btn-block danger" style="margin-top:10px;" onclick="showDisputeForm(${p.id})">Open a dispute</button><div id="disputeForm"></div>`;
      }
      if(['accepted','delivered','disputed'].includes(p.status)){
        const myProp = d.my_proposal;
        body += `<a href="messages.html${myProp?('?proposal='+myProp.id):''}"><button class="btn-block secondary" style="margin-top:10px;">Message client</button></a>`;
      }
    }

    if((role==='employer'||role==='freelancer') && ['approved','paid'].includes(p.status)){
      body += `<hr>`;
      if(d.can_review){
        body += `<div class="section-title" style="margin-top:0;">Leave a review</div>
          <div class="star-rate" id="starRate">${[1,2,3,4,5].map(n=>`<span data-v="${n}" onclick="setStar(${n})">★</span>`).join('')}</div>
          <div class="field"><textarea id="reviewComment" placeholder="How did it go?"></textarea></div>
          <button class="btn-block" onclick="submitReview(${p.id})">Submit review</button>`;
      } else if(d.reviews.length){
        body += `<div class="section-title" style="margin-top:0;">Reviews</div>` + d.reviews.map(r=>`<div class="proposal-item"><div class="ptop"><div class="pname">${'★'.repeat(r.rating)}</div><div class="pmeta">${fmtDate(r.created_at)}</div></div>${r.comment?`<div class="pcover">${escapeHtml(r.comment)}</div>`:''}</div>`).join('');
      }
    }

    document.getElementById('workContent').innerHTML = body;
  }

  let selectedStar = 0;
  function setStar(n){
    selectedStar = n;
    document.querySelectorAll('#starRate span').forEach(s => s.classList.toggle('active', Number(s.dataset.v) <= n));
  }

  async function hireProposal(proposalId, projectId){
    if(!confirm("Hire this freelancer? All other pending proposals will be declined.")) return;
    const res = await fetch(`${API_URL}/api/proposals/${proposalId}/hire`, { method:"POST", headers: authHeaders() });
    const r = await res.json();
    if(r.error){ showToast(r.error); return; }
    showToast("Freelancer hired!"); openProject(projectId); loadDashboard();
  }
  async function declineProposal(proposalId, projectId){
    if(!confirm("Decline this proposal?")) return;
    const res = await fetch(`${API_URL}/api/proposals/${proposalId}/decline`, { method:"POST", headers: authHeaders() });
    const r = await res.json();
    if(r.error){ showToast(r.error); return; }
    showToast("Proposal declined"); openProject(projectId);
  }
  async function approveProject(id){
    if(!confirm("Approve this delivery? This releases payment to the freelancer.")) return;
    const res = await fetch(`${API_URL}/api/projects/${id}/approve`, { method:"POST", headers: authHeaders() });
    const r = await res.json();
    if(r.error){ showToast(r.error); return; }
    showToast("Approved — payout is on its way."); openProject(id); loadDashboard();
  }
  function showRevisionForm(id){
    document.getElementById('revisionForm').innerHTML = `
      <div class="field" style="margin-top:12px;"><label>What needs to change?</label><textarea id="revNote"></textarea></div>
      <button class="btn-block secondary" onclick="submitRevision(${id})">Send revision request</button>`;
  }
  async function submitRevision(id){
    const note = document.getElementById('revNote').value.trim();
    if(note.length < 10){ showToast("Explain what needs to change (a sentence or two)."); return; }
    const res = await fetch(`${API_URL}/api/projects/${id}/request-revision`, { method:"POST", headers: authHeaders({"Content-Type":"application/json"}), body: JSON.stringify({note}) });
    const r = await res.json();
    if(r.error){ showToast(r.error); return; }
    showToast("Revision requested"); openProject(id);
  }
  function showDisputeForm(id){
    document.getElementById('disputeForm').innerHTML = `
      <div class="field" style="margin-top:12px;"><label>What went wrong?</label><textarea id="disReason"></textarea></div>
      <button class="btn-block danger" onclick="submitDispute(${id})">Submit dispute to admins</button>`;
  }
  async function submitDispute(id){
    const reason = document.getElementById('disReason').value.trim();
    if(reason.length < 20){ showToast("Explain what went wrong (at least a couple of sentences)."); return; }
    const res = await fetch(`${API_URL}/api/projects/${id}/dispute`, { method:"POST", headers: authHeaders({"Content-Type":"application/json"}), body: JSON.stringify({reason}) });
    const r = await res.json();
    if(r.error){ showToast(r.error); return; }
    showToast("Dispute submitted — an admin will review it."); openProject(id); loadDashboard();
  }
  async function deliverProject(id){
    const note = document.getElementById('delNote').value.trim();
    const link = document.getElementById('delLink').value.trim();
    if(!note && !link){ showToast("Add a note or a link to your delivered work."); return; }
    const res = await fetch(`${API_URL}/api/projects/${id}/deliver`, { method:"POST", headers: authHeaders({"Content-Type":"application/json"}), body: JSON.stringify({delivery_note:note, delivery_link:link}) });
    const r = await res.json();
    if(r.error){ showToast(r.error); return; }
    showToast("Marked as delivered!"); openProject(id); loadDashboard();
  }
  async function submitReview(id){
    if(!selectedStar){ showToast("Choose a star rating first."); return; }
    const comment = document.getElementById('reviewComment').value.trim();
    const res = await fetch(`${API_URL}/api/projects/${id}/review`, { method:"POST", headers: authHeaders({"Content-Type":"application/json"}), body: JSON.stringify({rating:selectedStar, comment}) });
    const r = await res.json();
    if(r.error){ showToast(r.error); return; }
    showToast("Review submitted — thanks!"); selectedStar = 0; openProject(id);
  }

  // ---------- profile edit ----------
  async function openProfileModal(){
    try{
      const res = await fetch(`${API_URL}/api/me`, { headers: authHeaders() });
      const me = await res.json();
      if(me.error){ showToast(me.error); return; }
      profileDetail = me;
      document.getElementById('prName').value = me.name || '';
      document.getElementById('prHeadline').value = me.headline || '';
      document.getElementById('prBio').value = me.bio || '';
      document.getElementById('prSkills').value = (me.skills||[]).join(', ');
      document.getElementById('prRate').value = me.hourly_rate || '';
      document.getElementById('prCountry').value = me.country || '';
      document.getElementById('prCompany').value = me.company || '';
      document.getElementById('prPortfolio').value = me.portfolio_url || '';
      document.getElementById('prWallet').value = me.wallet_address || '';
      document.getElementById('profileModal').classList.add('show');
    } catch(e){ showToast("Couldn't load your profile."); }
  }
  document.getElementById('editProfileBtn').addEventListener('click', openProfileModal);

  async function saveProfile(){
    const btn = document.getElementById('prSaveBtn');
    btn.disabled = true; btn.textContent = "Saving…";
    const body = {
      name: document.getElementById('prName').value.trim(),
      headline: document.getElementById('prHeadline').value.trim(),
      bio: document.getElementById('prBio').value.trim(),
      skills: document.getElementById('prSkills').value.trim(),
      hourly_rate: document.getElementById('prRate').value,
      country: document.getElementById('prCountry').value.trim(),
      company: document.getElementById('prCompany').value.trim(),
      portfolio_url: document.getElementById('prPortfolio').value.trim(),
      wallet_address: document.getElementById('prWallet').value.trim(),
    };
    try{
      const res = await fetch(`${API_URL}/api/me/profile`, { method:"PUT", headers: authHeaders({"Content-Type":"application/json"}), body: JSON.stringify(body) });
      const r = await res.json();
      if(r.error){ showToast(r.error); btn.disabled=false; btn.textContent="Save profile"; return; }
      currentUser.name = body.name;
      localStorage.setItem('qm_user', JSON.stringify(currentUser));
      showToast("Profile saved");
      closeModal('profileModal');
      updateAuthUI();
      loadDashboard();
    } catch(e){ showToast("Couldn't save your profile."); }
    btn.disabled = false; btn.textContent = "Save profile";
  }

  updateAuthUI();
  loadDashboard();
</script>

</body>
</html>
