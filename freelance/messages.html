<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Messages — QuestMart Freelance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#141A2E; --navy-deep:#0D111F; --amber:#E3A23A; --sage:#7C9885;
    --rust:#C0432E; --paper:#F4F1EA; --paper-dim:#E7E2D6; --ink:#1C2233;
    --line:rgba(20,26,46,0.14); --white:#FFFFFF;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html, body{height:100%;}
  body{
    font-family:'Inter', sans-serif; background:var(--paper); color:var(--ink);
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    display:flex; flex-direction:column;
  }
  a{color:inherit;}

  header.site{
    position:sticky; top:0; z-index:60; flex:none;
    background:rgba(244,241,234,0.94); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    padding:14px 6vw; padding-top:calc(14px + env(safe-area-inset-top,0px));
    display:flex; align-items:center; justify-content:space-between; gap:20px;
  }
  .brand{display:flex; align-items:center; gap:10px; font-weight:800; font-size:19px; flex:none; text-decoration:none;}
  .brand .mark{width:28px; height:28px; border-radius:8px; background:var(--navy); position:relative; flex:none;}
  .brand .mark::after{content:""; position:absolute; inset:8px; background:var(--amber); clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);}
  nav.main-nav{display:flex; align-items:center; gap:6px; flex:1;}
  nav.main-nav a{ text-decoration:none; font-size:13.5px; font-weight:600; color:#565D73; padding:8px 14px; border-radius:8px; position:relative; }
  nav.main-nav a.active{color:var(--navy-deep); background:var(--paper-dim);}
  .nav-badge{ position:absolute; top:2px; right:2px; background:var(--rust); color:#fff; font-size:9px; font-weight:800; min-width:15px; height:15px; border-radius:8px; display:flex; align-items:center; justify-content:center; padding:0 3px; }
  .head-actions{display:flex; align-items:center; gap:10px; flex:none;}
  .btn-text{ background:none; border:none; font-family:inherit; font-size:13.5px; font-weight:700; color:var(--navy); cursor:pointer; padding:8px 6px; }
  .btn-primary{ background:var(--amber); color:var(--navy-deep); border:none; border-radius:8px; padding:10px 18px; font-family:inherit; font-size:13.5px; font-weight:700; cursor:pointer; }
  .user-name{font-size:13px; color:#565D73; font-weight:600;}

  .msg-wrap{ flex:1; max-width:1180px; width:100%; margin:0 auto; padding:24px 6vw; display:grid; grid-template-columns:320px 1fr; gap:20px; min-height:0; }

  .conv-list{ background:var(--white); border:1px solid var(--line); border-radius:16px; overflow-y:auto; max-height:calc(100vh - 140px); }
  .conv-list h3{ font-size:13px; font-weight:700; color:var(--navy-deep); padding:16px 18px 8px; }
  .conv-item{ display:flex; gap:12px; align-items:flex-start; padding:13px 18px; cursor:pointer; border-left:3px solid transparent; }
  .conv-item:hover{background:var(--paper);}
  .conv-item.active{background:var(--paper-dim); border-left-color:var(--amber);}
  .conv-avatar{ width:38px; height:38px; border-radius:50%; background:var(--navy); color:#fff; font-weight:700; font-size:14px; display:flex; align-items:center; justify-content:center; flex:none; }
  .conv-meta{flex:1; min-width:0;}
  .conv-name{font-size:13.5px; font-weight:700; color:var(--navy-deep); display:flex; align-items:center; gap:6px;}
  .conv-proj{font-size:11.5px; color:#9AA0B2; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .conv-preview{font-size:12px; color:#7A8096; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .conv-unread{ background:var(--rust); color:#fff; font-size:10.5px; font-weight:800; min-width:17px; height:17px; border-radius:9px; display:flex; align-items:center; justify-content:center; padding:0 4px; flex:none; }

  .chat-panel{ background:var(--white); border:1px solid var(--line); border-radius:16px; display:flex; flex-direction:column; min-height:0; max-height:calc(100vh - 140px); }
  .chat-head{ padding:16px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:14px; flex:none; }
  .chat-head .who{display:flex; align-items:center; gap:12px;}
  .chat-head .name{font-size:14.5px; font-weight:700; color:var(--navy-deep);}
  .chat-head .proj{font-size:12px; color:#9AA0B2; margin-top:2px;}
  .pill{ display:inline-block; font-size:11px; font-weight:700; padding:4px 11px; border-radius:20px; white-space:nowrap; }
  .pill.open{background:rgba(124,152,133,0.18); color:#3F5B47;}
  .pill.accepted{background:rgba(44,111,191,0.14); color:#2C6FBF;}
  .pill.delivered{background:rgba(227,162,58,0.18); color:#9A6B1E;}
  .pill.approved{background:rgba(124,152,133,0.25); color:#3F5B47;}
  .pill.paid{background:var(--navy); color:#fff;}
  .pill.disputed{background:rgba(192,67,46,0.16); color:var(--rust);}

  .chat-body{ flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:10px; }
  .msg-row{display:flex;}
  .msg-row.mine{justify-content:flex-end;}
  .msg-bubble{ max-width:72%; padding:10px 14px; border-radius:14px; font-size:13.5px; line-height:1.55; white-space:pre-wrap; word-wrap:break-word; }
  .msg-row.mine .msg-bubble{background:var(--navy); color:#fff; border-bottom-right-radius:4px;}
  .msg-row.theirs .msg-bubble{background:var(--paper-dim); color:var(--ink); border-bottom-left-radius:4px;}
  .msg-time{font-size:10px; color:#9AA0B2; margin-top:3px; text-align:right;}
  .msg-row.theirs .msg-time{text-align:left;}

  .chat-input{ flex:none; padding:14px 18px; border-top:1px solid var(--line); display:flex; gap:10px; align-items:flex-end; }
  .chat-input textarea{ flex:1; border:1px solid var(--line); border-radius:12px; padding:11px 14px; font-family:inherit; font-size:13.5px; resize:none; max-height:110px; background:var(--paper); }
  .chat-send{ background:var(--amber); color:var(--navy-deep); border:none; border-radius:10px; padding:12px 18px; font-family:inherit; font-size:13px; font-weight:700; cursor:pointer; flex:none; }
  .chat-send:disabled{opacity:.5; cursor:default;}
  .chat-closed{ padding:14px 20px; background:var(--paper); border-top:1px solid var(--line); font-size:12.5px; color:#7A8096; text-align:center; flex:none; }

  .empty-state{ text-align:center; padding:60px 20px; color:#9AA0B2; font-size:13.5px; }
  .empty-panel{ display:flex; align-items:center; justify-content:center; height:100%; color:#9AA0B2; font-size:14px; text-align:center; padding:30px; }

  @media (max-width:860px){
    nav.main-nav{display:none;}
    .msg-wrap{grid-template-columns:1fr; padding:14px;}
    .conv-list{max-height:none;}
    .chat-panel{max-height:none;}
    .conv-list.hide-mobile, .chat-panel.hide-mobile{display:none;}
  }
</style>
</head>
<body>

<header class="site">
  <a class="brand" href="index.html"><span class="mark"></span> QuestMart Freelance</a>
  <nav class="main-nav">
    <a href="projects.html">Browse Projects</a>
    <a href="#" id="navPost">Post a Project</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="messages.html" class="active">Messages<span class="nav-badge" id="navUnread" style="display:none;"></span></a>
  </nav>
  <div class="head-actions" id="headActions"></div>
</header>

<div class="msg-wrap">
  <div class="conv-list" id="convList">
    <h3>Conversations</h3>
    <div class="empty-state">Loading…</div>
  </div>
  <div class="chat-panel" id="chatPanel">
    <div class="empty-panel">Select a conversation to start chatting.<br>Conversations open once a proposal is sent and open, or after you're hired.</div>
  </div>
</div>

<script>
  const API_URL = "https://questmart-freelance-api.alice56885236.workers.dev";
  let token = localStorage.getItem('qm_token');
  let currentUser = null;
  try { currentUser = JSON.parse(localStorage.getItem('qm_user') || 'null'); } catch(e){ currentUser = null; }

  let conversations = [];
  let activeProposalId = null;
  let lastMsgId = 0;
  let pollTimer = null;

  function authHeaders(extra){
    const h = Object.assign({}, extra || {});
    if(token) h["Authorization"] = "Bearer " + token;
    return h;
  }
  function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
  function initials(name){ return String(name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
  function fmtTime(sqlDate){
    if(!sqlDate) return "";
    const iso = sqlDate.includes('T') ? sqlDate : sqlDate.replace(' ', 'T') + 'Z';
    const d = new Date(iso);
    const now = new Date();
    if(d.toDateString() === now.toDateString()) return d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
    return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
  }

  function updateAuthUI(){
    const el = document.getElementById('headActions');
    if(currentUser){
      el.innerHTML = `<span class="user-name">${escapeHtml(currentUser.name)}</span><button class="btn-text" id="logoutBtn">Log out</button>`;
      document.getElementById('logoutBtn').addEventListener('click', logout);
    } else {
      el.innerHTML = `<button class="btn-text" id="loginBtn">Log in</button><button class="btn-primary" id="signupBtn">Sign up</button>`;
      document.getElementById('loginBtn').addEventListener('click', ()=> location.href='projects.html');
      document.getElementById('signupBtn').addEventListener('click', ()=> location.href='signup.html');
    }
  }
  function logout(){
    localStorage.removeItem('qm_token'); localStorage.removeItem('qm_user');
    location.href = 'projects.html';
  }
  document.getElementById('navPost').addEventListener('click', e=>{ e.preventDefault(); location.href='projects.html'; });

  async function loadConversations(){
    if(!token){
      document.getElementById('convList').innerHTML = `<h3>Conversations</h3><div class="empty-state">Please <a href="projects.html" style="font-weight:700; text-decoration:underline;">log in</a> first.</div>`;
      return;
    }
    try{
      const res = await fetch(`${API_URL}/api/conversations`, { headers: authHeaders() });
      const data = await res.json();
      if(data.error){ if(res.status===401){ logout(); return; } document.getElementById('convList').innerHTML = `<h3>Conversations</h3><div class="empty-state">${escapeHtml(data.error)}</div>`; return; }
      conversations = Array.isArray(data) ? data : [];
      renderConvList();
      refreshUnreadBadge();

      // auto-open ?proposal=ID from links elsewhere on the site
      const params = new URLSearchParams(location.search);
      const wantProposal = Number(params.get('proposal'));
      if(wantProposal && !activeProposalId){
        openConversation(wantProposal);
      } else if(!activeProposalId && conversations.length && window.innerWidth > 860){
        openConversation(conversations[0].proposal_id);
      }
    } catch(e){
      document.getElementById('convList').innerHTML = `<h3>Conversations</h3><div class="empty-state">Couldn't load conversations.</div>`;
    }
  }

  function refreshUnreadBadge(){
    const total = conversations.reduce((a,c)=>a+(c.unread||0),0);
    const badge = document.getElementById('navUnread');
    if(total>0){ badge.style.display='flex'; badge.textContent = total>9?'9+':total; } else badge.style.display='none';
  }

  function renderConvList(){
    const list = document.getElementById('convList');
    if(!conversations.length){
      list.innerHTML = `<h3>Conversations</h3><div class="empty-state">No conversations yet. They appear once you send or receive a proposal.</div>`;
      return;
    }
    list.innerHTML = `<h3>Conversations</h3>` + conversations.map(c => `
      <div class="conv-item ${c.proposal_id===activeProposalId?'active':''}" onclick="openConversation(${c.proposal_id})">
        <div class="conv-avatar">${initials(c.other_name)}</div>
        <div class="conv-meta">
          <div class="conv-name">${escapeHtml(c.other_name)}${c.other_verified?' ✔':''}</div>
          <div class="conv-proj">${escapeHtml(c.title)}</div>
          <div class="conv-preview">${c.last_body ? escapeHtml(c.last_body) : 'No messages yet — say hello'}</div>
        </div>
        ${c.unread>0 ? `<div class="conv-unread">${c.unread>9?'9+':c.unread}</div>` : ''}
      </div>
    `).join('');
  }

  async function openConversation(proposalId){
    activeProposalId = proposalId;
    lastMsgId = 0;
    clearInterval(pollTimer);
    renderConvList();
    document.getElementById('chatPanel').innerHTML = `<div class="empty-panel">Loading…</div>`;
    await loadMessages(true);
    pollTimer = setInterval(()=>loadMessages(false), 4000);
    // update url without reload
    const url = new URL(location.href);
    url.searchParams.set('proposal', proposalId);
    history.replaceState(null, '', url);
  }

  async function loadMessages(initial){
    if(!activeProposalId) return;
    try{
      const res = await fetch(`${API_URL}/api/proposals/${activeProposalId}/messages${initial?'':'?after='+lastMsgId}`, { headers: authHeaders() });
      const d = await res.json();
      if(d.error){ if(initial) document.getElementById('chatPanel').innerHTML = `<div class="empty-panel">${escapeHtml(d.error)}</div>`; return; }
      if(initial){
        renderChatShell(d);
        appendMessages(d.messages, d.me);
        loadConversations(); // refresh unread counts / previews
      } else if(d.messages.length){
        appendMessages(d.messages, d.me);
      }
    } catch(e){}
  }

  function renderChatShell(d){
    document.getElementById('chatPanel').innerHTML = `
      <div class="chat-head">
        <div class="who">
          <div class="conv-avatar">${initials(d.other.name)}</div>
          <div>
            <div class="name">${escapeHtml(d.other.name)}${d.other.badges && d.other.badges.verified ? ' ✔':''}</div>
            <div class="proj">${escapeHtml(d.project.title)} · $${d.project.budget_usd}</div>
          </div>
        </div>
        <span class="pill ${d.project.status}">${d.project.status.replace('_',' ')}</span>
      </div>
      <div class="chat-body" id="chatBody"></div>
      ${d.can_send
        ? `<div class="chat-input">
             <textarea id="chatInput" rows="1" placeholder="Write a message…"></textarea>
             <button class="chat-send" id="chatSendBtn" onclick="sendMessage()">Send</button>
           </div>`
        : `<div class="chat-closed">This conversation is closed.</div>`
      }
    `;
    if(d.can_send){
      const ta = document.getElementById('chatInput');
      ta.addEventListener('keydown', e=>{
        if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); }
      });
      ta.addEventListener('input', ()=>{ ta.style.height='auto'; ta.style.height=Math.min(ta.scrollHeight,110)+'px'; });
    }
  }

  function appendMessages(msgs, meId){
    if(!msgs.length) return;
    const body = document.getElementById('chatBody');
    if(!body) return;
    const wasNearBottom = body.scrollHeight - body.scrollTop - body.clientHeight < 60;
    msgs.forEach(m => {
      lastMsgId = Math.max(lastMsgId, m.id);
      const mine = m.sender_id === meId;
      const row = document.createElement('div');
      row.className = 'msg-row ' + (mine ? 'mine' : 'theirs');
      row.innerHTML = `<div><div class="msg-bubble">${escapeHtml(m.body)}</div><div class="msg-time">${fmtTime(m.created_at)}</div></div>`;
      body.appendChild(row);
    });
    if(body.children.length === msgs.length || wasNearBottom){
      body.scrollTop = body.scrollHeight;
    }
  }

  async function sendMessage(){
    const ta = document.getElementById('chatInput');
    const btn = document.getElementById('chatSendBtn');
    const text = ta.value.trim();
    if(!text) return;
    btn.disabled = true;
    try{
      const res = await fetch(`${API_URL}/api/proposals/${activeProposalId}/messages`, {
        method:"POST", headers: authHeaders({"Content-Type":"application/json"}), body: JSON.stringify({body:text})
      });
      const r = await res.json();
      if(r.error){ alert(r.error); btn.disabled=false; return; }
      ta.value = ""; ta.style.height='auto';
      await loadMessages(false);
    } catch(e){ alert("Couldn't send, try again."); }
    btn.disabled = false;
  }

  updateAuthUI();
  loadConversations();
</script>

</body>
</html>
