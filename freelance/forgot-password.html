<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forgot Password — QuestMart Freelance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
  :root{ --navy:#141A2E; --navy-deep:#0D111F; --amber:#E3A23A; --sage:#7C9885; --rust:#C0432E; --paper:#F4F1EA; --paper-dim:#E7E2D6; --ink:#1C2233; --line:rgba(20,26,46,0.14); --white:#FFFFFF; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:'Inter', sans-serif; background:var(--paper); color:var(--ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  a{color:inherit;}
  .card{ background:var(--white); border:1px solid var(--line); border-radius:20px; max-width:420px; width:100%; padding:clamp(28px,5vw,40px); }
  .brand{display:flex; align-items:center; gap:10px; font-weight:800; font-size:18px; margin-bottom:26px; text-decoration:none;}
  .brand .mark{width:26px; height:26px; border-radius:7px; background:var(--navy); position:relative; flex:none;}
  .brand .mark::after{content:""; position:absolute; inset:7px; background:var(--amber); clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);}
  h1{font-family:'Fraunces',serif; font-weight:600; font-size:24px; color:var(--navy-deep); margin-bottom:8px;}
  p.sub{font-size:13.5px; color:#7A8096; line-height:1.6; margin-bottom:24px;}
  .field{margin-bottom:18px;}
  .field label{display:block; font-size:12.5px; font-weight:700; color:var(--navy-deep); margin-bottom:6px;}
  .field input{ width:100%; border:1px solid var(--line); border-radius:9px; padding:12px 13px; font-family:inherit; font-size:13.5px; background:var(--paper); }
  .btn-primary{ width:100%; background:var(--amber); color:var(--navy-deep); border:none; border-radius:10px; padding:14px; font-family:inherit; font-size:14.5px; font-weight:700; cursor:pointer; }
  .btn-primary:disabled{opacity:.6; cursor:default;}
  .back-link{ display:block; text-align:center; margin-top:18px; font-size:13px; font-weight:700; color:var(--navy); text-decoration:none; }
  .success-box{ background:rgba(124,152,133,0.14); border:1px solid rgba(124,152,133,0.3); border-radius:12px; padding:16px; font-size:13.5px; color:#3F5B47; line-height:1.7; }
  .err-msg{ color:var(--rust); font-size:12.5px; margin-top:8px; display:none; }
</style>
</head>
<body>

<div class="card">
  <a class="brand" href="index.html"><span class="mark"></span> QuestMart Freelance</a>
  <div id="formView">
    <h1>Forgot your password?</h1>
    <p class="sub">Enter the email you signed up with. If it's registered, we'll send a link to reset your password.</p>
    <div class="field"><label>Email</label><input type="email" id="email" placeholder="you@example.com"></div>
    <div class="err-msg" id="errMsg"></div>
    <button class="btn-primary" id="submitBtn" onclick="submitRequest()">Send reset link</button>
  </div>
  <div id="successView" style="display:none;">
    <h1>Check your email</h1>
    <div class="success-box">If that email is registered with QuestMart, a reset link is on its way. It expires in 1 hour.</div>
  </div>
  <a class="back-link" href="projects.html">&larr; Back to log in</a>
</div>

<script>
  const API_URL = "https://questmart-freelance-api.alice56885236.workers.dev";

  async function submitRequest(){
    const email = document.getElementById('email').value.trim();
    const errEl = document.getElementById('errMsg');
    errEl.style.display = 'none';
    if(!email){ errEl.textContent = "Enter your email address."; errEl.style.display = 'block'; return; }
    const btn = document.getElementById('submitBtn');
    btn.disabled = true; btn.textContent = "Sending…";
    try{
      const res = await fetch(`${API_URL}/api/forgot-password`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email })
      });
      const result = await res.json();
      if(result.error){
        errEl.textContent = result.error; errEl.style.display = 'block';
        btn.disabled = false; btn.textContent = "Send reset link";
        return;
      }
      document.getElementById('formView').style.display = 'none';
      document.getElementById('successView').style.display = 'block';
    } catch(e){
      errEl.textContent = "Something went wrong, please try again."; errEl.style.display = 'block';
      btn.disabled = false; btn.textContent = "Send reset link";
    }
  }

  document.getElementById('email').addEventListener('keydown', e=>{ if(e.key === 'Enter') submitRequest(); });
</script>

</body>
</html>
