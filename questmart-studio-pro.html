<!DOCTYPE html>
<html lang="en">
<head>

<title>QuestMart Studio Pro — Creator Toolkit</title>

<style>
  :root{
    --bg:#0F1216;--panel:#161A20;--panel-2:#1D222A;--panel-3:#232935;--line:#282E38;--line-soft:#20252d;--text:#E9ECF1;--text-dim:#8B93A1;--text-faint:#5B6270;--amber:#F2A93B;--amber-dim:#8a6222;--teal:#3FC1C9;--teal-dim:#1c5054;--danger:#E5555C;--success:#3DD68C;--radius:10px;--sans:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;--cond:'Barlow Condensed',var(--sans);--mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;} body{background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;} ::selection{background:var(--amber);color:#1a1400;} a{color:inherit;} button{font-family:inherit;} ::-webkit-scrollbar{width:10px;height:10px;} ::-webkit-scrollbar-track{background:transparent;} ::-webkit-scrollbar-thumb{background:var(--panel-3);border-radius:8px;}
  #app{display:flex;flex-direction:column;min-height:100vh;}
  .topbar{display:flex;align-items:center;gap:16px;padding:0 20px;height:60px;flex:none;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40;}
  .brand{display:flex;align-items:center;gap:10px;margin-right:8px;}.brand-mark{width:26px;height:26px;flex:none;}.brand-name{font-family:var(--cond);font-weight:700;font-size:20px;letter-spacing:.3px;line-height:1;}.brand-name b{color:var(--amber);font-weight:700;}.mode-badge{font-family:var(--mono);font-size:11px;letter-spacing:.06em;padding:4px 9px;border-radius:99px;border:1px solid var(--line);color:var(--text-dim);}.mode-badge.pro{color:#0d0a02;background:var(--amber);border-color:var(--amber);}.topbar-spacer{flex:1;}.usage-pill{font-size:12.5px;color:var(--text-dim);display:flex;align-items:center;gap:7px;margin-right:6px;}.usage-dot{width:6px;height:6px;border-radius:50%;background:var(--teal);flex:none;}.btn{appearance:none;border:1px solid var(--line);background:var(--panel-2);color:var(--text);border-radius:8px;padding:9px 15px;font-size:13.5px;font-weight:600;cursor:pointer;transition:border-color .15s, background .15s, transform .1s;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;}.btn:hover{border-color:#3a4150;background:var(--panel-3);}.btn:active{transform:translateY(1px);}.btn-amber{background:var(--amber);border-color:var(--amber);color:#1a1400;}.btn-amber:hover{background:#ffbb52;border-color:#ffbb52;}.btn-ghost{background:transparent;}.btn-sm{padding:6px 11px;font-size:12.5px;}.btn:disabled{opacity:.45;cursor:not-allowed;}.btn svg{width:15px;height:15px;flex:none;}
  .layout{flex:1;display:flex;min-height:0;}.rail{width:230px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:14px 10px;overflow-y:auto;}.rail-group-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--text-faint);padding:10px 10px 6px;}.rail-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--text-dim);font-size:13.5px;font-weight:500;border:1px solid transparent;position:relative;margin-bottom:2px;}.rail-item:hover{background:var(--panel-2);color:var(--text);}.rail-item.active{background:var(--panel-2);color:var(--text);border-color:var(--line);}.rail-item.active::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;background:var(--amber);border-radius:0 3px 3px 0;}.rail-icon{width:17px;height:17px;flex:none;color:var(--text-dim);}.rail-item.active .rail-icon{color:var(--amber);}.main{flex:1;overflow-y:auto;padding:26px 30px 60px;min-width:0;}.tool-header{margin-bottom:22px;display:flex;align-items:flex-start;gap:14px;}.tool-icon-badge{width:40px;height:40px;flex:none;border-radius:9px;background:var(--panel-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--amber);}.tool-icon-badge svg{width:20px;height:20px;}.tool-title{font-family:var(--cond);font-size:26px;font-weight:700;line-height:1.15;}.tool-desc{color:var(--text-dim);font-size:13.5px;margin-top:3px;max-width:62ch;}.pro-chip{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:#1a1400;background:var(--amber);padding:2px 7px;border-radius:5px;margin-left:9px;vertical-align:2px;}.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);}.panel-pad{padding:20px;}.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px;} @media (max-width:900px){ .grid-2{grid-template-columns:1fr;} }
  label.field-label{display:block;font-size:12px;font-weight:600;color:var(--text-dim);margin-bottom:7px;letter-spacing:.01em;} input[type=text], input[type=number], textarea, select{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:10px 12px;font-size:13.5px;font-family:inherit;resize:vertical;} input[type=text]:focus, input[type=number]:focus, textarea:focus, select:focus{outline:none;border-color:var(--teal);} .field{margin-bottom:15px;}.row{display:flex;gap:10px;flex-wrap:wrap;}.chip-select{display:flex;flex-wrap:wrap;gap:7px;}.chip-opt{padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--panel-2);font-size:12.5px;color:var(--text-dim);cursor:pointer;}.chip-opt.sel{border-color:var(--teal);color:var(--teal);background:rgba(63,193,201,.08);}.result-box{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:14px 16px;font-size:13.5px;line-height:1.65;white-space:pre-wrap;min-height:70px;color:var(--text);}.result-box.empty{color:var(--text-faint);font-style:italic;}.dropzone{border:1.5px dashed var(--line);border-radius:10px;padding:26px;text-align:center;color:var(--text-dim);font-size:13px;cursor:pointer;background:var(--panel-2);}.dropzone:hover{border-color:var(--teal);}.dropzone svg{width:26px;height:26px;color:var(--text-faint);margin-bottom:8px;}.dropzone.has-file{border-style:solid;border-color:var(--line);}.canvas-wrap{background:repeating-conic-gradient(#20252d 0% 25%, #191d24 0% 50%) 50% / 18px 18px;border-radius:8px;border:1px solid var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:220px;} canvas{max-width:100%;display:block;} .slider-row{display:flex;align-items:center;gap:12px;} input[type=range]{flex:1;accent-color:var(--amber);} .slider-val{font-family:var(--mono);font-size:12px;color:var(--text-dim);width:38px;text-align:right;} .status-bar{flex:none;height:34px;border-top:1px solid var(--line);background:var(--panel);display:flex;align-items:center;padding:0 20px;font-size:11.5px;color:var(--text-faint);gap:16px;font-family:var(--mono);}.status-bar span{display:flex;align-items:center;gap:6px;}.status-dot{width:6px;height:6px;border-radius:50%;background:var(--success);}.hint{font-size:11.5px;color:var(--text-faint);margin-top:8px;line-height:1.6;}.hint code{font-family:var(--mono);background:var(--panel-2);padding:1px 5px;border-radius:4px;} @media (max-width:760px){ .rail{position:fixed;left:0;top:60px;bottom:34px;z-index:30;transform:translateX(-100%);transition:transform .2s;box-shadow:8px 0 24px rgba(0,0,0,.4);} .rail.open{transform:translateX(0);} .main{padding:18px 16px 50px;} }
</style>
</head>
<body>
<div id="app"></div>
<script>
const CONFIG={PRODUCT_NAME:"QuestMart",PRODUCT_SUFFIX:"Studio",AI_ENDPOINT:"/api/generate"};
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const el=(tag,attrs={},...kids)=>{const n=document.createElement(tag);for(const k in attrs){if(k==="class")n.className=attrs[k];else if(k==="html")n.innerHTML=attrs[k];else if(k.startsWith("on"))n.addEventListener(k.slice(2),attrs[k]);else n.setAttribute(k,attrs[k]);} kids.flat().forEach(k=>{if(k!=null)n.append(k.nodeType?k:document.createTextNode(k));}); return n;};
const svg=n=>{const s=el("span");s.innerHTML=ICONS[n]||"";return s.firstElementChild;};
const ICONS={
  logo:'<svg viewBox="0 0 24 24" fill="none"><path d="M3 15 9 5l6 10 6-10" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="19" r="2" fill="currentColor"/></svg>',
  title:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h10M4 18h7"/></svg>',
  hash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 9h14M5 15h14M9 4 7 20M17 4l-2 16"/></svg>',
  script:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4M9 13h6M9 17h6"/></svg>',
  cc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M7 15h2M12 15h5M7 10h10"/></svg>',
  thumb:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="m3 15 5-5 4 4 4-4 5 5"/><circle cx="8" cy="9" r="1.4" fill="currentColor" stroke="none"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>',
  spark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/></svg>',
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
  dl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 21h16"/></svg>',
  upload:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16V4m0 0-4 4m4-4 4 4M4 16v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>',
  crown:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 8 4 3 5-6 5 6 4-3-2 11H5Z"/></svg>'
};
const state={activeTool:"title"};
async function callAI(kind,p){
  try {
    const r=await fetch(CONFIG.AI_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({kind,...p})});
    if(r.ok){const d=await r.json(); if(d?.result) return {text:d.result,live:true}; }
  } catch(e) {}
  return {text:smartTemplate(kind,p),live:false};
}
function smartTemplate(kind,p){const topic=(p.topic||"your topic").trim()||"your topic"; if(kind==="title") return [
    "The Truth About "+topic+" Nobody Talks About",
    "I Tried "+topic+" For 30 Days — Here's What Happened",
    topic+": What I Wish I Knew Sooner",
    "Why "+topic+" Is Harder Than It Looks",
    "This Changed How I Think About "+topic
  ].map((x,i)=>`${i+1}. ${x}`).join("\n");
  if(kind==="hashtags") return Array.from(new Set([...(topic.toLowerCase().replace(/[^a-z0-9 ]/g,"").split(/\s+/).filter(Boolean).map(w=>"#"+w)),"#contentcreator","#viral","#trending","#fyp","#growthhacks","#smallcreator"])).slice(0,14).join(" ");
  if(kind==="script") return `HOOK\nOpen with a bold claim or question about ${topic}.\n\nSETUP\nExplain why ${topic} matters right now, in a conversational tone.\n\nVALUE\nBreak ${topic} into 3 concrete points.\n\nCTA\nEnd with a single action: comment, follow, or click.`;
  if(kind==="captions") return `1\n00:00:00,000 --> 00:00:03,200\nLet's talk about ${topic}.\n\n2\n00:00:03,200 --> 00:00:07,000\nHere's the one thing most people get wrong.\n\n3\n00:00:07,000 --> 00:00:12,500\nSave this for your next post or video idea.`;
  return "";
}
function toast(msg){const t=el("div",{class:"toast"},msg); document.body.appendChild(t); setTimeout(()=>t.remove(),3000); }
function copyText(txt){ navigator.clipboard?.writeText(txt).then(()=>toast("Copied")); }
function download(filename,blob){const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); a.remove(); }
function header(tool,label){return el("div",{class:"tool-header"}, el("div",{class:"tool-icon-badge"}, svg(tool.icon)), el("div",{}, el("div",{class:"tool-title"}, tool.name), el("div",{class:"tool-desc"}, label))); }
function renderTitleTool(tool){const wrap=el("div",{}); wrap.appendChild(header(tool,"Turn a rough topic into stronger video titles.")); const panel=el("div",{class:"panel panel-pad"}); const input=el("textarea",{rows:4,placeholder:"e.g. how I edit videos faster"}); const output=el("div",{class:"result-box empty"},"Your titles will appear here."); const btn=el("button",{class:"btn btn-amber",onclick:async()=>{btn.disabled=true; const {text}=await callAI("title", {topic:input.value}); output.classList.remove("empty"); output.textContent=text; btn.disabled=false; }}, svg("spark")," Generate Titles"); const copy=el("button",{class:"btn btn-sm",onclick:()=>copyText(output.textContent)}, svg("copy")," Copy"); panel.append(el("div",{class:"field"}, el("label",{class:"field-label"},"Video topic"), input), el("div",{class:"row",style:"margin-bottom:14px"}, btn, copy), output); wrap.appendChild(panel); return wrap; }
function renderHashTool(tool){const wrap=el("div",{}); wrap.appendChild(header(tool,"Generate a hashtag set sized for your content.")); const panel=el("div",{class:"panel panel-pad"}); const input=el("input",{type:"text",placeholder:"e.g. home espresso setup"}); const output=el("div",{class:"result-box empty"},"Your hashtags will appear here."); const btn=el("button",{class:"btn btn-amber",onclick:async()=>{btn.disabled=true; const {text}=await callAI("hashtags", {topic:input.value}); output.classList.remove("empty"); output.textContent=text; btn.disabled=false; }}, svg("spark")," Generate Hashtags"); const copy=el("button",{class:"btn btn-sm",onclick:()=>copyText(output.textContent)}, svg("copy")," Copy"); panel.append(el("div",{class:"field"}, el("label",{class:"field-label"},"Topic / niche"), input), el("div",{class:"row",style:"margin-bottom:14px"}, btn, copy), output); wrap.appendChild(panel); return wrap; }
function renderScriptTool(tool){const wrap=el("div",{}); wrap.appendChild(header(tool,"Create a structured script outline in seconds.")); const panel=el("div",{class:"panel panel-pad"}); const input=el("input",{type:"text",placeholder:"e.g. why creators quit YouTube"}); const output=el("div",{class:"result-box empty"},"Your script will appear here."); const btn=el("button",{class:"btn btn-amber",onclick:async()=>{btn.disabled=true; const {text}=await callAI("script", {topic:input.value, tone:"conversational"}); output.classList.remove("empty"); output.textContent=text; btn.disabled=false; }}, svg("spark")," Write Script"); const copy=el("button",{class:"btn btn-sm",onclick:()=>copyText(output.textContent)}, svg("copy")," Copy"); panel.append(el("div",{class:"field"}, el("label",{class:"field-label"},"Video topic"), input), el("div",{class:"row",style:"margin-bottom:14px"}, btn, copy), output); wrap.appendChild(panel); return wrap; }
function renderCaptionTool(tool){const wrap=el("div",{}); wrap.appendChild(header(tool,"Generate an editable caption starter.")); const panel=el("div",{class:"panel panel-pad"}); const input=el("textarea",{rows:4,placeholder:"Paste a short script or topic"}); const output=el("div",{class:"result-box empty"},"Your caption script will appear here."); const btn=el("button",{class:"btn btn-amber",onclick:async()=>{btn.disabled=true; const {text}=await callAI("captions", {topic:input.value}); output.classList.remove("empty"); output.textContent=text; btn.disabled=false; }}, svg("spark")," Generate Captions"); const copy=el("button",{class:"btn btn-sm",onclick:()=>copyText(output.textContent)}, svg("copy")," Copy"); const dl=el("button",{class:"btn btn-sm",onclick:()=>{ if (!output.textContent.trim()) return; download("captions.srt", new Blob([output.textContent], {type:"text/plain"})); }}, svg("dl")," Download .srt"); panel.append(el("div",{class:"field"}, el("label",{class:"field-label"},"Script or topic"), input), el("div",{class:"row",style:"margin-bottom:14px"}, btn, copy, dl), output); wrap.appendChild(panel); return wrap; }
function renderThumbTool(tool){const wrap=el("div",{}); wrap.appendChild(header(tool,"Compose a 1280×720 thumbnail with headline text.")); const panel=el("div",{class:"panel panel-pad grid-2"}); const canvas=el("canvas",{width:"1280",height:"720",style:"width:100%;height:auto"}); const ctx=canvas.getContext("2d"); let img=null; const headline=el("input",{type:"text",value:"MY BEST VIDEO YET"}); const colors=["#F2A93B","#3FC1C9","#E5555C","#FFFFFF","#0F1216"]; let textColor=colors[0]; const swatches=el("div",{class:"row"}); colors.forEach(color=>{ const dot=el("div",{class:"swatch"+ (color===textColor ? " sel": ""), style:"background:"+color, onclick: function(){ [...swatches.children].forEach(c=>c.classList.remove('sel')); this.classList.add('sel'); textColor=color; draw(); } }); swatches.appendChild(dot); }); const size=el("input",{type:"range",min:"40",max:"140",value:"96"}); const sizeVal=el("span",{class:"slider-val"},"96"); const fileInput=el("input",{type:"file",accept:"image/*",style:"display:none"}); const dz=el("div",{class:"dropzone"}, svg("upload"), el("div",{}, "Click to upload an image")); function draw(){ ctx.fillStyle="#12151b"; ctx.fillRect(0,0,1280,720); if(img){ const scale=Math.max(1280/img.width,720/img.height); const w=img.width*scale, h=img.height*scale; ctx.drawImage(img,(1280-w)/2,(720-h)/2,w,h); const grad=ctx.createLinearGradient(0,720,0,300); grad.addColorStop(0,"rgba(0,0,0,.75)"); grad.addColorStop(1,"rgba(0,0,0,0)"); ctx.fillStyle=grad; ctx.fillRect(0,0,1280,720);} else { ctx.fillStyle="#232935"; ctx.font="28px Inter, sans-serif"; ctx.fillText("Upload an image to begin", 40, 360); } const fontSize=Number(size.value); ctx.font="800 "+fontSize+"px 'Barlow Condensed', sans-serif"; ctx.textBaseline="bottom"; ctx.lineJoin="round"; ctx.lineWidth = fontSize*0.14; ctx.strokeStyle="rgba(0,0,0,.85)"; ctx.fillStyle=textColor; const text=(headline.value||"HEADLINE").toUpperCase(); const lines=[]; let line=""; text.split(" ").forEach(word=>{ const t=line?line+" "+word:word; if(ctx.measureText(t).width>1100 && line){ lines.push(line); line=word; } else { line=t; } }); if(line) lines.push(line); const y=720 - 30; lines.slice(0,3).forEach((ln, idx)=>{ const yy = y - idx*fontSize*1.15; ctx.strokeText(ln, 50, yy); ctx.fillText(ln, 50, yy); }); }
  dz.addEventListener("click",()=>fileInput.click()); fileInput.addEventListener("change",e=>{ const file=e.target.files[0]; if(!file) return; const url=URL.createObjectURL(file); const image=new Image(); image.onload=()=>{ img=image; dz.classList.add("has-file"); draw(); }; image.src=url; }); headline.addEventListener("input",draw); size.addEventListener("input",()=>{ sizeVal.textContent=size.value; draw(); }); const dlBtn=el("button",{class:"btn btn-amber",onclick:()=>canvas.toBlob(b=>download("thumbnail.png",b),"image/png")}, svg("dl")," Download PNG"); panel.append(el("div",{}, el("div",{class:"field"}, el("label",{class:"field-label"},"Headline text"), headline), el("div",{class:"field"}, el("label",{class:"field-label"},"Text color"), swatches), el("div",{class:"field"}, el("label",{class:"field-label"},"Text size"), el("div",{class:"slider-row"}, size, sizeVal)), dlBtn), el("div",{class:"canvas-wrap"}, canvas)); wrap.appendChild(panel); draw(); return wrap; }
const TOOLS=[
  {id:"title",group:"AI Writing",name:"Title Generator",icon:"title",render:renderTitleTool},
  {id:"hash",group:"AI Writing",name:"Hashtag Generator",icon:"hash",render:renderHashTool},
  {id:"script",group:"AI Writing",name:"Script Writer",icon:"script",render:renderScriptTool},
  {id:"cc",group:"AI Writing",name:"Caption AI",icon:"cc",render:renderCaptionTool},
  {id:"thumb",group:"Visuals",name:"Thumbnail Maker",icon:"thumb",render:renderThumbTool},
  {id:"cal",group:"Plan",name:"Content Calendar",icon:"cal",render:()=>{const wrap=el("div",{}); wrap.appendChild(header({icon:"cal",name:"Content Calendar"},"Track upcoming content batches.")); const panel=el("div",{class:"panel panel-pad"}, el("div",{class:"hint"},"Calendar view is ready for your content plan.")); wrap.appendChild(panel); return wrap;}}
];
function renderMain(){ const main=$("#main"); main.innerHTML=""; const tool=TOOLS.find(t=>t.id===state.activeTool); main.appendChild(tool.render(tool)); }
function renderShell(){ const app=$("#app"); app.innerHTML=""; const topbar=el("div",{class:"topbar"}, el("div",{class:"brand"}, el("div",{class:"brand-mark"}, svg("logo")), el("div",{class:"brand-name"}, CONFIG.PRODUCT_NAME, el("b",{}, " "+CONFIG.PRODUCT_SUFFIX))), el("div",{class:"mode-badge pro"},"PRO"), el("div",{class:"topbar-spacer"}), el("div",{class:"usage-pill"}, svg("crown"), "All tools unlocked")); const rail=el("div",{class:"rail"}); let lastGroup=null; TOOLS.forEach(t=>{ if(t.group!==lastGroup){ rail.appendChild(el("div",{class:"rail-group-label"}, t.group)); lastGroup=t.group; } const item=el("div",{class:"rail-item"+(state.activeTool===t.id?" active":""), onclick:()=>{ state.activeTool=t.id; renderMain(); highlight(); }}, el("span",{class:"rail-icon"}, svg(t.icon)), t.name); rail.appendChild(item); }); const main=el("div",{class:"main",id:"main"}); const status=el("div",{class:"status-bar"}, el("span",{}, el("span",{class:"status-dot"}), "Backend: ", CONFIG.AI_ENDPOINT, " (Smart Templates fallback)") ); app.append(topbar, el("div",{class:"layout"},rail,main), status); renderMain(); }
function highlight(){ $$(".rail-item").forEach((n,i)=> n.classList.toggle("active", TOOLS[i] && TOOLS[i].id===state.activeTool)); }
renderShell();
</script>
