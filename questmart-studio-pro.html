<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuestMart Studio Pro</title><style>:root{--bg:#0f1216;--p:#161a20;--p2:#1d222a;--line:#282e38;--text:#e9ecf1;--muted:#8b93a1;--a:#f2a93b;--t:#3fc1c9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,system-ui,sans-serif}#app{min-height:100vh;display:flex;flex-direction:column}.top{height:60px;background:var(--p);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 20px;position:sticky;top:0;z-index:3}.brand{font-size:20px;font-weight:800}.brand b{color:var(--a)}.badge{background:var(--a);color:#1a1400;border-radius:99px;padding:4px 9px;font:11px monospace}.spacer{flex:1;color:var(--muted);font-size:12px}.layout{display:flex;flex:1;min-height:calc(100vh - 94px)}.rail{width:235px;background:var(--p);border-right:1px solid var(--line);padding:14px 10px}.group{color:#5b6270;font:10px monospace;letter-spacing:.1em;padding:10px}.nav{display:block;width:100%;background:transparent;border:1px solid transparent;color:var(--muted);padding:10px;border-radius:8px;text-align:left;cursor:pointer;margin:2px 0}.nav:hover,.nav.active{background:var(--p2);border-color:var(--line);color:var(--text)}.nav.active{border-left:3px solid var(--a)}main{flex:1;padding:28px;min-width:0}.head{margin-bottom:20px}.head h1{margin:0 0 5px;font-size:30px}.head p{margin:0;color:var(--muted)}.panel{background:var(--p);border:1px solid var(--line);border-radius:10px;padding:20px}.field{margin-bottom:15px}label{display:block;color:var(--muted);font-size:12px;font-weight:700;margin-bottom:7px}input,textarea,select{width:100%;background:var(--p2);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:10px;font:inherit}textarea{min-height:100px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}button{border:1px solid var(--line);background:var(--p2);col function aiTool(title,desc,kind,multi=false){const w=el('div');w.append(head(title,desc));const p=el('div',{class:'panel'}),input=el(multi?'textarea':'input',multi?{placeholder:'Paste a script or topic'}:{placeholder:'Enter a topic'}),out=el('div',{class:'out muted',text:'Your result will appear here.'}),run=el('button',{class:'primary',text:'Generate'}),cp=el('button',{text:'Copy'});run.onclick=()=>{out.className='out';out.textContent=ai(kind,{topic:input.value});};cp.onclick=()=>copy(out.textContent);p.append(el('div',{class:'field'},el('label',{text:multi?'Script or topic':'Topic'}),input),el('div',{class:'actions'},run,cp),out);w.append(p);return w}

function audioTool(){const w=el('div');w.append(head('Audio Cleaner','Normalize audio locally and export a WAV file.'));const p=el('div',{class:'panel'}),file=el('input',{type:'file',accept:'audio/*'}),run=el('button',{class:'primary',text:'Clean & Download'}),status=el('div',{class:'out muted',text:'Select an audio file.'});run.onclick=async()=>{const f=file.files[0];if(!f)return;try{status.textContent='Processing...';const AC=window.AudioContext||window.webkitAudioContext,ctx=new AC(),buf=await ctx.decodeAudioData(await f.arrayBuffer()),out=ctx.createBuffer(buf.numberOfChannels,buf.length,buf.sampleRate);for(let c=0;c<buf.numberOfChannels;c++){const s=buf.getChannelData(c),d=out.getChannelData(c);let peak=Math.max(...s.map(v=>Math.abs(v)));const gain=peak?Math.min(1,0.9/peak):1;for(let i=0;i<s.length;i++)d[i]=Math.max(-1,Math.min(1,s[i]*gain))}download('cleaned-audio.wav',new Blob([wav(out)],{type:'audio/wav'}));status.textContent='Done. WAV downloaded.';ctx.close()}catch(e){status.textContent='This browser could not decode that audio format.'}};p.append(el('div',{class:'field'},el('label',{text:'Audio file'}),file),run,status);w.append(p);return w}

function videoTool(){const w=el('div');w.append(head('Video Compressor','Re-encode a short video locally as WebM, including its audio.'));const p=el('div',{class:'panel'}),file=el('input',{type:'file',accept:'video/*'}),run=el('button',{class:'primary',text:'Compress & Download'}),status=el('div',{class:'out muted',text:'Select a short video.'}),preview=el('video',{controls:true,style:'width:100%;display:none;margin-top:12px'});run.onclick=async()=>{const f=file.files[0];if(!f)return;if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream){status.textContent='This browser does not support local video compression.';return}run.disabled=true;status.textContent='Compressing...';const v=document.createElement('video');v.src=URL.createObjectURL(f);v.muted=false;await new Promise((ok,no)=>{v.onloadedmetadata=ok;v.onerror=no});const scale=.7,c=document.createElement('canvas');c.width=Math.max(2,Math.round(v.videoWidth*scale/2)*2);c.height=Math.max(2,Math.round(v.videoHeight*scale/2)*2);const cc=c.getContext('2d'),vs=c.captureStream(30);try{const audio=new AudioContext(),src=audio.createMediaElementSource(v),dest=audio.createMediaStreamDestination();src.connect(dest);src.connect(audio.destination);dest.stream.getAudioTracks().forEach(t=>vs.addTrack(t))}catch(e){}const mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')?'video/webm;codecs=vp9,opus':'video/webm',rec=new MediaRecorder(vs,{mimeType:mime,videoBitsPerSecond:900000}),chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);const done=new Promise(r=>rec.onstop=r);v.currentTime=0;await v.play();rec.start();const frame=()=>{if(v.ended||v.paused){if(rec.state==='recording')rec.stop();return}cc.drawImage(v,0,0,c.width,c.height);requestAnimationFrame(frame)};v.onended=()=>rec.state==='recording'&&rec.stop();frame();await done;const blob=new Blob(chunks,{type:mime});preview.src=URL.createObjectURL(blob);preview.style.display='block';download('compressed-video.webm',blob);status.textConte function calendar(){const w=el('div'),p=el('div',{class:'panel'});w.append(head('Content Calendar','Click a date to add or edit a post. Saved in this browser.'));let d=new Date(),posts=JSON.parse(localStorage.qmPosts||'{}'),title=el('h2',{text:''}),grid=el('div',{class:'calendar'});function draw(){title.textContent=d.toLocaleString(undefined,{month:'long',year:'numeric'});grid.innerHTML='';['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(x=>grid.append(el('div',{class:'muted',text:x})));const first=new Date(d.getFullYear(),d.getMonth(),1).getDay(),days=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();for(let i=0;i<first;i++)grid.append(el('div'));for(let n=1;n<=days;n++){const key=`${d.getFullYear()}-${d.getMonth()+1}-${n}`,cell=el('div',{class:'day'});cell.append(el('strong',{text:n}));if(posts[key])cell.append(el('span',{class:'post',text:posts[key]}));cell.onclick=()=>{const x=prompt('Post title:',posts[key]||'');if(x===null)return;if(x.trim())posts[key]=x.trim();else delete posts[key];localStorage.qmPosts=JSON.stringify(posts);draw()};grid.append(cell)}}const prev=el('button',{text:'‹'}),next=el('button',{text:'›'});prev.onclick=()=>{d.setMonth(d.getMonth()-1);draw()};next.onclick=()=>{d.setMonth(d.getMonth()+1);draw()};p.append(el('div',{class:'actions'},prev,next),title,grid);w.append(p);draw();return w}

function render(){const app=$('#app');app.innerHTML='';app.append(el('header',{class:'top'},el('div',{class:'brand'},'QuestMart ',el('b',{},'Studio')),el('span',{class:'badge',text:'PRO'}),el('span',{class:'spacer',text:'All tools unlocked'})));const layout=el('div',{class:'layout'}),rail=el('aside',{class:'rail'}),main=el('main');let group='';tools.forEach(([id,g,name,fn])=>{if(g!==group){rail.append(el('div',{class:'group',text:g}));group=g}const n=el('button',{class:'nav'+(id===state.tool?' active':''),text:name});n.onclick=()=>{state.tool=id;render()};rail.append(n)});layout.append(rail,main);app.append(layout,el('footer',{class:'status',text:'Local processing • AI tools use Smart Templates fallback when no backend is connected'}));const t=tools.find(x=>x[0]===state.tool);main.append(t[3]())}render();
