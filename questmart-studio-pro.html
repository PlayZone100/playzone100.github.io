<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1216">
<title>QuestMart Studio Pro</title>
<style>
:root{--bg:#0f1216;--panel:#161a20;--panel2:#1d222a;--line:#2b323d;--text:#edf0f5;--muted:#8d96a5;--gold:#f2a93b;--teal:#3fc1c9}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:flex;flex-direction:column}.top{height:62px;display:flex;align-items:center;gap:14px;padding:0 20px;background:var(--panel);border-bottom:1px solid var(--line)}.brand{font-size:20px;font-weight:800}.brand b{color:var(--gold)}.mark{display:inline-grid;place-items:center;width:30px;height:30px;margin-right:8px;border-radius:9px;background:linear-gradient(135deg,var(--gold),#e55);color:#211500}.grow{flex:1}.badge{padding:5px 10px;border:1px solid var(--line);border-radius:99px;color:var(--muted);font-size:11px}.btn{border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--text);padding:10px 14px;font-weight:700}.btn:hover{border-color:#4b5565;background:#252c37}.primary{background:var(--gold);border-color:var(--gold);color:#211500}.layout{display:flex;flex:1}.side{width:235px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:14px 10px}.group{padding:10px;color:#657080;font-size:10px;text-transform:uppercase}.nav{display:flex;width:100%;gap:10px;padding:10px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--muted);text-align:left}.nav:hover,.nav.active{background:var(--panel2);border-color:var(--line);color:var(--text)}.nav.active{color:var(--gold)}.main{flex:1;min-width:0;padding:28px 32px 60px;overflow:auto}.page{max-width:1150px;margin:auto}.head{display:flex;gap:13px;margin-bottom:22px}.icon{width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;color:var(--gold);font-size:20px}.head h1{margin:0;font-size:28px}.desc{color:var(--muted);margin-top:5px;line-height:1.6}.panel{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:20px}.field{margin-bottom:15px}.label{display:block;color:var(--muted);font-size:12px;font-weight:700;margin-bottom:7px}textarea,input{width:100%;padding:11px 12px;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;outline:0}textarea:focus,input:focus{border-color:var(--teal)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.result{min-height:120px;padding:14px;white-space:pre-wrap;line-height:1.7;background:var(--panel2);border:1px solid var(--line);border-radius:8px}.empty{color:#657080;font-style:italic}.stats,.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat,.card{padding:18px;background:var(--panel);border:1px solid var(--line);border-radius:11px}.stat small{display:block;color:var(--muted);margin-bottom:8px}.stat strong{font-size:26px;color:var(--gold)}.cards{margin-top:16px}.card .symbol{font-size:25px;color:var(--gold)}.card p{color:var(--muted);line-height:1.6}.footer{height:34px;padding:8px 18px;background:var(--panel);border-top:1px solid var(--line);color:#657080;font-size:11px;text-align:center}.error{max-width:760px;margin:30px auto;padding:20px;border:1px solid #e5555c;border-radius:10px;background:#241719;color:#ffd9d9;white-space:pre-wrap}@media(max-width:760px){.side{position:fixed;top:62px;bottom:34px;left:0;z-index:5;transform:translateX(-100%);transition:.2s}.side.open{transform:none}.main{padding:20px 15px 50px}.stats,.cards{grid-template-columns:1fr 1fr}}@media(max-width:520px){.stats,.cards{grid-template-columns:1fr}.usage{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s), el=(tag,attrs={},...children)=>{const n=document.createElement(tag);Object.entries(attrs).forEach(([k,v])=>{if(k==='text')n.textContent=v;else if(k==='class')n.className=v;else if(k.startsWith('on'))n.addEventListener(k.slice(2),v);else n.setAttribute(k,v)});children.flat().forEach(c=>c!=null&&n.append(c.nodeType?c:document.createTextNode(c)));return n};
const state={active:'dashboard'};
const tools=[['title','Title Generator','T'],['hash','Hashtag Generator','#'],['script','Script Writer','✎'],['caption','Caption AI','CC']];
function header(title,desc,icon){return el('div',{class:'head'},el('div',{class:'icon',text:icon}),el('div',{},el('h1',{text:title}),el('div',{class:'desc',text:desc})))}
function generate(kind,value){const topic=(value||'your topic').trim()||'your topic';if(kind==='title')return ['The truth about '+topic+' nobody talks about','I tried '+topic+' for 30 days — here is what happened',topic+': what I wish I knew sooner','Why '+topic+' is harder than it looks','How to master '+topic+' faster'].map((x,i)=>(i+1)+'. '+x).join('\n');if(kind==='hash')return [...new Set(topic.toLowerCase().replace(/[^a-z0-9 ]/g,'').split(/\s+/).filter(Boolean).map(x=>'#'+x).concat(['#contentcreator','#youtube','#tiktok','#viral','#trending']))].join(' ');if(kind==='script')return 'HOOK\nOpen with a bold claim about '+topic+'.\n\nSETUP\nExplain why '+topic+' matters right now.\n\nVALUE\nBreak '+topic+' into three practical points with examples.\n\nCTA\nAsk viewers to follow or comment.';return '1\n00:00:00,000 --> 00:00:03,000\nLet\'s talk about '+topic+'.\n\n2\n00:00:03,000 --> 00:00:07,000\nHere is what most people get wrong.\n\n3\n00:00:07,000 --> 00:00:12,500\nAdd your next caption here.'}
function generator(id,name,icon,desc){const input=el('textarea',{rows:'4',placeholder:'Write your topic here...'}),out=el('div',{class:'result empty',text:'Your result will appear here.'}),button=el('button',{class:'btn primary',text:'Generate',onclick:()=>{out.classList.remove('empty');out.textContent=generate(id,input.value)}});return el('div',{class:'page'},header(name,desc,icon),el('div',{class:'panel'},el('div',{class:'field'},el('label',{class:'label',text:'Topic or script'}),input),el('div',{class:'actions'},button,el('button',{class:'btn',text:'Copy',onclick:()=>navigator.clipboard?.writeText(out.textContent)})),out))}
function dashboard(){const cards=tools.map(([id,name,icon])=>el('div',{class:'card'},el('div',{class:'symbol',text:icon}),el('h3',{text:name}),el('p',{text:'Create content with this tool.'}),el('button',{class:'btn',text:'Open tool',onclick:()=>{state.active=id;render()}})));return el('div',{class:'page'},header('Creator Dashboard','Create and prepare your next piece of content.','✦'),el('div',{class:'stats'},el('div',{class:'stat'},el('small',{text:'Status'}),el('strong',{text:'READY'})),el('div',{class:'stat'},el('small',{text:'Tools'}),el('strong',{text:'4'})),el('div',{class:'stat'},el('small',{text:'Mode'}),el('strong',{text:'DEMO'}))),el('div',{class:'cards'},cards))}
function render(){const root=$('#app');root.innerHTML='';const top=el('header',{class:'top'},el('button',{class:'btn',style:'display:none',onclick:()=>$('.side').classList.toggle('open'),text:'☰'}),el('div',{class:'brand'},el('span',{class:'mark',text:'Q'}),'QuestMart ',el('b',{text:'Studio'})),el('span',{class:'badge',text:'READY'}),el('span',{class:'grow'}),el('span',{class:'usage',text:'Client-side mode'}));const side=el('aside',{class:'side'});side.append(el('div',{class:'group',text:'Workspace'}),el('button',{class:'nav '+(state.active==='dashboard'?'active':''),onclick:()=>{state.active='dashboard';render()},text:'⌂ Dashboard'}));side.append(el('div',{class:'group',text:'AI Writing'}));tools.forEach(([id,name,icon])=>side.append(el('button',{class:'nav '+(state.active===id?'active':''),onclick:()=>{state.active=id;render()},text:icon+' '+name})));let content=state.active==='dashboard'?dashboard():generator(...tools.find(x=>x[0]===state.active),state.active==='title'?'Turn a rough topic into strong video titles.':state.active==='hash'?'Generate a relevant hashtag set.':state.active==='script'?'Build a structured script outline.':'Create an editable caption starter.');root.append(top,el('div',{class:'layout'},side,el('main',{class:'main'},content)),el('footer',{class:'footer',text:'QuestMart Studio · Works without an API or iframe'}))}
try{render()}catch(error){document.body.innerHTML='';document.body.append(el('pre',{class:'error',text:'QuestMart Studio failed to start.\n\n'+(error&&error.stack||error)}) )}
})();
</script>
</body>
</html>
