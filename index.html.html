body{background:#0A0A0C;overflow:hidden;font-family:ui-monospace,monospace;display:flex;align-items:center;justify-content:center;height:100vh}
#wrap{position:relative;width:360px;height:560px;background:radial-gradient(120% 120% at 50% 0%, #1A1A22 0%, #0A0A0C 70%);border:1px solid #ffffff12;border-radius:24px;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;color:#fff;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;opacity:0.9}
#score{font-size:28px;font-weight:700;letter-spacing:-0.02em}
#center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;pointer-events:none}
#center h2{font-size:18px;font-weight:600;letter-spacing:-0.02em;margin-bottom:6px}
#center p{font-size:11px;opacity:0.6;letter-spacing:0.08em;text-transform:uppercase}
#tap{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 18px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:0.02em;pointer-events:none;transition:opacity .2s}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud"><span id="level">LVL 01</span><span id="score">0</span></div>
  <canvas id="c" width="360" height="560"></canvas>
  <div id="center"><h2 id="msg">TAP TO STACK</h2><p id="sub">perfect = +2</p></div>
  <div id="tap">CLICK / SPACE</div>
</div>
<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('score');
const levelEl=document.getElementById('level');
const msgEl=document.getElementById('msg');
const subEl=document.getElementById('sub');
const tapEl=document.getElementById('tap');

function reset(){
  stack=[{x:W/2-70,w:140,y:H-20}];
  current={x:0,w:140,y:H-40,speed:2.8,dir:1};
  score=0;gameOver=false;perfectStreak=0;
  updateHUD(); msgEl.textContent='TAP TO STACK'; subEl.textContent='perfect = +2'; subEl.style.opacity='0.6'; tapEl.style.opacity='1';
}
function updateHUD(){scoreEl.textContent=score;levelEl.textContent='LVL '+(Math.floor(score/5)+1).toString().padStart(2,'0')}
function draw(){
  ctx.clearRect(0,0,W,H);
  // grid
  ctx.strokeStyle='#ffffff06';ctx.lineWidth=1;
  for(let i=0;i<W;i+=24){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,H);ctx.stroke()}
  // stack
  stack.forEach((b,i)=>{
    const hue=12 + i*6;
    ctx.fillStyle='hsl('+hue+',100%,60%)';
    ctx.shadowColor='hsl('+hue+',100%,60%)';ctx.shadowBlur=12;
    ctx.fillRect(b.x,b.y,b.w,20);
    ctx.shadowBlur=0;
    ctx.fillStyle='#ffffff18';ctx.fillRect(b.x,b.y, b.w,2);
  });
  // current
  if(!gameOver){
    const hue=12+stack.length*6;
    ctx.fillStyle='hsl('+hue+',100%,70%)';
    ctx.shadowColor='hsl('+hue+',100%,70%)';ctx.shadowBlur=16;
    ctx.fillRect(current.x,current.y,current.w,20);
    ctx.shadowBlur=0;
  }
}
function loop(){
  if(!gameOver){
    current.x+=current.speed*current.dir;
    if(current.x+current.w>W || current.x<0){current.dir*=-1;current.x=Math.max(0,Math.min(W-current.w,current.x))}
  }
  draw();requestAnimationFrame(loop);
}
function place(){
  if(gameOver){reset();return}
  tapEl.style.opacity='0';
  const prev=stack[stack.length-1];
  const overlap=Math.max(0, Math.min(prev.x+prev.w, current.x+current.w) - Math.max(prev.x, current.x));
  if(overlap<=0){gameOver=true;msgEl.textContent='MISSED';subEl.textContent='tap to restart';subEl.style.opacity='1';return}
  const diff=Math.abs((current.x+current.w/2)-(prev.x+prev.w/2));
  const perfect=diff<6;
  if(perfect){perfectStreak++;score+=2;msgEl.textContent=perfectStreak>1?'PERFECT x'+perfectStreak:'PERFECT';subEl.textContent='+2';} else {perfectStreak=0;score+=1;msgEl.textContent='NICE';subEl.textContent='keep going';}
  const newX=Math.max(prev.x, current.x);
  const newW=overlap;
  stack.push({x:newX,w:newW,y:current.y});
  current={x:0,w:newW,y:current.y-20,speed:2.8+stack.length*0.12,dir:1};
  if(stack.length>18){stack.shift();stack.forEach(b=>b.y+=20);current.y+=20;}
  updateHUD();
  if(score>0 && score%10===0){msgEl.textContent='LEVEL UP';}
}
canvas.addEventListener('pointerdown',place);
window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();place()}});
reset();loop();
<\/script>
</body>
