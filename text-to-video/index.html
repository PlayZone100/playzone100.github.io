<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text to Video</title>
<style>
:root{--bg:#0b0b12;--panel:#14141f;--accent:#7c5cff;--accent2:#ff5ca8;--text:#eaeaf5;--muted:#9a9ab0;--line:#2b2b42}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 10%,#1a1a2e,var(--bg) 60%);color:var(--text);font-family:Arial,sans-serif;min-height:100vh}header{text-align:center;padding:30px 20px 10px}h1{margin:0;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}header p{color:var(--muted)}main{max-width:800px;margin:auto;padding:20px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 10px 30px #0008}label{display:block;font-weight:bold;margin:14px 0 7px}textarea,input{width:100%;border:1px solid #41415d;border-radius:9px;background:#0d0d17;color:var(--text);padding:12px;font:inherit}textarea{min-height:125px;resize:vertical}input{max-width:180px}.row{display:flex;gap:14px;flex-wrap:wrap}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}button{border:0;border-radius:9px;padding:12px 18px;background:linear-gradient(90deg,var(--accent),var(--accent2));color:white;font-weight:bold;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.secondary{background:#2a2a40}.status{color:var(--muted);min-height:24px;margin-top:15px;line-height:1.5}.result{margin-top:18px}.result video{display:block;max-width:100%;border-radius:10px;background:#000}.back{display:inline-block;margin-top:20px;color:var(--accent);text-decoration:none}footer{text-align:center;color:var(--muted);font-size:.75rem;padding:25px}
</style>
</head>
<body>
<header><h1>TEXT → VIDEO</h1><p>Describe a scene and generate a short video</p></header>
<main><section class="panel">
<label for="prompt">Video description</label>
<textarea id="prompt" placeholder="Example: A cinematic sunset over a calm ocean, gentle waves, realistic style"></textarea>
<div class="row"><div><label for="seed">Seed</label><input id="seed" type="number" value="-1"></div><div><label for="steps">Quality steps</label><input id="steps" type="number" min="1" max="100" value="25"></div></div>
<div class="actions"><button id="generate">Generate video</button><button id="clear" class="secondary" type="button">Clear</button></div>
<div id="status" class="status" role="status"></div><div id="result" class="result"></div>
</section><a class="back" href="../index.html">← Back to home</a></main>
<footer>Video generation is provided by the connected open model service.</footer>
<script type="module">
import {Client} from 'https://cdn.jsdelivr.net/npm/@gradio/client/+esm';
const SPACE='ali-vilab/modelscope-text-to-video-synthesis';
const prompt=document.getElementById('prompt'),seed=document.getElementById('seed'),steps=document.getElementById('steps');
const generate=document.getElementById('generate'),clear=document.getElementById('clear'),status=document.getElementById('status'),result=document.getElementById('result');
let client;
function message(text){status.textContent=text}
function videoUrl(value){if(!value)return null;if(typeof value==='string')return value;if(value.url)return value.url;if(value.path)return 'https://ali-vilab-modelscope-text-to-video-synthesis.hf.space/file='+value.path;return null}
generate.addEventListener('click',async()=>{
 const text=prompt.value.trim(); if(!text){message('Write a video description first.');return}
 generate.disabled=true;result.innerHTML='';message('Connecting to the generator…');
 try{
  client ||= await Client.connect(SPACE);
  message('Generating video. The free service may place you in a queue…');
  const response=await client.predict('/generate',{prompt:text,seed:Number(seed.value)||-1,num_frames:16,num_inference_steps:Number(steps.value)||25});
  const value=response?.data?.[0],url=videoUrl(value);
  if(!url)throw new Error('The generator returned no video.');
  result.innerHTML='<video controls autoplay loop></video><p>Video generated successfully.</p>';result.querySelector('video').src=url;message('Done.');
 }catch(error){console.error(error);message('Generation failed: '+(error?.message||'The service may be unavailable or its API may have changed.'))}
 finally{generate.disabled=false}
});
clear.addEventListener('click',()=>{prompt.value='';result.innerHTML='';message('')});
</script>
</body>
</html>
