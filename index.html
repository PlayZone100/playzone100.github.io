<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>QuestMart</title>
</head>
<body>
  <p>Loading QuestMart…</p>
  <script>
    (async function () {
      var source = 'https://raw.githubusercontent.com/PlayZone100/playzone100.github.io/127fcc6d89713deca8bb9aac6cbd8b9636238778/index.html';
      try {
        var response = await fetch(source, { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        var html = await response.text();
        html = html.replace('</body>', '<script src="./questmart-chat.js?v=999"><\\/script>\\n</body>');
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        document.body.innerHTML = '<p>QuestMart could not load. Please refresh the page.</p>';
        console.error(error);
      }
    })();
  </script>
</body>
</html>
