<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlayZone100 - Game Center</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&family=Space+Grotesk:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080a0f;color:#fff;font-family:'Space Grotesk',sans-serif;min-height:100vh}
header{padding:28px 20px;text-align:center;border-bottom:1px solid rgba(255,255,255,.08)}
header h1{font-family:'Outfit',sans-serif;font-size:42px;letter-spacing:-1px}
header h1 span{background:linear-gradient(90deg,#7cff5e,#00e5ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
header p{opacity:.6;margin-top:6px;font-size:14px;letter-spacing:2px}
#status{text-align:center;padding:20px;opacity:.7;font-size:13px}
#grid{max-width:1100px;margin:0 auto;padding:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.card{background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:18px;transition:.2s}
.card:hover{transform:translateY(-4px);border-color:rgba(124,255,94,.4)}
.icon{font-size:42px;margin-bottom:10px}
.title{font-family:'Outfit',sans-serif;font-size:20px;font-weight:800;text-transform:uppercase}
.path{font-size:12px;opacity:.5;margin:6px 0 12px;word-break:break-all}
.btn{display:inline-block;padding:10px 22px;border-radius:100px;background:linear-gradient(90deg,#7cff5e,#00e5ff);color:#000;font-weight:800;text-decoration:none;font-size:14px}
#how{max-width:700px;margin:40px auto;padding:18px;border:1px dashed rgba(255,255,255,.2);border-radius:12px;text-align:center;opacity:.6;font-size:13px;line-height:1.6}
</style>
</head>
<body>
<header>
<h1>PLAYZONE<span>100</span></h1>
<p>GAME CENTER • AUTO-DISCOVERY • NEVER EDIT AGAIN</p>
</header>
<div id="status">Loading games from /games/ ...</div>
<div id="grid"></div>
<div id="how">
To add a new game: create <b>games/your-game-name/index.html</b> and push to <b>main</b> branch.<br>
It will appear here automatically. No need to edit this file ever again.
</div>
<script>
const OWNER='playzone100';
const REPO='playzone100.github.io';
const API=`https://api.github.com/repos/${OWNER}/${REPO}/contents/games?ref=main&nocache=${Date.now()}`;

function iconFor(name){
 if(name.includes('monkey')) return '🐒';
 if(name.includes('garden')) return '🌳';
 if(name.includes('monster') || name.includes('wild') || name.includes('bird') || name.includes('savage') || name.includes('wings') || name.includes('cut')) return '🦅⚔️';
 if(name.includes('racing')||name.includes('car')) return '🏎';
 if(name.includes('zombie')) return '🧟';
 if(name.includes('space')) return '🚀';
 return '🎮';
}
function titleFor(name){
 return name.split('-').map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(' ');
}

async function load(){
 const grid=document.getElementById('grid');
 const status=document.getElementById('status');
 try{
  const res=await fetch(API);
  if(!res.ok) throw new Error('API '+res.status);
  const data=await res.json();
  const folders=data.filter(x=>x.type==='dir').map(x=>x.name);
  if(folders.length===0) throw new Error('No folders found - make sure you pushed to main branch');
  status.textContent=`${folders.length} GAMES LIVE • AUTO-DISCOVERED`;
  grid.innerHTML='';
  folders.forEach(name=>{
   const div=document.createElement('div');
   div.className='card';
   div.innerHTML=`
    <div class="icon">${iconFor(name)}</div>
    <div class="title">${titleFor(name)}</div>
    <div class="path">./games/${name}/</div>
    <a class="btn" href="./games/${name}/">PLAY NOW →</a>
   `;
   grid.appendChild(div);
  });
 }catch(e){
  status.innerHTML=`API failed (${e.message}). Showing known games. Push folders to main to auto-detect.<br><small>Tip: If you are on branch bari20202, merge to main.</small>`;
  // fallback - show what we know exists
  const fallback=['monkey','garden-guardians'];
  grid.innerHTML='';
  fallback.forEach(name=>{
   const div=document.createElement('div');
   div.className='card';
   div.innerHTML=`
    <div class="icon">${iconFor(name)}</div>
    <div class="title">${titleFor(name)} ${name==='monkey'?'':'• LIVE'}</div>
    <div class="path">./games/${name}/</div>
    <a class="btn" href="./games/${name}/">PLAY NOW →</a>
   `;
   grid.appendChild(div);
  });
 }
}
load();
</script>
</body>
</html>
