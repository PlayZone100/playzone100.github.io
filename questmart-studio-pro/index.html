<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuestMart Studio Pro</title>
<style>html,body{margin:0;min-height:100%;background:#0f1216;color:#edf0f5;font:16px system-ui}main{min-height:100vh;display:grid;place-items:center;text-align:center}a{color:#f2a93b}</style>
</head>
<body>
<main id="status">Loading QuestMart Studio…<br><a href="/questmart-studio-pro.html">Open fallback</a></main>
<script>
(async function(){
  try {
    const response = await fetch('/questmart-studio-pro.html', {cache:'no-store'});
    if (!response.ok) throw new Error('HTTP '+response.status);
    const html = await response.text();
    document.open();
    document.write(html);
    document.close();
  } catch (error) {
    document.getElementById('status').innerHTML = 'QuestMart Studio could not load.<br><a href="/questmart-studio-pro.html">Open the HTML file directly</a>';
    console.error(error);
  }
})();
</script>
</body>
</html>
