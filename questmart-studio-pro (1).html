function smartTemplate(kind,p){const topic=(p.topic||"your topic").trim()||"your topic";if(kind==="title")return TITLE_HOOKS.map(h=>"• "+h.replaceAll("{topic}",topic)).join("\n");if(kind==="hashtags")return Array.from(new Set([...(topic.toLowerCase().replace(/[^a-z0-9 ]/g,"").split(/\s+/).filter(Boolean).map(w=>"#"+w)),"#contentcreator","#viral","#trending","#fyp","#growthhacks","#smallcreator"])) .slice(0,14).join(" ");if(kind==="script")return `HOOK (0:00–0:08)\nOpen with a bold claim or question about ${topic}.\n\nSETUP\nExplain why ${topic} matters in a ${p.tone||"conversational"} tone.\n\nVALUE\nBreak ${topic} into 3 concrete points.\n\nCTA\nOne clear next step — comment, follow, or click.`;return `1\n00:00:00,000 --> 00:00:03,200\nLet's talk about ${topic}.\n\n2\n00:00:03,200 --> 00:00:07,000\nHere's the one thing most people get wrong.`}
